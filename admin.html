<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Admin Console · Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ENTERPRISE / WALL STREET ADMIN CONSOLE
   ===================================================================== */
:root{
  /* Surfaces — deep navy ledger, not Google Material */
  --bg:              #f4f5f7;
  --surface:         #ffffff;
  --surface-2:       #eef0f3;
  --surface-3:       #e3e6eb;
  --surface-hover:   #eef0f3;
  --divider:         #d7dbe1;
  --divider-light:   #e7e9ed;

  --text:            #10131a;
  --text-2:          #4b5160;
  --text-3:          #7b8191;
  --text-4:          #b6bac4;

  /* Brass / gold accent replacing Google blue */
  --blue:            #9a7418;
  --blue-hover:      #7d5e13;
  --blue-soft:       #f5edd9;
  --blue-soft-hover: #efe3c4;

  --navy:            #0b1220;
  --navy-2:          #131b2c;

  --green:           #157a43;
  --green-soft:      #e4f3ea;
  --red:             #b3261e;
  --red-soft:        #fbe9e7;
  --amber:           #9a5a00;
  --amber-soft:      #fbeed9;
  --yellow:          #b8860b;

  --elev-1: 0 1px 2px 0 rgba(16,19,26,.16), 0 1px 3px 1px rgba(16,19,26,.08);
  --elev-2: 0 1px 2px 0 rgba(16,19,26,.2), 0 2px 6px 2px rgba(16,19,26,.08);
  --elev-3: 0 4px 8px 3px rgba(16,19,26,.1), 0 1px 3px rgba(16,19,26,.2);
  --elev-4: 0 8px 12px 6px rgba(16,19,26,.12), 0 4px 4px rgba(16,19,26,.2);

  --r-1: 3px;
  --r-2: 6px;
  --r-3: 10px;
  --r-4: 14px;
  --r-5: 20px;
  --r-pill: 999px;

  --font: "Playfair Display", Georgia, serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --ease: cubic-bezier(.4,0,.2,1);
  --ease-decel: cubic-bezier(0,0,.2,1);
  --ease-accel: cubic-bezier(.4,0,1,1);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  font-size:14px;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;font-family:inherit}
input,textarea,select{font:inherit;color:inherit;font-family:inherit}
input,textarea{
  background:var(--surface);
  border:1px solid var(--divider);
  border-radius:var(--r-1);
  padding:10px 12px;
  width:100%;
  font-size:14px;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease);
  color:var(--text);
}
input:hover:not(:focus),textarea:hover:not(:focus){border-color:var(--text-3)}
input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(154,116,24,.14)}
input::placeholder,textarea::placeholder{color:var(--text-4)}
textarea{resize:vertical;min-height:72px;line-height:1.55}
label{
  display:block;
  font-family:var(--font-body);
  font-size:12px;
  color:var(--text-2);
  font-weight:600;
  margin-bottom:6px;
  letter-spacing:.01em;
}
.hint{font-size:11.5px;color:var(--text-3);margin-top:6px;line-height:1.5}

/* ================= LOGIN ================= */
.login-wrap{
  display:grid;place-items:center;min-height:100vh;padding:24px;
  background:
    radial-gradient(ellipse 60% 50% at 50% 0%, rgba(154,116,24,.12), transparent 70%),
    var(--navy);
}
.login-card{
  width:100%;max-width:440px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--r-4);
  padding:44px 40px;
  background:var(--navy-2);
  box-shadow:var(--elev-4);
  text-align:center;
  color:#f4f5f7;
}
.login-card .mark{
  width:52px;height:52px;margin:0 auto 22px;
  display:grid;place-items:center;
  border-radius:50%;
  background:linear-gradient(155deg,#d4af37,#9a7418);
  color:#10131a;
  font-family:var(--font);
  font-weight:700;
  font-size:19px;
  letter-spacing:-.02em;
  box-shadow:0 8px 28px rgba(154,116,24,.35);
}
.login-card h1{
  font-family:var(--font);
  font-size:24px;
  font-weight:600;
  letter-spacing:-.01em;
  margin-bottom:8px;
  color:#f4f5f7;
}
.login-card .sub{
  color:#9aa1b0;
  font-size:13.5px;
  margin-bottom:30px;
  line-height:1.55;
  font-family:var(--font-mono);
  letter-spacing:.02em;
}
.login-card .field{margin-bottom:16px;text-align:left}
.login-card .field label{color:#c7cbd6}
.login-card input{
  background:rgba(255,255,255,.05);
  border-color:rgba(255,255,255,.14);
  color:#f4f5f7;
}
.login-card input::placeholder{color:#5b6272}
.login-card input:focus{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(212,175,55,.18)}
.login-btn{
  width:100%;
  background:linear-gradient(155deg,#d4af37,#9a7418);
  color:#10131a;
  padding:12px 24px;
  border-radius:var(--r-1);
  font-weight:700;
  font-size:13.5px;
  font-family:var(--font-body);
  letter-spacing:.02em;
  text-transform:uppercase;
  transition:filter .15s var(--ease),box-shadow .15s var(--ease);
  margin-top:14px;
}
.login-btn:hover{filter:brightness(1.08);box-shadow:0 8px 24px rgba(154,116,24,.4)}
.login-btn:active{filter:brightness(.96)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-error{
  color:#ff8a80;
  font-size:13px;
  margin-top:14px;
  min-height:18px;
  padding:8px 12px;
  border-radius:var(--r-1);
  background:rgba(179,38,30,.16);
  display:none;
  text-align:left;
}
.login-error.show{display:block}
.login-foot{
  margin-top:26px;padding-top:18px;
  border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;color:#5b6272;
  font-family:var(--font-mono);
  letter-spacing:.06em;
  text-transform:uppercase;
}

/* ================= APP SHELL ================= */
.app{display:grid;grid-template-rows:64px 1fr;height:100vh;height:100dvh;overflow:hidden}
.app.hidden{display:none}

/* ================= TOP APP BAR ================= */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  background:var(--navy);
  border-bottom:1px solid rgba(255,255,255,.08);
  gap:12px;
  z-index:40;
  height:64px;
  color:#f4f5f7;
}
.topbar .left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar .hamburger{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;
  color:#c7cbd6;
  transition:background .15s var(--ease);
}
.topbar .hamburger:hover{background:rgba(255,255,255,.08)}
.topbar .brand{
  display:flex;align-items:center;gap:10px;
  font-family:var(--font);
  font-size:19px;
  color:#f4f5f7;
  letter-spacing:-.01em;
  white-space:nowrap;
  font-weight:600;
}
.topbar .brand .logo-dot{
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(155deg,#d4af37,#9a7418);
  position:relative;flex-shrink:0;
}
.topbar .title{font-weight:600;color:#f4f5f7}
.topbar .divider-v{width:1px;height:24px;background:rgba(255,255,255,.14);margin:0 4px}
.topbar .doc-name{
  font-size:13px;color:#9aa1b0;
  max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--font-mono);
}
.topbar .dirty-badge{
  display:none;
  background:rgba(212,175,55,.16);
  color:#e5c563;
  padding:3px 10px;
  border-radius:var(--r-pill);
  font-size:11px;
  font-weight:600;
  margin-left:8px;
  font-family:var(--font-mono);
  letter-spacing:.03em;
}
.topbar .dirty-badge.show{display:inline-block}
.topbar .right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.topbar .saving{
  font-size:12px;color:#9aa1b0;margin-right:8px;
  display:none;align-items:center;gap:6px;
  font-family:var(--font-mono);
}
.topbar .saving.show{display:flex}
.spinner-sm{
  width:14px;height:14px;border-radius:50%;
  border:2px solid rgba(255,255,255,.18);
  border-top-color:var(--yellow);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-2);
  transition:background .15s var(--ease);
  flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-hover)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn.small{width:32px;height:32px}
.topbar .icon-btn{color:#c7cbd6}
.topbar .icon-btn:hover{background:rgba(255,255,255,.08)}
.topbar .icon-btn:disabled{opacity:.35}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:0 22px;
  height:36px;
  border-radius:var(--r-1);
  font-size:13px;
  font-weight:600;
  font-family:var(--font-body);
  color:var(--blue);
  transition:background .15s var(--ease),box-shadow .15s var(--ease);
  white-space:nowrap;
  border:1px solid transparent;
  letter-spacing:.01em;
}
.btn:hover{background:var(--blue-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed;background:transparent}
.btn.filled{background:linear-gradient(155deg,#d4af37,#9a7418);color:#10131a}
.btn.filled:hover{filter:brightness(1.06);box-shadow:var(--elev-1)}
.btn.text{color:var(--text-2);padding:0 12px}
.btn.text:hover{background:var(--surface-hover);color:var(--text)}
.btn.text.danger{color:var(--red)}
.btn.text.danger:hover{background:var(--red-soft)}
.btn.outlined{border-color:var(--divider);color:var(--text-2)}
.btn.outlined:hover{background:var(--surface-hover);border-color:var(--text-3)}
.btn.mini{height:32px;padding:0 14px;font-size:12.5px}
.topbar .btn.text{color:#c7cbd6}
.topbar .btn.text:hover{background:rgba(255,255,255,.08);color:#fff}

/* ================= MAIN LAYOUT ================= */
.workspace{
  display:grid;
  grid-template-columns:280px 1fr 1fr;
  height:100%;
  overflow:hidden;
  transition:grid-template-columns .3s var(--ease);
}
.workspace.no-preview{grid-template-columns:280px 1fr 0}

/* ================= SIDEBAR ================= */
.sidebar{
  background:var(--surface);
  border-right:1px solid var(--divider-light);
  overflow-y:auto;
  padding:12px 8px;
  display:flex;flex-direction:column;gap:2px;
}
.sidebar-header{
  padding:12px 12px 8px;
  font-size:10.5px;
  font-family:var(--font-body);
  color:var(--text-3);
  letter-spacing:.1em;
  text-transform:uppercase;
  font-weight:700;
  display:flex;justify-content:space-between;align-items:center;
}
.sidebar-header button{
  font-size:18px;color:var(--text-2);
  width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;
  transition:background .15s var(--ease);
}
.sidebar-header button:hover{background:var(--surface-hover)}
.sidebar a{
  display:flex;align-items:center;gap:14px;
  padding:8px 14px 8px 16px;
  border-radius:0 var(--r-pill) var(--r-pill) 0;
  color:var(--text-2);
  font-size:13.5px;
  font-family:var(--font-body);
  font-weight:500;
  transition:background .15s var(--ease),color .15s var(--ease);
  cursor:pointer;
  margin-right:8px;
  position:relative;
  height:40px;
}
.sidebar a:hover{background:var(--surface-hover);color:var(--text)}
.sidebar a.active{background:var(--blue-soft);color:var(--blue-hover)}
.sidebar a.active:hover{background:var(--blue-soft-hover)}
.sidebar a .icon{
  width:20px;height:20px;
  display:grid;place-items:center;
  font-size:16px;
  flex-shrink:0;
}
.sidebar a .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar a .count{
  font-size:11px;
  background:var(--surface-2);
  padding:1px 8px;
  border-radius:var(--r-pill);
  color:var(--text-3);
  font-family:var(--font-mono);
  font-weight:500;
  margin-left:auto;
}
.sidebar a.active .count{background:rgba(154,116,24,.14);color:var(--blue-hover)}
.sidebar .divider{height:1px;background:var(--divider-light);margin:10px 8px}

/* ================= EDITOR ================= */
.editor{
  overflow-y:auto;
  padding:32px 40px 120px;
  background:var(--surface);
  position:relative;
}
.editor-head{margin-bottom:32px}
.editor-head .h-left h2{
  font-family:var(--font);
  font-size:23px;
  letter-spacing:-.01em;
  font-weight:600;
  margin-bottom:6px;
  color:var(--text);
}
.editor-head .h-left p{
  color:var(--text-2);
  font-size:13.5px;
  max-width:60ch;
  line-height:1.55;
}
.editor-head .h-actions{display:flex;gap:8px;flex-shrink:0;margin-top:16px}
.editor-inner{max-width:820px;margin:0 auto}

.field{margin-bottom:20px;position:relative}
.field > label{font-size:12px;color:var(--text-2);font-weight:600;margin-bottom:8px}

/* ================= ARRAY BLOCKS ================= */
.array-block{margin-bottom:8px}
.array-block > label{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
  font-size:13px;
  color:var(--text-2);
  font-weight:600;
}
.array-block > label .arr-meta{font-size:12px;color:var(--text-3);font-weight:400;font-family:var(--font-mono)}
.array-item{
  background:var(--surface);
  border:1px solid var(--divider);
  border-radius:var(--r-2);
  margin-bottom:12px;
  overflow:hidden;
  transition:box-shadow .15s var(--ease),border-color .15s var(--ease);
}
.array-item:hover{border-color:var(--text-3)}
.array-item.dragging{opacity:.4}
.array-item.drag-over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.array-item .item-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;
  background:var(--surface-2);
  border-bottom:1px solid var(--divider-light);
  cursor:pointer;user-select:none;
  transition:background .15s var(--ease);
}
.array-item .item-head:hover{background:var(--surface-3)}
.array-item .item-head .drag-handle{
  cursor:grab;color:var(--text-4);
  font-size:16px;line-height:1;
  padding:0 6px;margin-left:-6px;
  transition:color .15s var(--ease);
}
.array-item .item-head .drag-handle:hover{color:var(--text-2)}
.array-item .item-head .drag-handle:active{cursor:grabbing}
.array-item .item-head .item-title{
  font-family:var(--font-body);
  font-size:13px;
  color:var(--text);
  font-weight:600;
  display:flex;align-items:center;gap:10px;
  overflow:hidden;
  flex:1;
  min-width:0;
}
.array-item .item-head .item-title > span:not(.drag-handle):not(.pill){
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.array-item .item-head .item-title .pill{
  background:var(--surface);
  color:var(--text-3);
  padding:2px 8px;
  border-radius:var(--r-pill);
  font-size:11px;
  font-weight:600;
  flex-shrink:0;
  font-family:var(--font-mono);
}
.item-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.item-actions .icon-btn{width:32px;height:32px;font-size:16px}
.item-actions .icon-btn.del:hover{background:var(--red-soft);color:var(--red)}
.array-item .item-body{padding:20px 16px;display:grid;gap:16px}
.array-item.collapsed .item-body{display:none}
.array-item.collapsed .item-head{border-bottom:0}

.add-btn{
  margin-top:6px;
  padding:12px 18px;
  border:1px dashed var(--divider);
  border-radius:var(--r-2);
  width:100%;
  color:var(--blue-hover);
  font-size:13px;
  font-weight:600;
  font-family:var(--font-body);
  transition:background .15s var(--ease),border-color .15s var(--ease);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.add-btn:hover{border-color:var(--blue);background:var(--blue-soft)}

/* ================= IMAGE FIELD ================= */
.image-field{display:flex;gap:20px;align-items:flex-start}
.image-preview{
  width:140px;height:140px;
  border-radius:var(--r-2);
  background:var(--surface-2);
  border:1px solid var(--divider-light);
  overflow:hidden;flex-shrink:0;
  display:grid;place-items:center;
  font-size:12px;color:var(--text-3);
}
.image-preview img{width:100%;height:100%;object-fit:cover}
.image-inputs{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.file-label{
  display:inline-flex;align-items:center;gap:8px;
  padding:0 16px;height:36px;
  border:1px solid var(--divider);
  border-radius:var(--r-1);
  font-size:13px;cursor:pointer;
  background:var(--surface);
  width:fit-content;
  transition:background .15s var(--ease);
  color:var(--text);
  font-weight:600;
  font-family:var(--font-body);
}
.file-label:hover{background:var(--surface-hover)}
input[type=file]{display:none}

/* ================= PREVIEW PANE ================= */
.preview-pane{
  background:var(--surface);
  border-left:1px solid var(--divider-light);
  display:flex;flex-direction:column;
  overflow:hidden;min-width:0;
}
.preview-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  border-bottom:1px solid var(--divider-light);
  background:var(--surface);
  gap:12px;flex-shrink:0;
}
.preview-head .ph-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.preview-head .ph-left .live-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--green);
  flex-shrink:0;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.preview-head .ph-left .url-box{
  background:var(--surface-2);
  border-radius:var(--r-pill);
  padding:6px 14px;
  font-size:12px;color:var(--text-2);
  flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--font-mono);
}
.preview-head .ph-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.device-toggle{display:flex;background:var(--surface-2);border-radius:var(--r-pill);padding:2px}
.device-toggle button{
  padding:6px 12px;font-size:13px;
  border-radius:var(--r-pill);
  color:var(--text-2);
  transition:background .15s var(--ease),color .15s var(--ease);
}
.device-toggle button.active{background:var(--surface);color:var(--text);box-shadow:var(--elev-1)}
.preview-frame-wrap{
  flex:1;overflow:auto;
  background:var(--surface-2);
  display:flex;justify-content:center;
  padding:16px;position:relative;
}
.preview-frame-wrap iframe{
  width:100%;height:100%;
  border:1px solid var(--divider);
  border-radius:var(--r-2);
  background:#fff;
  transition:width .3s var(--ease),max-width .3s var(--ease);
  box-shadow:var(--elev-2);
}
.preview-frame-wrap.device-mobile iframe{width:390px;max-width:100%}
.preview-frame-wrap.device-tablet iframe{width:768px;max-width:100%}

/* ================= STATUS TOAST ================= */
.status-bar{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(8px);
  background:var(--navy-2);
  color:#fff;
  padding:14px 20px;
  border-radius:var(--r-1);
  font-size:13.5px;
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--elev-4);
  opacity:0;
  transition:opacity .25s var(--ease),transform .25s var(--ease);
  pointer-events:none;
  z-index:100;
  max-width:calc(100vw - 48px);
}
.status-bar.show{opacity:1;transform:translateX(-50%) translateY(0)}
.status-bar .ico{
  width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;font-size:12px;
  background:rgba(255,255,255,.15);flex-shrink:0;
}
.status-bar.ok .ico{background:var(--green)}
.status-bar.err .ico{background:var(--red)}
.status-bar.info .ico{background:var(--blue)}

/* ================= COMMAND PALETTE ================= */
.cmd-overlay{
  position:fixed;inset:0;
  background:rgba(11,18,32,.6);
  backdrop-filter:blur(2px);
  z-index:200;display:none;
  align-items:flex-start;justify-content:center;
  padding-top:12vh;
}
.cmd-overlay.show{display:flex}
.cmd-box{
  width:100%;max-width:600px;
  background:var(--surface);
  border-radius:var(--r-3);
  box-shadow:var(--elev-4);
  overflow:hidden;
  animation:cmdIn .2s var(--ease-decel);
}
@keyframes cmdIn{from{opacity:0;transform:translateY(-16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.cmd-search{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--divider-light)}
.cmd-search .search-ico{color:var(--text-3);flex-shrink:0}
.cmd-input{flex:1;border:0;padding:0;background:transparent;font-size:16px;color:var(--text)}
.cmd-input:focus{outline:none;box-shadow:none;border:0;background:transparent}
.cmd-input::placeholder{color:var(--text-4)}
.cmd-results{max-height:400px;overflow-y:auto;padding:8px}
.cmd-item{padding:12px 16px;border-radius:var(--r-2);cursor:pointer;display:flex;align-items:center;gap:14px;font-size:14px;color:var(--text)}
.cmd-item:hover,.cmd-item.selected{background:var(--surface-hover)}
.cmd-item .ico{width:24px;text-align:center;color:var(--text-3);flex-shrink:0}
.cmd-item .txt{flex:1;min-width:0}
.cmd-item .txt small{display:block;color:var(--text-3);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-empty{padding:48px 24px;text-align:center;color:var(--text-3);font-size:13.5px}

/* ================= MODAL ================= */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(11,18,32,.6);
  z-index:210;display:none;
  align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.show{display:flex}
.modal{
  width:100%;max-width:560px;
  background:var(--surface);
  border-radius:var(--r-4);
  box-shadow:var(--elev-4);
  overflow:hidden;max-height:88vh;
  display:flex;flex-direction:column;
  animation:modalIn .2s var(--ease-decel);
}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-head{padding:24px 24px 8px;display:flex;justify-content:space-between;align-items:flex-start}
.modal-head h3{font-family:var(--font);font-size:20px;letter-spacing:-.01em;font-weight:600}
.modal-body{padding:8px 24px 20px;overflow-y:auto;flex:1}
.modal-foot{padding:16px 24px 20px;display:flex;justify-content:flex-end;gap:8px}
.modal textarea{
  font-family:var(--font-mono);
  font-size:12.5px;
  min-height:280px;
  background:var(--surface-2);
  border-color:var(--divider-light);
}

/* ================= SCROLLBAR ================= */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--text-4);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);border:3px solid transparent;background-clip:padding-box}

/* ================= AUTO-LOGOUT WARNING ================= */
.session-warn{position:fixed;inset:0;z-index:300;background:rgba(11,18,32,.6);display:none;align-items:center;justify-content:center;padding:20px}
.session-warn.show{display:flex}
.session-warn .sw-box{width:100%;max-width:440px;background:var(--surface);border-radius:var(--r-4);box-shadow:var(--elev-4);padding:28px 28px 20px;text-align:left}
.session-warn h3{font-family:var(--font);font-size:20px;font-weight:600;margin-bottom:10px;letter-spacing:-.01em}
.session-warn p{font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:8px}
.session-warn .sw-count{font-family:var(--font-mono);background:var(--amber-soft);color:var(--amber);padding:2px 8px;border-radius:var(--r-1);font-weight:600}
.session-warn .sw-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}

/* ================= SIDEBAR BACKDROP (mobile) ================= */
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(11,18,32,.6);z-index:190}
.sidebar-backdrop.show{display:block}

/* =====================================================================
   RESPONSIVE
   ===================================================================== */
@media(max-width:1200px){ .workspace{grid-template-columns:260px 1fr 1fr} }
@media(max-width:1024px){
  .workspace{grid-template-columns:240px 1fr}
  .preview-pane{display:none}
  .workspace.show-preview .preview-pane{display:flex;position:fixed;inset:64px 0 0 0;z-index:60;border-left:0;background:var(--surface)}
  .workspace.show-preview .editor{display:none}
}
@media(max-width:768px){
  body{font-size:14px}
  .app{height:100dvh;grid-template-rows:auto 1fr}
  .topbar{height:56px;padding:0 8px;gap:6px;padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:80}
  .topbar .brand .logo-dot{width:22px;height:22px}
  .topbar .brand{font-size:16px}
  .topbar .doc-name{display:none}
  .topbar .divider-v{display:none}
  .topbar .right{gap:2px}
  .topbar .btn{padding:0 14px;height:34px;font-size:13px}
  .topbar .btn .btn-label{display:none}
  .topbar #viewSiteBtn,.topbar #reloadBtn{display:none}
  .topbar .btn.filled{padding:0 14px;min-width:44px;justify-content:center}
  .topbar .btn.filled::before{content:'💾';font-size:16px;margin-right:0}
  .toolbar-group{display:none}
  .saving{font-size:11px}

  .workspace{grid-template-columns:1fr;height:auto;overflow:visible}

  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:288px;z-index:200;
    transform:translateX(-100%);
    transition:transform .25s var(--ease);
    padding:calc(12px + env(safe-area-inset-top)) 8px calc(20px + env(safe-area-inset-bottom));
    box-shadow:var(--elev-4);
    border-right:0;
  }
  .sidebar.open{transform:translateX(0)}

  .editor{padding:20px 16px calc(100px + env(safe-area-inset-bottom));overflow:visible}
  .editor-head .h-left h2{font-size:20px}
  .editor-head .h-left p{font-size:13px}
  .editor-head .h-actions{margin-top:12px}

  input,textarea{font-size:16px;padding:12px 14px}
  textarea{min-height:100px}

  .array-item .item-body{grid-template-columns:1fr !important;padding:16px 12px;gap:14px}
  .array-item .item-body > div{grid-column:1 / -1 !important}
  .item-actions .icon-btn{width:36px;height:36px;font-size:16px}
  .array-item .item-head{padding:12px 14px}
  .array-item .item-head .item-title > span:not(.drag-handle):not(.pill){max-width:120px}

  .image-field{flex-direction:column}
  .image-preview{width:100%;height:200px}

  .preview-pane{position:fixed;inset:0;z-index:150;padding-top:calc(56px + env(safe-area-inset-top));background:var(--bg)}
  .workspace:not(.show-preview) .preview-pane{display:none}
  .workspace.show-preview .preview-pane{display:flex}
  .preview-head{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
  .preview-frame-wrap{padding:8px}
  .preview-frame-wrap.device-mobile iframe,
  .preview-frame-wrap.device-tablet iframe{width:100%;max-width:100%}

  .status-bar{bottom:calc(20px + env(safe-area-inset-bottom));font-size:13px;padding:12px 16px}

  .cmd-overlay{padding-top:0;align-items:flex-end}
  .cmd-box{max-width:none;border-radius:var(--r-4) var(--r-4) 0 0}
  .cmd-search{padding:18px 20px}
  .cmd-input{font-size:16px}
  .cmd-results{max-height:60vh}
  .cmd-item{padding:14px 16px;font-size:15px}

  .modal-overlay{padding:0;align-items:flex-end}
  .modal{max-width:none;border-radius:var(--r-4) var(--r-4) 0 0;max-height:92vh}
  .modal-head{padding:20px 20px 8px}
  .modal-body{padding:8px 20px 16px}
  .modal-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom))}
  .modal textarea{min-height:200px;font-size:12.5px}

  .session-warn{align-items:flex-end;padding:0}
  .session-warn .sw-box{border-radius:var(--r-4) var(--r-4) 0 0;max-width:none}
}
@media(max-width:400px){
  .topbar .dirty-badge{font-size:10.5px;padding:2px 8px}
  .topbar .brand{font-size:15px}
}
@supports(-webkit-touch-callout:none){
  input,textarea,select{font-size:16px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="mark">CA</div>
    <h1>Admin Console</h1>
    <p class="sub">Secure access · Portfolio content management</p>
    <div class="field">
      <label for="loginUser">Username</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="admin">
    </div>
    <div class="field">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="Enter your password">
    </div>
    <button class="login-btn" id="loginBtn">Sign in</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-foot">Authorized personnel only</div>
  </div>
</div>

<!-- APP -->
<div class="app hidden" id="app">
  <div class="topbar">
    <div class="left">
      <button class="hamburger" id="mobileMenuBtn" style="display:none" title="Menu" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="brand">
        <span class="logo-dot"></span>
        <span class="title">Admin Console</span>
      </div>
      <div class="divider-v"></div>
      <span class="doc-name" id="docName">—</span>
      <span class="dirty-badge" id="dirtyBadge">Unsaved changes</span>
    </div>
    <div class="right">
      <div class="saving" id="savingIndicator"><span class="spinner-sm"></span><span>Saving…</span></div>
      <div class="toolbar-group" style="display:flex;gap:4px">
        <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
        <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
        </button>
      </div>
      <button class="icon-btn" id="previewToggle" title="Toggle live preview" aria-label="Preview">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="icon-btn" id="cmdBtn" title="Command palette (Ctrl+K)" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button class="btn text" id="viewSiteBtn" title="Open live site">↗ <span class="btn-label">Site</span></button>
      <button class="btn text" id="reloadBtn" title="Reload from server"><span class="btn-label">Reload</span></button>
      <button class="btn filled" id="saveBtn" title="Save (Ctrl+S)"><span class="btn-label">Save</span></button>
      <button class="icon-btn" id="accountBtn" title="Account" aria-label="Account">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v2"/></svg>
      </button>
    </div>
  </div>

  <div class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <main class="editor" id="editor"></main>
    <aside class="preview-pane" id="previewPane">
      <div class="preview-head">
        <div class="ph-left">
          <span class="live-dot"></span>
          <div class="url-box" id="previewUrl">/ · live preview</div>
        </div>
        <div class="ph-right">
          <div class="device-toggle">
            <button data-device="desktop" class="active" title="Desktop" aria-label="Desktop">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            </button>
            <button data-device="tablet" title="Tablet" aria-label="Tablet">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            </button>
            <button data-device="mobile" title="Mobile" aria-label="Mobile">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            </button>
          </div>
          <button class="icon-btn small" id="refreshPreview" title="Reload preview" aria-label="Reload preview">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
          <button class="icon-btn small" id="closePreview" title="Close preview" style="display:none" aria-label="Close preview">✕</button>
        </div>
      </div>
      <div class="preview-frame-wrap" id="previewWrap">
        <iframe id="previewFrame" src="/" title="Live preview"></iframe>
      </div>
    </aside>
  </div>
</div>

<div class="status-bar" id="statusBar"><span class="ico" id="statusIco">✓</span><span id="statusMsg"></span></div>

<!-- COMMAND PALETTE -->
<div class="cmd-overlay" id="cmdOverlay">
  <div class="cmd-box">
    <div class="cmd-search">
      <svg class="search-ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="cmd-input" id="cmdInput" placeholder="Search sections, fields, or type a command…" autocomplete="off">
    </div>
    <div class="cmd-results" id="cmdResults"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Modal</h3>
      <button class="icon-btn small" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- SESSION TIMEOUT WARNING -->
<div class="session-warn" id="sessionWarn">
  <div class="sw-box">
    <h3>Still there?</h3>
    <p>You've been inactive for a while. For your security, you'll be signed out in <span class="sw-count" id="swCount">60</span> seconds.</p>
    <p style="color:var(--text-3);font-size:13px">Any unsaved changes will be lost.</p>
    <div class="sw-actions">
      <button class="btn text" id="swLogout">Sign out now</button>
      <button class="btn filled" id="swStay">Stay signed in</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const IDLE_WARN_MS  = 25 * 60 * 1000;  // show warning after 25 min idle
const IDLE_LOGOUT_MS = 30 * 60 * 1000; // hard logout at 30 min idle
const WARN_COUNTDOWN_S = 60;

/* =====================================================================
   STATE
   ===================================================================== */
let state = {};
let creds = null;
let dirty = false;
let history = { stack:[], index:-1 };
let currentPanel = 'meta';
let previewVisible = true;
let previewReady = false;
let idleTimer = null;
let warnTimer = null;
let warnCountdownTimer = null;
let lastActivity = Date.now();

/* The set of section keys that ship with the console. Anything else found
   in the database (custom sections created via "Add custom section") gets
   auto-registered into SCHEMA on load so it always stays editable. */
const BASE_SCHEMA_KEYS = ['meta','nav','hero','photo','stats','ticker','about','services','tools','experience','certifications','cta','footer'];

/* =====================================================================
   SCHEMA — every field the live site can render lives here.
   Nothing is hydrated from hard-coded sample content: the database
   (/api/data) is always the single source of truth. The "ph" strings
   below are placeholder hints only — shown greyed-out in empty inputs,
   never written into state.
   ===================================================================== */
const SCHEMA = {
  meta:{label:"Site Meta",icon:"🌐",fields:{
    title:{label:"Page title",type:"text",ph:"Full Name — Chartered Accountant · Audit & Assurance",help:"Shown in the browser tab and in search results."},

    lastName:{label:"Last name",type:"text",ph:"Name.",help:"Line 2 of the headline — shown in the accent color."},
    role:{label:"Role",type:"text",ph:"Chartered Accountant"},
    roleCompany:{label:"Role focus",type:"text",ph:"Audit & Assurance",help:"Shown after the role."},

    primaryBtnLink:{label:"Primary button link",type:"text",ph:"mailto:you@yourfirm.com"},
    secondaryBtnText:{label:"Secondary button text",type:"text",ph:"Download credentials",help:"Leave blank to hide the second button."},
    secondaryBtnLink:{label:"Secondary button link",type:"text",ph:"#"},
    trust:{label:"Trust indicators",type:"array",itemLabel:"Trust item",itemFields:{

      value:{label:"Value",type:"text",ph:"Registered with ICAI"}
    },help:"Small facts shown beneath the hero buttons. 3 items is the cleanest layout."}
  }},
  photo:{label:"Photo & Badges",icon:"📸",fields:{
    url:{label:"Photo",type:"image",help:"Upload or paste a URL. Auto-compressed to ~1200px JPEG."},
    badgeFounderLabel:{label:"Badge 1 · label",type:"text",ph:"Principal"},
    badgeFounderText:{label:"Badge 1 · text",type:"text",ph:"Audit & Assurance"},
    badgeStatusLabel:{label:"Badge 2 · label",type:"text",ph:"Currently"},
    badgeStatusText:{label:"Badge 2 · text",type:"text",ph:"Accepting new engagements"},
    badgeGoldLabel:{label:"Badge 3 · label",type:"text",ph:"Membership",help:"Leave blank to hide this badge entirely."},
    badgeGoldText:{label:"Badge 3 · text",type:"text",ph:"ICAI · Member"}
  }},
  stats:{label:"Stats Strip",icon:"📊",isTopArray:true,itemLabel:"Stat",itemFields:{
    num:{label:"Number",type:"text",ph:"250"},

    label:{label:"Label",type:"text",ph:"Statutory audits completed"}
  },help:"A horizontal strip of key figures. Keep to 3–4 items for the cleanest layout."},
  ticker:{label:"Market Ticker",icon:"📉",isTopArray:true,itemLabel:"Ticker item",itemFields:{
    sym:{label:"Symbol",type:"text",ph:"NIFTY",help:"Short label, e.g. NIFTY, SENSEX, GOLD."},
    val:{label:"Value",type:"text",ph:"24,812.30",help:"The main value shown."},
    chg:{label:"Direction",type:"text",ph:"up",help:"Type 'up' or 'down' to set the indicator color."},
    chgText:{label:"Change text",type:"text",ph:"+0.42%",help:"Shown next to the indicator."}
  },help:"The scrolling ticker tape above the navigation bar. Scrolls right-to-left and pauses on hover."},
  about:{label:"About",icon:"👤",fields:{
    tag:{label:"Section tag",type:"text",ph:"About"},
    heading:{label:"Heading",type:"text",ph:"A disciplined approach to"},
    headingEm:{label:"Heading (accent)",type:"text",ph:"the numbers."},
    paragraphs:{label:"Paragraphs (HTML allowed)",type:"array",itemLabel:"Paragraph",simple:true,simpleField:{label:"Text",type:"textarea",ph:"A paragraph about your practice, background or philosophy…"}},

  services:{label:"Services",icon:"💼",fields:{

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getPath = (obj,path)=>path.split('.').reduce((o,k)=>o?.[k],obj);
const setPath = (obj,path,val)=>{const keys=path.split('.');const last=keys.pop();let cur=obj;for(const k of keys){if(cur[k]==null)cur[k]={};cur=cur[k];}cur[last]=val;};
const authHeader = () => 'Basic ' + btoa(creds.user+':'+creds.pass);
const isMobile = () => window.matchMedia('(max-width:768px)').matches;

function deepMerge(base, src){
  if(Array.isArray(base)) return Array.isArray(src)?src:base;
  if(base && typeof base==='object'){
    if(!src || typeof src!=='object') return base;
    for(const k in src) base[k] = (k in base)?deepMerge(base[k],src[k]):src[k];
    return base;
  }
  return (src===undefined||src===null)?base:src;
}

/* Build a blank, schema-shaped object — no sample content, ever.
   This is what state starts from before the database's real content
   is merged on top of it. */
function emptyValueForField(f){
  if(f.type==='array') return [];
  if(f.type==='csv') return [];
  return '';
}
function buildEmptySkeleton(){
  const skel = {};
  for(const [key,s] of Object.entries(SCHEMA)){
    if(s.isTopArray){ skel[key] = []; continue; }
    const obj = {};
    for(const [fk,fs] of Object.entries(s.fields)) obj[fk] = emptyValueForField(fs);
    skel[key] = obj;
  }
  return skel;
}

/* Custom section template used both when adding a new one and when
   auto-registering one that already exists in the database. */
function customSectionSchema(label, icon){
  return {
    label, icon: icon||'📄', custom:true,
    fields:{
      tag:{label:'Section tag',type:'text',ph:'Section'},
      heading:{label:'Heading',type:'text',ph:'My'},
      headingEm:{label:'Heading (accent)',type:'text',ph:'items.'},
      items:{label:label,type:'array',itemLabel:'Item',itemFields:{
        icon:{label:'Icon (emoji)',type:'text',ph:'🏆'},
        title:{label:'Title',type:'text',ph:'Item name'},
        desc:{label:'Description',type:'textarea',ph:'What is it about…'}
      }}
    }
  };
}

/* Any top-level key present in the loaded database record that isn't a
   base section gets registered into SCHEMA so it renders as an editable
   panel in the sidebar — this is what keeps previously-added custom
   sections editable across reloads. */
function hydrateCustomSectionsFromState(){
  for(const key of Object.keys(state)){
    if(BASE_SCHEMA_KEYS.includes(key)) continue;
    if(SCHEMA[key]) continue;
    const s = state[key];
    if(!s || typeof s !== 'object' || !Array.isArray(s.items)) continue;
    SCHEMA[key] = customSectionSchema(s.tag || key, '📄');
  }
}

function toast(msg, kind='ok'){
  const bar=$('statusBar'), ico=$('statusIco'), m=$('statusMsg');
  bar.className='status-bar show '+kind;
  ico.textContent = kind==='ok'?'✓':kind==='err'?'!':'i';
  m.textContent = msg;
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>bar.classList.remove('show'),2800);
}

let setDirty = function(v){
  dirty = v;
  $('dirtyBadge').classList.toggle('show', dirty);
};

/* =====================================================================
   HISTORY
   ===================================================================== */
function pushHistory(){
  history.stack = history.stack.slice(0, history.index+1);
  history.stack.push(JSON.stringify(state));
  if(history.stack.length > 60) history.stack.shift();
  history.index = history.stack.length - 1;
  updateUndoRedo();
}
function updateUndoRedo(){
  $('undoBtn').disabled = history.index <= 0;
  $('redoBtn').disabled = history.index >= history.stack.length - 1;
}
function undo(){
  if(history.index <= 0) return;
  history.index--;
  state = JSON.parse(history.stack[history.index]);
  hydrateCustomSectionsFromState();
  renderSidebar();
  renderPanel(currentPanel);
  syncPreview();
  setDirty(true);
  updateUndoRedo();
}
function redo(){
  if(history.index >= history.stack.length - 1) return;
  history.index++;
  state = JSON.parse(history.stack[history.index]);
  hydrateCustomSectionsFromState();
  renderSidebar();
  renderPanel(currentPanel);
  syncPreview();
  setDirty(true);
  updateUndoRedo();
}
$('undoBtn').addEventListener('click', undo);
$('redoBtn').addEventListener('click', redo);

/* =====================================================================
   SESSION / AUTO-LOGOUT
   ===================================================================== */
function resetIdleTimer(){
  lastActivity = Date.now();
  if(idleTimer) clearTimeout(idleTimer);
  if(warnTimer) clearTimeout(warnTimer);
  idleTimer = setTimeout(showSessionWarning, IDLE_WARN_MS);
}
function clearIdleTimers(){
  if(idleTimer) clearTimeout(idleTimer);
  if(warnTimer) clearTimeout(warnTimer);
  if(warnCountdownTimer) clearInterval(warnCountdownTimer);
  idleTimer = warnTimer = warnCountdownTimer = null;
}
function showSessionWarning(){
  let remaining = WARN_COUNTDOWN_S;
  $('swCount').textContent = remaining;
  $('sessionWarn').classList.add('show');
  warnCountdownTimer = setInterval(()=>{
    remaining--;
    $('swCount').textContent = remaining;
    if(remaining <= 0){
      clearInterval(warnCountdownTimer);
      forceLogout();
    }
  }, 1000);
}
function forceLogout(){
  clearIdleTimers();
  sessionStorage.removeItem('creds');
  try{
    if(creds && dirty){
      fetch('/api/data',{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:authHeader()},
        body:JSON.stringify(state),
        keepalive: true
      });
    }
  }catch(e){}
  location.reload();
}
$('swStay').addEventListener('click', ()=>{
  clearInterval(warnCountdownTimer);
  $('sessionWarn').classList.remove('show');
  resetIdleTimer();
});
$('swLogout').addEventListener('click', forceLogout);

['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(ev=>{
  document.addEventListener(ev, ()=>{
    if($('sessionWarn').classList.contains('show')) return;
    resetIdleTimer();
  }, {passive:true});
});

$('loginBtn').addEventListener('click', doLogin);

async function doLogin(){
  const user=$('loginUser').value.trim();
  const pass=$('loginPass').value;
  if(!user||!pass){ showLoginError('Please enter both fields.'); return; }
  $('loginError').classList.remove('show');
  $('loginBtn').textContent='Signing in…';
  $('loginBtn').disabled = true;
  try{
    const r = await fetch('/api/data',{method:'HEAD',headers:{Authorization:'Basic '+btoa(user+':'+pass)}});
    if(r.status===200){
      creds={user,pass};
      sessionStorage.setItem('creds',JSON.stringify(creds));
      $('loginView').style.display='none';
      $('app').classList.remove('hidden');
      await loadData();
      resetIdleTimer();
    } else {
      showLoginError('Wrong username or password. Try again.');
    }
  }catch(e){
    showLoginError('Could not reach server. Check your connection.');
  }
  $('loginBtn').textContent='Sign in';
  $('loginBtn').disabled = false;
}
function showLoginError(msg){
  const el = $('loginError');
  el.textContent = msg;
  el.classList.add('show');
}

function logout(){
  if(dirty && !confirm('You have unsaved changes. Sign out anyway?')) return;
  clearIdleTimers();
  sessionStorage.removeItem('creds');
  location.reload();
}
$('accountBtn').addEventListener('click', ()=>{
  if(confirm('Sign out of the admin console?')) logout();
});

/* =====================================================================
   LOAD / SAVE — always the database, never local sample content
   ===================================================================== */
async function loadData(){
  let remote = null;
  try{
    const r = await fetch('/api/data',{cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(j && typeof j === 'object' && Object.keys(j).length > 0){
        remote = j;
      }
    }
  }catch(e){}

  // Base is always a blank schema-shaped skeleton — never sample content.
  // Whatever is actually in the database is merged on top of it so every
  // field the live site can render always has an editable home here.
  state = remote ? deepMerge(buildEmptySkeleton(), remote) : buildEmptySkeleton();
  hydrateCustomSectionsFromState();

  history = { stack:[JSON.stringify(state)], index:0 };
  updateUndoRedo();
  setDirty(false);
  renderSidebar();
  renderPanel(currentPanel);

  updateDocName();
  if(previewReady) syncPreview();

  if(!remote) toast('No saved content yet in the database — fields start blank', 'info');
}

function updateDocName(){
  const name = state?.nav?.brandName || 'Untitled';
  const sub = state?.nav?.brandSub || '';
  $('docName').textContent = sub ? `${name} · ${sub}` : name;
}

async function saveData(silent=false){
  pushHistory();
  const btn = $('saveBtn');
  const saving = $('savingIndicator');
  if(!silent){ btn.disabled = true; }
  saving.classList.add('show');
  try{
    const r = await fetch('/api/data',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:authHeader()},
      body:JSON.stringify(state)
    });
    if(r.ok){
      toast('All changes saved to the database');
      setDirty(false);
    }
    else if(r.status===401){ toast('Session expired — please sign in again','err'); }
    else { toast('Save failed ('+r.status+')','err'); }
  }catch(e){ toast('Network error — could not save','err'); }
  saving.classList.remove('show');
  if(!silent){ btn.disabled = false; }
}
$('saveBtn').addEventListener('click',()=>saveData(false));
$('reloadBtn').addEventListener('click',async()=>{
  if(dirty && !confirm('Discard unsaved changes and reload from the database?'))return;
  await loadData();
});

function renderSidebar(){

    <div class="sidebar-header">
      <span>Sections</span>
      <button id="addSectionBtn" title="Add custom section" aria-label="Add section">+</button>
    </div>
    ${Object.entries(SCHEMA).map(([key,s])=>{
      let count = 0;
      if(s.isTopArray) count = (state[key]?.items || state[key] || []).length;
      else {
        const data = state[key]||{};
        count = data.items?.length ?? (data.paragraphs?.length ?? (data.columns?.length ?? (data.links?.length ?? 0)));
      }
      const badge = count ? `<span class="count">${count}</span>` : '';
      return `<a data-panel="${key}" title="${esc(s.label)}">
        <span class="icon">${s.icon||'📄'}</span>

function handleAction(action){
  if(action==='export'){
    openModal('Export JSON', `
      <p style="color:var(--text-2);font-size:13.5px;margin-bottom:12px;line-height:1.6">Copy this JSON — it's exactly what your site reads from <code style="font-family:var(--font-mono);background:var(--surface-2);padding:1px 6px;border-radius:4px">/api/data</code>.</p>

    `, [
      {label:'Copy', cls:'filled', onClick:()=>{ $('exportArea').select(); document.execCommand('copy'); toast('Copied to clipboard'); }}
    ]);
  }
  if(action==='import'){
    openModal('Import JSON', `
      <p style="color:var(--text-2);font-size:13.5px;margin-bottom:12px;line-height:1.6">Paste JSON to replace your current content. This cannot be undone from here, but you can Undo (Ctrl+Z) afterward.</p>
      <textarea id="importArea" placeholder='{"meta":{"title":"..."}, ...}'></textarea>
    `, [
      {label:'Cancel', cls:'text', onClick:closeModal},
      {label:'Import', cls:'filled', onClick:()=>{
        try{
          const parsed = JSON.parse($('importArea').value);
          state = deepMerge(buildEmptySkeleton(), parsed);
          hydrateCustomSectionsFromState();
          pushHistory(); setDirty(true); renderSidebar(); renderPanel(currentPanel); syncPreview();
          updateDocName();
          toast('Imported successfully');
          closeModal();
        }catch(e){ toast('Invalid JSON','err'); }
      }}
    ]);
  }
  if(action==='reset'){
    if(!confirm('Clear ALL fields back to blank? This cannot be undone from here (though Ctrl+Z will work immediately after).')) return;
    state = buildEmptySkeleton();
    pushHistory(); setDirty(true); renderSidebar(); renderPanel(currentPanel); syncPreview();
    updateDocName();

  }
}

/* =====================================================================

   ===================================================================== */
function renderPanel(key){
  currentPanel = key;
  if(!SCHEMA[key]) key = Object.keys(SCHEMA)[0];
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.toggle('active',a.dataset.panel===key));
  const schema = SCHEMA[key];
  const ed = $('editor');

  /* ---------- TOP-LEVEL ARRAY SECTION (stats, ticker) ---------- */
  if(schema.isTopArray){
    ed.innerHTML = `
      <div class="editor-inner">
        <div class="editor-head">
          <div class="h-left">
            <h2>${esc(schema.label)}</h2>
            <p>${esc(schema.help || 'Edit items below. Changes reflect in the live preview instantly.')}</p>
          </div>
          <div class="h-actions">
            <button class="btn mini outlined" id="duplicateSectionBtn">Duplicate</button>
            <button class="btn mini outlined" id="clearSectionBtn">Clear</button>
          </div>
        </div>
        <div id="panelFields"></div>
      </div>
    `;
    const container = $('panelFields');
    let arrVal = state[key];
    if(!Array.isArray(arrVal)){
      if(arrVal && Array.isArray(arrVal.items)) arrVal = arrVal.items;
      else { arrVal = []; state[key] = arrVal; }
    }
    const arrayField = {
      label: schema.itemLabel + 's',
      type:'array',
      itemLabel: schema.itemLabel,
      itemFields: schema.itemFields,
      help: schema.help
    };
    container.appendChild(renderField(arrayField, arrVal, key, key));

    $('duplicateSectionBtn').addEventListener('click',()=>{
      const a = Array.isArray(state[key]) ? state[key] : [];
      state[key] = a.concat(JSON.parse(JSON.stringify(a)));
      pushHistory(); setDirty(true); renderPanel(key); syncPreview();
      renderSidebar();
      toast('Section duplicated');
    });
    $('clearSectionBtn').addEventListener('click',()=>{
      if(!confirm('Clear this section?')) return;
      state[key] = [];
      pushHistory(); setDirty(true); renderPanel(key); syncPreview();
      renderSidebar();
      toast('Section cleared','info');
    });
    return;
  }

  /* ---------- NORMAL OBJECT SECTION ---------- */
  const data = state[key]||{};
  ed.innerHTML = `
    <div class="editor-inner">
      <div class="editor-head">
        <div class="h-left">
          <h2>${esc(schema.label)}</h2>
          <p>Changes reflect in the live preview instantly. Press ⌘S to save to the database.</p>
        </div>
        <div class="h-actions">
          <button class="btn mini outlined" id="duplicateSectionBtn">Duplicate</button>
          <button class="btn mini outlined" id="clearSectionBtn">Clear</button>
          ${schema.custom ? `<button class="btn mini outlined" id="deleteSectionBtn" style="color:var(--red)">Delete section</button>` : ''}
        </div>
      </div>
      <div id="panelFields"></div>
    </div>
  `;
  const container = $('panelFields');
  for(const [fk,fs] of Object.entries(schema.fields)){
    container.appendChild(renderField(fs, data[fk], `${key}.${fk}`, key));
  }
  $('duplicateSectionBtn').addEventListener('click',()=>{
    Object.entries(state[key]||{}).forEach(([k,v])=>{
      if(Array.isArray(v)) state[key][k] = v.concat(JSON.parse(JSON.stringify(v)));
    });
    pushHistory(); setDirty(true); renderPanel(key); syncPreview();
    toast('Section duplicated');
  });
  $('clearSectionBtn').addEventListener('click',()=>{
    if(!confirm('Clear all fields in this section?')) return;
    Object.keys(state[key]||{}).forEach(k=>{
      if(Array.isArray(state[key][k])) state[key][k] = [];
      else state[key][k] = '';
    });
    pushHistory(); setDirty(true); renderPanel(key); syncPreview();
    toast('Section cleared','info');
  });
  const delBtn = $('deleteSectionBtn');
  if(delBtn){
    delBtn.addEventListener('click',()=>{
      if(!confirm(`Delete the "${schema.label}" section entirely? This removes it from the live site.`)) return;
      delete state[key];
      delete SCHEMA[key];
      pushHistory(); setDirty(true); renderSidebar();
      renderPanel(Object.keys(SCHEMA)[0]);
      syncPreview();
      toast('Section deleted','info');
    });
  }
}

/* =====================================================================
   FIELD RENDER
   ===================================================================== */
function renderField(fs, value, path, sectionKey){
  const wrap = document.createElement('div');
  wrap.className = 'field';
  wrap.dataset.path = path;

  if(fs.type==='array'){
    wrap.classList.add('array-block');
    const arr = Array.isArray(value)?value:[];
    // Normalize legacy plain-string items (old data format) into {value:...}
    // objects in place, so existing text shows up in the editor and edits
    // actually persist (you can't set a property on a string primitive).
    if(fs.simple){
      arr.forEach((item,idx)=>{
        if(typeof item === 'string') arr[idx] = {value:item};
        else if(item == null) arr[idx] = {value:''};
      });
    }
    const lbl = document.createElement('label');
    lbl.innerHTML = `<span>${esc(fs.label)}</span> <span class="arr-meta">${arr.length} item${arr.length===1?'':'s'}</span>`;
    wrap.appendChild(lbl);
    const list = document.createElement('div');
    list.dataset.arrPath = path;
    arr.forEach((item,i)=>list.appendChild(renderArrayItem(fs,item,i,path,sectionKey)));
    wrap.appendChild(list);
    const add = document.createElement('button');
    add.className='add-btn'; add.type='button';
    add.innerHTML = `＋ Add ${esc(fs.itemLabel)}`;
    add.addEventListener('click',()=>{
      const newItem = fs.simple
        ? {value:''}
        : Object.fromEntries(Object.entries(fs.itemFields).map(([k,f])=>[k, f.type==='csv'?[]: (f.type==='array'?[]:'')]));

      let target;
      if(path.indexOf('.') === -1){
        if(!Array.isArray(state[path])) state[path] = [];
        target = state[path];
      } else {
        target = getPath(state,path);
        if(!Array.isArray(target)){ target = []; setPath(state,path,target); }
      }
      target.push(newItem);

      pushHistory(); setDirty(true);
      renderPanel(sectionKey); syncPreview(); renderSidebar();
      setTimeout(()=>{ const ed=$('editor'); ed.scrollTop = ed.scrollHeight; },30);
    });
    wrap.appendChild(add);
    if(fs.help){
      const h = document.createElement('div');
      h.className='hint'; h.textContent=fs.help;
      wrap.appendChild(h);
    }
    return wrap;
  }

  const label = document.createElement('label');
  label.textContent = fs.label;
  wrap.appendChild(label);

  if(fs.type==='textarea'){
    const t = document.createElement('textarea');
    t.value = value||'';
    t.placeholder = fs.ph||'';
    t.addEventListener('input',()=>{
      setPath(state,path,t.value);
      setDirty(true);
      syncPreview();
    });
    t.addEventListener('blur',()=>pushHistory());
    wrap.appendChild(t);
  }
  else if(fs.type==='csv'){
    const t = document.createElement('input');
    t.type='text';
    t.value = (Array.isArray(value)?value:[]).join(', ');
    t.placeholder = fs.ph||'comma, separated, values';
    t.addEventListener('input',()=>{
      setPath(state,path, t.value.split(',').map(s=>s.trim()).filter(Boolean));
      setDirty(true); syncPreview();
    });
    t.addEventListener('blur',()=>pushHistory());
    wrap.appendChild(t);
  }
  else if(fs.type==='image'){
    wrap.appendChild(renderImageField(value, v=>{
      setPath(state,path,v);
      setDirty(true); syncPreview();
    }));
  }
  else{
    const t = document.createElement('input');
    t.type='text';
    t.value = value||'';
    t.placeholder = fs.ph||'';
    t.addEventListener('input',()=>{
      setPath(state,path,t.value);
      setDirty(true); syncPreview();
    });
    t.addEventListener('blur',()=>pushHistory());
    wrap.appendChild(t);
  }

  if(fs.help){
    const h = document.createElement('div');
    h.className='hint'; h.textContent=fs.help;
    wrap.appendChild(h);
  }
  return wrap;
}

/* =====================================================================
   ARRAY ITEM
   ===================================================================== */
function renderArrayItem(fs, item, i, basePath, sectionKey){
  const box = document.createElement('div');
  box.className='array-item';
  box.draggable = true;
  box.dataset.index = i;

  const head = document.createElement('div');
  head.className='item-head';

  let titleText = `${fs.itemLabel} ${String(i+1).padStart(2,'0')}`;
  const itemFields = fs.simple ? {value:fs.simpleField} : fs.itemFields;
  const firstKey = Object.keys(itemFields)[0];
  const firstVal = item[firstKey];
  if(firstVal && typeof firstVal==='string'){
    titleText = firstVal.length>60 ? firstVal.slice(0,60)+'…' : firstVal;
  } else if(item.title || item.name || item.label || item.sym){
    titleText = item.title || item.name || item.label || item.sym;
  }

  head.innerHTML = `
    <div class="item-title">
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <span>${esc(titleText)}</span>
      <span class="pill">#${i+1}</span>
    </div>
  `;
  const actions = document.createElement('div');
  actions.className='item-actions';

  const toggle = document.createElement('button');
  toggle.className='icon-btn'; toggle.textContent='▾'; toggle.title='Collapse/Expand';
  toggle.addEventListener('click',e=>{ e.stopPropagation(); box.classList.toggle('collapsed'); });

  const up = document.createElement('button');
  up.className='icon-btn'; up.textContent='↑'; up.title='Move up';
  up.addEventListener('click',e=>{
    e.stopPropagation();
    const a = getPath(state,basePath);
    if(!Array.isArray(a)) return;
    if(i>0){ [a[i-1],a[i]]=[a[i],a[i-1]]; pushHistory(); setDirty(true); renderPanel(sectionKey); syncPreview(); }
  });

  const down = document.createElement('button');
  down.className='icon-btn'; down.textContent='↓'; down.title='Move down';
  down.addEventListener('click',e=>{
    e.stopPropagation();
    const a = getPath(state,basePath);
    if(!Array.isArray(a)) return;
    if(i<a.length-1){ [a[i+1],a[i]]=[a[i],a[i+1]]; pushHistory(); setDirty(true); renderPanel(sectionKey); syncPreview(); }
  });

  const dup = document.createElement('button');
  dup.className='icon-btn'; dup.textContent='⧉'; dup.title='Duplicate';
  dup.addEventListener('click',e=>{
    e.stopPropagation();
    const a = getPath(state,basePath);
    if(!Array.isArray(a)) return;
    a.splice(i+1,0,JSON.parse(JSON.stringify(item)));
    pushHistory(); setDirty(true); renderPanel(sectionKey); syncPreview();
  });

  const del = document.createElement('button');
  del.className='icon-btn del'; del.textContent='✕'; del.title='Delete';
  del.addEventListener('click',e=>{
    e.stopPropagation();
    if(!confirm('Delete this item?')) return;
    const a = getPath(state,basePath);
    if(!Array.isArray(a)) return;
    a.splice(i,1);
    pushHistory(); setDirty(true); renderPanel(sectionKey); syncPreview(); renderSidebar();
  });

  actions.append(toggle,up,down,dup,del);
  head.appendChild(actions);
  head.addEventListener('click',e=>{
    if(e.target.closest('.icon-btn') || e.target.closest('.drag-handle')) return;
    box.classList.toggle('collapsed');
  });
  box.appendChild(head);

  const body = document.createElement('div');
  body.className='item-body';
  const keys = Object.keys(itemFields);
  const cols = keys.length>=3?2:1;
  body.style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`;

  for(const [fk,f] of Object.entries(itemFields)){
    const cell = document.createElement('div');
    if(f.type==='textarea' || f.type==='array') cell.style.gridColumn='1 / -1';
    const sub = renderField(f, item[fk], `${basePath}.${i}.${fk}`, sectionKey);
    sub.style.marginBottom='0';
    cell.appendChild(sub);
    body.appendChild(cell);
  }
  box.appendChild(body);

  box.addEventListener('dragstart',e=>{
    box.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain', String(i));
  });
  box.addEventListener('dragend',()=>box.classList.remove('dragging'));
  box.addEventListener('dragover',e=>{ e.preventDefault(); box.classList.add('drag-over'); });
  box.addEventListener('dragleave',()=>box.classList.remove('drag-over'));
  box.addEventListener('drop',e=>{
    e.preventDefault();
    box.classList.remove('drag-over');
    const from = parseInt(e.dataTransfer.getData('text/plain'),10);
    const to = i;
    if(from===to||isNaN(from)) return;
    const a = getPath(state,basePath);
    if(!Array.isArray(a)) return;
    const [moved] = a.splice(from,1);
    a.splice(to,0,moved);
    pushHistory(); setDirty(true); renderPanel(sectionKey); syncPreview();
  });

  return box;
}

/* =====================================================================
   IMAGE FIELD
   ===================================================================== */
function renderImageField(value, onChange){
  const w = document.createElement('div');
  w.className='image-field';
  const preview = document.createElement('div');
  preview.className='image-preview';
  preview.innerHTML = value?`<img src="${esc(value)}" alt="">`:'<span>No image</span>';

  const right = document.createElement('div');
  right.className='image-inputs';

  const urlInput = document.createElement('input');
  urlInput.type='text';
  urlInput.placeholder='https://… or upload below';
  urlInput.value = value && !value.startsWith('data:') ? value : '';
  urlInput.addEventListener('input',()=>{
    onChange(urlInput.value);
    preview.innerHTML = urlInput.value?`<img src="${esc(urlInput.value)}" alt="">`:'<span>No image</span>';
  });

  const fileWrap = document.createElement('label');
  fileWrap.className='file-label';
  fileWrap.innerHTML='📁 Upload image';
  const fileInput = document.createElement('input');
  fileInput.type='file';
  fileInput.accept='image/*';
  fileInput.addEventListener('change',()=>{
    const file = fileInput.files[0]; if(!file) return;
    compressImage(file, dataUrl=>{
      urlInput.value='';
      onChange(dataUrl);
      preview.innerHTML = `<img src="${dataUrl}" alt="">`;
    });
  });
  fileWrap.appendChild(fileInput);

  const hint = document.createElement('div');
  hint.className='hint';
  hint.textContent='Auto-compressed to ~1200px · JPEG 0.85';

  right.append(urlInput, fileWrap, hint);
  w.append(preview, right);
  return w;
}

function compressImage(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 1200;
      let {width:w,height:h} = img;
      if(w>max||h>max){ const r = Math.min(max/w, max/h); w=Math.round(w*r); h=Math.round(h*r); }
      const c = document.createElement('canvas');
      c.width=w; c.height=h;
      const ctx = c.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.85));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* =====================================================================
   COMMAND PALETTE
   ===================================================================== */
const cmdOverlay = $('cmdOverlay');
const cmdInput = $('cmdInput');
const cmdResults = $('cmdResults');
let cmdSel = 0;
let cmdItems = [];

function openCmd(){
  cmdOverlay.classList.add('show');
  cmdInput.value='';
  cmdInput.focus();
  buildCmdItems('');
}
function closeCmd(){ cmdOverlay.classList.remove('show'); }

function buildCmdItems(query){
  cmdItems = [];
  const q = query.toLowerCase().trim();

  Object.entries(SCHEMA).forEach(([key,s])=>{
    const label = `Go to ${s.label}`;
    if(!q || label.toLowerCase().includes(q) || key.includes(q)){
      cmdItems.push({icon:s.icon||'📄', text:label, sub:`Section · ${key}`, action:()=>{ renderPanel(key); closeCmd(); }});
    }
  });

  if(q){
    Object.entries(SCHEMA).forEach(([sk,s])=>{
      const fields = s.isTopArray ? s.itemFields : s.fields;
      if(!fields) return;
      Object.entries(fields).forEach(([fk,f])=>{
        const label = (f.label||'').toLowerCase();
        if(label.includes(q) || fk.includes(q)){
          cmdItems.push({
            icon:'⌨', text:f.label, sub:`${s.label} · ${fk}`,
            action:()=>{ renderPanel(sk); closeCmd();
              setTimeout(()=>{
                const el = document.querySelector(`[data-path="${sk}.${fk}"], [data-path="${sk}"].${fk}`);
                const root = document.querySelector(`[data-path="${sk}"]`);
                const target = el || root;
                if(target){ target.scrollIntoView({behavior:'smooth',block:'center'}); }
              },60);
            }
          });
        }
      });
    });
  }

  const actions = [
    {icon:'💾', text:'Save changes', sub:'Ctrl+S', action:()=>{ saveData(false); closeCmd(); }},
    {icon:'↻', text:'Reload from database', sub:'Discard unsaved', action:()=>{ $('reloadBtn').click(); closeCmd(); }},
    {icon:'↗', text:'Open live site', sub:'New tab', action:()=>{ window.open('/','_blank'); closeCmd(); }},
    {icon:'↧', text:'Export JSON', sub:'Copy data', action:()=>{ handleAction('export'); closeCmd(); }},
    {icon:'↥', text:'Import JSON', sub:'Paste data', action:()=>{ handleAction('import'); closeCmd(); }},
    {icon:'👁', text:'Toggle live preview', sub:'Show/hide pane', action:()=>{ $('previewToggle').click(); closeCmd(); }},
    {icon:'↺', text:'Undo', sub:'Ctrl+Z', action:()=>{ undo(); closeCmd(); }},
    {icon:'↻', text:'Redo', sub:'Ctrl+Shift+Z', action:()=>{ redo(); closeCmd(); }},
  ];
  actions.forEach(a=>{ if(!q || a.text.toLowerCase().includes(q)) cmdItems.push(a); });

  renderCmdResults();
}

function renderCmdResults(){
  if(cmdItems.length===0){
    cmdResults.innerHTML = `<div class="cmd-empty">No results</div>`;
    return;
  }
  if(cmdSel>=cmdItems.length) cmdSel = cmdItems.length-1;
  if(cmdSel<0) cmdSel=0;
  cmdResults.innerHTML = cmdItems.map((it,i)=>`
    <div class="cmd-item ${i===cmdSel?'selected':''}" data-i="${i}">
      <span class="ico">${it.icon||'▸'}</span>
      <span class="txt">${esc(it.text)}${it.sub?`<small>${esc(it.sub)}</small>`:''}</span>
    </div>
  `).join('');
  cmdResults.querySelectorAll('.cmd-item').forEach(el=>{
    el.addEventListener('click',()=>{ cmdItems[+el.dataset.i].action(); });
    el.addEventListener('mouseenter',()=>{ cmdSel=+el.dataset.i; renderCmdResults(); });
  });
}

cmdInput.addEventListener('input',()=>{ cmdSel=0; buildCmdItems(cmdInput.value); });
cmdInput.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); cmdSel=Math.min(cmdSel+1,cmdItems.length-1); renderCmdResults(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); cmdSel=Math.max(cmdSel-1,0); renderCmdResults(); }
  else if(e.key==='Enter'){ e.preventDefault(); cmdItems[cmdSel]?.action(); }
  else if(e.key==='Escape'){ closeCmd(); }
});
cmdOverlay.addEventListener('click',e=>{ if(e.target===cmdOverlay) closeCmd(); });
$('cmdBtn').addEventListener('click',openCmd);

/* =====================================================================
   MODAL
   ===================================================================== */
function openModal(title, bodyHTML, buttons){
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = bodyHTML;
  $('modalFoot').innerHTML='';
  buttons.forEach(b=>{
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls||'');
    el.textContent = b.label;
    el.addEventListener('click',b.onClick);
    $('modalFoot').appendChild(el);
  });
  $('modalOverlay').classList.add('show');
}
function closeModal(){ $('modalOverlay').classList.remove('show'); }
$('modalClose').addEventListener('click',closeModal);
$('modalOverlay').addEventListener('click',e=>{ if(e.target===$('modalOverlay')) closeModal(); });

/* =====================================================================
   ADD CUSTOM SECTION
   ===================================================================== */
function openAddSectionModal(){
  openModal('Add custom section', `
    <p style="color:var(--text-2);font-size:13.5px;margin-bottom:16px;line-height:1.6">Custom sections render on the portfolio as a card grid, right below Credentials. Fill in the fields below.</p>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div><label>Section key (no spaces)</label><input id="newSecKey" placeholder="achievements"></div>
      <div><label>Display label</label><input id="newSecLabel" placeholder="Achievements"></div>
      <div><label>Icon (emoji)</label><input id="newSecIcon" placeholder="🏆" value="📄"></div>
    </div>
  `, [
    {label:'Cancel', cls:'text', onClick:closeModal},
    {label:'Add section', cls:'filled', onClick:()=>{
      const key = ($('newSecKey').value||'').trim().replace(/[^a-zA-Z0-9]/g,'');
      const label = ($('newSecLabel').value||'').trim();
      if(!key||!label){ toast('Key and label required','err'); return; }
      if(SCHEMA[key]){ toast('Section already exists','err'); return; }
      SCHEMA[key] = customSectionSchema(label, $('newSecIcon').value||'📄');
      state[key] = {tag:label,heading:'',headingEm:'',items:[]};
      pushHistory(); setDirty(true); renderSidebar(); renderPanel(key); syncPreview();
      toast('Section added');
      closeModal();
    }}
  ]);
}

/* =====================================================================
   KEYBOARD SHORTCUTS
   ===================================================================== */
document.addEventListener('keydown',e=>{
  const mod = e.metaKey||e.ctrlKey;
  if(mod && e.key==='s'){ e.preventDefault(); saveData(false); }
  else if(mod && e.key==='k'){ e.preventDefault(); openCmd(); }
  else if(mod && e.key==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if(mod && e.key==='z' && e.shiftKey){ e.preventDefault(); redo(); }
  else if(mod && e.key==='p'){ e.preventDefault(); $('previewToggle').click(); }
  else if(e.key==='Escape'){ closeCmd(); closeModal(); closeDrawer(); }
});

window.addEventListener('beforeunload',e=>{
  if(dirty){ e.preventDefault(); e.returnValue=''; }
});
