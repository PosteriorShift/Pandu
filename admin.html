<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Admin · Portfolio Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c;--panel:#141418;--panel-2:#1c1c22;--panel-3:#25252c;--border:#2a2a32;
  --text:#f0f0f2;--muted:#8a8a94;--dim:#5a5a64;--accent:#d4a017;--accent-2:#0071e3;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;
  --shadow:0 20px 60px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:13px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
input,textarea{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;width:100%;font-size:13px;transition:border .15s,background .15s;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--accent-2);background:var(--panel-3)}
input::placeholder,textarea::placeholder{color:var(--dim)}
textarea{resize:vertical;min-height:70px;line-height:1.55;font-family:inherit}
label{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-family:'JetBrains Mono',monospace;font-weight:500}
.hint{font-size:10.5px;color:var(--dim);margin-top:4px;font-family:'JetBrains Mono',monospace;line-height:1.5}

.login-wrap{display:grid;place-items:center;min-height:100vh;padding:20px;background:radial-gradient(circle at 30% 20%,rgba(212,160,23,.06),transparent 60%),radial-gradient(circle at 70% 80%,rgba(0,113,227,.06),transparent 60%)}
.login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:40px 34px;box-shadow:var(--shadow)}
.login-card .logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.login-card .logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}
.login-card h1{font-size:24px;letter-spacing:-.03em;margin-bottom:6px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:28px}
.login-card .field{margin-bottom:16px}
.login-btn{width:100%;background:var(--accent);color:#000;padding:12px;border-radius:10px;font-weight:600;font-size:13px;transition:.2s;margin-top:8px}
.login-btn:hover{filter:brightness(1.08)}
.login-error{color:var(--red);font-size:12px;margin-top:12px;text-align:center;min-height:16px}

.app{display:grid;grid-template-rows:52px 1fr;height:100vh;height:100dvh;overflow:hidden}
.app.hidden{display:none}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border);gap:10px;z-index:40}
.topbar .left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);flex-shrink:0}
.topbar .title{font-weight:600;letter-spacing:-.02em;font-size:13px;white-space:nowrap}
.topbar .dirty-badge{display:none;background:rgba(245,158,11,.15);color:var(--amber);padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:.05em}
.topbar .dirty-badge.show{display:inline-block}
.topbar .right{display:flex;align-items:center;gap:6px}
.toolbar-group{display:flex;align-items:center;gap:2px;background:var(--panel-2);padding:3px;border-radius:10px;border:1px solid var(--border)}
.tb-btn{padding:6px 10px;border-radius:7px;font-size:12px;font-weight:500;transition:.15s;color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tb-btn:hover{background:var(--panel-3);color:var(--text)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.active{background:var(--panel-3);color:var(--text)}
.tb-btn .kbd{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim);padding:1px 4px;border:1px solid var(--border);border-radius:4px;background:var(--bg)}
.btn{padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--panel-2);transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel-3)}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:rgba(239,68,68,.3)}
.btn.ghost{background:transparent}
.btn.mini{padding:5px 9px;font-size:11px}

.workspace{display:grid;grid-template-columns:220px 1fr 1fr;height:100%;overflow:hidden;transition:grid-template-columns .3s cubic-bezier(.22,1,.36,1)}
.workspace.no-preview{grid-template-columns:220px 1fr 0}

.sidebar{background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.sidebar-header{padding:6px 10px 10px;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sidebar-header button{font-size:14px;color:var(--muted);width:20px;height:20px;border-radius:5px;display:grid;place-items:center}
.sidebar-header button:hover{background:var(--panel-2);color:var(--text)}
.sidebar a{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;color:var(--muted);font-size:12.5px;transition:.15s;cursor:pointer;font-weight:500;position:relative}
.sidebar a:hover{background:var(--panel-2);color:var(--text)}
.sidebar a.active{background:var(--panel-2);color:var(--text);box-shadow:inset 2px 0 var(--accent)}
.sidebar a .idx{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);min-width:14px;font-weight:600}
.sidebar a.active .idx{color:var(--accent)}
.sidebar a .count{font-size:9.5px;background:var(--panel-3);padding:1px 6px;border-radius:999px;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-left:auto}
.sidebar .divider{height:1px;background:var(--border);margin:8px 4px}

.editor{overflow-y:auto;padding:22px 26px 120px;background:var(--bg);position:relative}
.editor-head{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.editor-head .h-left h2{font-size:20px;letter-spacing:-.03em;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.editor-head .h-left p{color:var(--muted);font-size:12px;max-width:55ch}
.editor-head .h-actions{display:flex;gap:6px;flex-shrink:0}

.field{margin-bottom:18px;position:relative}

.array-block{margin-bottom:6px}
.array-block > label{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.array-block > label .arr-meta{font-size:10px;color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0}
.array-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:.2s;position:relative}
.array-item:hover{border-color:#35353e}
.array-item.dragging{opacity:.4}
.array-item.drag-over{border-color:var(--accent-2);box-shadow:0 0 0 1px var(--accent-2)}
.array-item .item-head{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.array-item .item-head .drag-handle{cursor:grab;color:var(--dim);font-size:14px;line-height:1;padding:0 4px;margin-left:-4px}
.array-item .item-head .item-title{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:8px;overflow:hidden}
.array-item .item-head .item-title > span:not(.drag-handle):not(.pill){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.array-item .item-head .item-title .pill{background:var(--panel-3);color:var(--dim);padding:1px 6px;border-radius:4px;letter-spacing:.02em;font-size:9.5px;flex-shrink:0}
.item-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.icon-btn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12px;border:1px solid transparent;background:transparent;transition:.15s;color:var(--muted)}
.icon-btn:hover{background:var(--panel-3);color:var(--text);border-color:var(--border)}
.icon-btn.del:hover{background:rgba(239,68,68,.15);color:var(--red);border-color:rgba(239,68,68,.3)}
.array-item .item-body{padding:16px 14px;display:grid;gap:14px}
.array-item.collapsed .item-body{display:none}
.array-item.collapsed .item-head{border-bottom:0}

.add-btn{margin-top:4px;padding:10px 16px;border:1px dashed var(--border);border-radius:10px;width:100%;color:var(--muted);font-size:12px;font-weight:500;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.add-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(212,160,23,.05)}

.image-field{display:flex;gap:14px;align-items:flex-start}
.image-preview{width:120px;height:120px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);overflow:hidden;flex-shrink:0;display:grid;place-items:center;font-size:11px;color:var(--dim)}
.image-preview img{width:100%;height:100%;object-fit:cover}
.image-inputs{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.file-label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;cursor:pointer;background:var(--panel-2);width:fit-content;transition:.15s;color:var(--text)}
.file-label:hover{background:var(--panel-3)}
input[type=file]{display:none}

.preview-pane{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.preview-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel-2);gap:10px;flex-shrink:0}
.preview-head .ph-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.preview-head .ph-left .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.preview-head .ph-left .url-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-head .ph-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.device-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px}
.device-toggle button{padding:4px 9px;font-size:11px;border-radius:5px;color:var(--muted);transition:.15s}
.device-toggle button.active{background:var(--panel-3);color:var(--text)}
.preview-frame-wrap{flex:1;overflow:auto;background:#0a0a0c;display:flex;justify-content:center;padding:12px;position:relative}
.preview-frame-wrap iframe{width:100%;height:100%;border:1px solid var(--border);border-radius:10px;background:#fff;transition:width .3s cubic-bezier(.22,1,.36,1),max-width .3s;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.preview-frame-wrap.device-mobile iframe{width:390px;max-width:100%}
.preview-frame-wrap.device-tablet iframe{width:768px;max-width:100%}

.status-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);padding:10px 18px;border-radius:999px;font-size:12.5px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:100}
.status-bar.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.status-bar .ico{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.status-bar.ok .ico{background:rgba(34,197,94,.15);color:var(--green)}
.status-bar.err .ico{background:rgba(239,68,68,.15);color:var(--red)}
.status-bar.info .ico{background:rgba(0,113,227,.15);color:var(--accent-2)}

.cmd-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding-top:15vh}
.cmd-overlay.show{display:flex}
.cmd-box{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;animation:cmdIn .2s cubic-bezier(.22,1,.36,1)}
@keyframes cmdIn{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.cmd-input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--border);border-radius:0;padding:16px 20px;font-size:15px;color:var(--text)}
.cmd-input:focus{outline:none;background:transparent;border-color:var(--border)}
.cmd-input::placeholder{color:var(--dim)}
.cmd-results{max-height:360px;overflow-y:auto;padding:6px}
.cmd-item{padding:10px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:13px}
.cmd-item:hover,.cmd-item.selected{background:var(--panel-2)}
.cmd-item .ico{width:20px;text-align:center;color:var(--muted)}
.cmd-item .txt{flex:1}
.cmd-item .txt small{display:block;color:var(--dim);font-size:11px;margin-top:1px}
.cmd-empty{padding:32px;text-align:center;color:var(--dim);font-size:13px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:210;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-height:85vh;display:flex;flex-direction:column}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:16px;letter-spacing:-.02em}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.modal textarea{font-family:'JetBrains Mono',monospace;font-size:11.5px;min-height:260px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a32;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a3a44}

.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:190}
.sidebar-backdrop.show{display:block}

@media(max-width:1100px){
  .workspace{grid-template-columns:200px 1fr}
  .preview-pane{display:none}
  .workspace.show-preview .preview-pane{display:flex;position:fixed;inset:52px 0 0 0;z-index:60;border-left:0;background:var(--panel)}
  .workspace.show-preview .editor{display:none}
}
@media(max-width:768px){
  body{font-size:14px}
  .app{height:100dvh;grid-template-rows:auto 1fr}
  .topbar{height:52px;padding:0 10px;gap:6px;padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:80}
  .topbar .title{font-size:12px;display:none}
  .topbar .right{gap:3px}
  .topbar .btn{padding:7px 10px;font-size:11.5px}
  .topbar #viewSiteBtn,.topbar #reloadBtn{display:none}
  .topbar .btn.primary{padding:8px 11px}
  .topbar .btn.primary span{display:none}
  .topbar .btn.primary::before{content:'💾';font-size:14px}
  .toolbar-group{display:none}
  .workspace{grid-template-columns:1fr;height:auto;overflow:visible}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:200;transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,1,.36,1);padding:calc(16px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));box-shadow:20px 0 60px rgba(0,0,0,.5)}
  .sidebar.open{transform:translateX(0)}
  .editor{padding:18px 16px calc(100px + env(safe-area-inset-bottom));overflow:visible}
  .editor-head{flex-direction:column;gap:10px;align-items:stretch}
  .editor-head .h-actions{justify-content:flex-end}
  .editor-head .h-left h2{font-size:18px}
  .editor-head .h-left p{font-size:11.5px}
  input,textarea{font-size:16px;padding:11px 14px}
  textarea{min-height:90px}
  .array-item .item-body{grid-template-columns:1fr !important;padding:14px 12px;gap:12px}
  .array-item .item-body > div{grid-column:1 / -1 !important}
  .icon-btn{width:30px;height:30px;font-size:14px}
  .array-item .item-head .item-title > span:not(.drag-handle):not(.pill){max-width:120px}
  .image-field{flex-direction:column}
  .image-preview{width:100%;height:180px}
  .preview-pane{position:fixed;inset:0;z-index:150;padding-top:calc(52px + env(safe-area-inset-top));background:var(--bg)}
  .workspace:not(.show-preview) .preview-pane{display:none}
  .workspace.show-preview .preview-pane{display:flex}
  .preview-head{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
  .preview-frame-wrap.device-mobile iframe,.preview-frame-wrap.device-tablet iframe{width:100%;max-width:100%}
  .status-bar{bottom:calc(78px + env(safe-area-inset-bottom));font-size:12px;padding:9px 16px;max-width:calc(100vw - 24px)}
  .cmd-overlay{padding-top:0;align-items:flex-end}
  .cmd-box{max-width:none;border-radius:16px 16px 0 0}
  .cmd-input{font-size:16px;padding:18px 20px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .cmd-results{max-height:50vh}
  .cmd-item{padding:12px 14px;font-size:14px}
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{max-width:none;border-radius:18px 18px 0 0;max-height:92vh}
  .modal-body{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .modal textarea{min-height:180px;font-size:12px}
}
@media(max-width:400px){
  .topbar .dirty-badge{font-size:9.5px;padding:2px 7px}
}
@supports(-webkit-touch-callout:none){
  input,textarea,select{font-size:16px}
}
</style>
</head>
<body>

<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="logo"><span class="logo-dot"></span><span style="font-weight:600;letter-spacing:-.02em">Portfolio Admin</span></div>
    <h1>Welcome back</h1>
    <p>Sign in to manage your portfolio content.</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="admin">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="login-btn" id="loginBtn">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="app hidden" id="app">
  <div class="topbar">
    <div class="left">
      <button class="icon-btn" id="mobileMenuBtn" style="display:none;width:32px;height:32px" title="Menu">☰</button>
      <span class="dot"></span>
      <span class="title">Portfolio Editor</span>
      <span class="dirty-badge" id="dirtyBadge">UNSAVED</span>
    </div>
    <div class="right">
      <div class="toolbar-group">
        <button class="tb-btn" id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
        <button class="tb-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷</button>
      </div>
      <div class="toolbar-group">
        <button class="tb-btn" id="previewToggle" title="Toggle live preview">👁 Preview</button>
        <button class="tb-btn" id="cmdBtn" title="Command palette">⌘K <span class="kbd">⌘K</span></button>
      </div>
      <button class="btn ghost" id="viewSiteBtn" title="Open live site">↗ Site</button>
      <button class="btn" id="reloadBtn" title="Reload from server">Reload</button>
      <button class="btn primary" id="saveBtn" title="Save (Ctrl+S)"><span>Save changes</span></button>
      <button class="btn danger" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <main class="editor" id="editor"></main>
    <aside class="preview-pane" id="previewPane">
      <div class="preview-head">
        <div class="ph-left">
          <span class="live-dot"></span>
          <div class="url-box" id="previewUrl">/ · live preview</div>
        </div>
        <div class="ph-right">
          <div class="device-toggle">
            <button data-device="desktop" class="active">🖥</button>
            <button data-device="tablet">📱</button>
            <button data-device="mobile">📱</button>
          </div>

/* ==================================================================
   HELPERS
   ================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getPath = (obj,path)=>path.split('.').reduce((o,k)=>o?.[k],obj);
const setPath = (obj,path,val)=>{const keys=path.split('.');const last=keys.pop();let cur=obj;for(const k of keys){if(cur[k]==null)cur[k]={};cur=cur[k];}cur[last]=val;};
const authHeader = () => 'Basic ' + btoa(creds.user+':'+creds.pass);
const isMobile = () => window.matchMedia('(max-width:768px)').matches;

function deepMerge(base, src){
  if(Array.isArray(base)) return Array.isArray(src)?src:base;
  if(base && typeof base==='object'){
    if(!src || typeof src!=='object') return base;
    for(const k in src) base[k] = (k in base)?deepMerge(base[k],src[k]):src[k];
    return base;
  }
  return (src===undefined||src===null)?base:src;
}

function toast(msg, kind='ok'){
  const bar=$('statusBar'), ico=$('statusIco'), m=$('statusMsg');
  bar.className='status-bar show '+kind;
  ico.textContent = kind==='ok'?'✓':kind==='err'?'!':'i';
  m.textContent = msg;
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>bar.classList.remove('show'),2600);
}

let setDirty = function(v){
  dirty = v;
  $('dirtyBadge').classList.toggle('show', dirty);
};

/* ==================================================================
   HISTORY
   ================================================================== */
function pushHistory(){
  history.stack = history.stack.slice(0, history.index+1);
  history.stack.push(JSON.stringify(state));
  if(history.stack.length > 60) history.stack.shift();
  history.index = history.stack.length - 1;
  updateUndoRedo();
}
function updateUndoRedo(){
  $('undoBtn').disabled = history.index <= 0;
  $('redoBtn').disabled = history.index >= history.stack.length - 1;
}
function undo(){
  if(history.index <= 0) return;
  history.index--;
  state = JSON.parse(history.stack[history.index]);
  renderPanel(currentPanel);
  syncPreview();
  setDirty(true);
  updateUndoRedo();
}
function redo(){
  if(history.index >= history.stack.length - 1) return;
  history.index++;
  state = JSON.parse(history.stack[history.index]);
  renderPanel(currentPanel);
  syncPreview();
  setDirty(true);
  updateUndoRedo();
}
$('undoBtn').addEventListener('click', undo);
$('redoBtn').addEventListener('click', redo);

/* ==================================================================
   LOGIN
   ================================================================== */
$('loginBtn').addEventListener('click', doLogin);
$('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('loginUser').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginPass').focus();});

async function doLogin(){
  const user=$('loginUser').value.trim();
  const pass=$('loginPass').value;
  if(!user||!pass){ $('loginError').textContent='Please enter both fields.'; return; }
  $('loginError').textContent='';
  $('loginBtn').textContent='Signing in…';
  try{
    const r = await fetch('/api/data',{method:'HEAD',headers:{Authorization:'Basic '+btoa(user+':'+pass)}});
    if(r.status===200){
      creds={user,pass};
      sessionStorage.setItem('creds',JSON.stringify(creds));
      $('loginView').style.display='none';
      $('app').classList.remove('hidden');
      await loadData();
    } else {
      $('loginError').textContent='Invalid credentials.';
    }
  }catch(e){
    $('loginError').textContent='Could not reach server.';
  }
  $('loginBtn').textContent='Sign in';
}

function logout(){
  if(dirty && !confirm('You have unsaved changes. Log out anyway?')) return;
  sessionStorage.removeItem('creds');
  location.reload();
}
$('logoutBtn').addEventListener('click',logout);

/* ==================================================================
   LOAD / SAVE
   ================================================================== */
async function loadData(){
  let remote = null;
  try{
    const r = await fetch('/api/data',{cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(j && typeof j === 'object' && Object.keys(j).length > 0){
        remote = j;
      }
    }
  }catch(e){}

  // If server has content — use it merged with defaults (so missing keys are safe)
  // If server has NO content — use DEFAULTS (so a fresh install isn't blank)
  state = remote ? deepMerge(structuredClone(DEFAULTS), remote) : structuredClone(DEFAULTS);

  history = { stack:[JSON.stringify(state)], index:0 };
  updateUndoRedo();
  setDirty(false);
  renderSidebar();
  renderPanel(currentPanel);

  // Wait for iframe to be ready, then push state
  if(previewReady) syncPreview();
}

async function saveData(){
  pushHistory();
  const btn = $('saveBtn');
  const original = btn.innerHTML;
  btn.innerHTML = '<span>Saving…</span>';
  try{
    const r = await fetch('/api/data',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:authHeader()},
      body:JSON.stringify(state)
    });
    if(r.ok){ toast('Saved successfully'); setDirty(false); }
    else if(r.status===401){ toast('Unauthorized — please log in again','err'); }
    else { toast('Save failed ('+r.status+')','err'); }
  }catch(e){ toast('Network error','err'); }
  btn.innerHTML = original;
}
$('saveBtn').addEventListener('click',saveData);
$('reloadBtn').addEventListener('click',async()=>{
  if(dirty && !confirm('Discard unsaved changes and reload?'))return;
  await loadData();
});
$('viewSiteBtn').addEventListener('click',()=>window.open('/','_blank'));

/* ==================================================================
   PREVIEW SYNC
   Pushes the current admin state directly to the iframe via postMessage.
   ================================================================== */
function syncPreview(){
  const f = $('previewFrame');
  if(!f || !f.contentWindow) return;
  try{
    f.contentWindow.postMessage({type:'PORTFOLIO_UPDATE', data: state}, '*');
  }catch(e){}
}

// Listen for the iframe's ready signal
window.addEventListener('message', (e)=>{
  if(e.data && e.data.type === 'PORTFOLIO_READY'){
    previewReady = true;
    syncPreview();
  }
});

$('refreshPreview').addEventListener('click', ()=>{
  const f = $('previewFrame');
  previewReady = false;
  f.addEventListener('load', ()=>{ setTimeout(()=>{ previewReady = true; syncPreview(); }, 60); }, {once:true});
  f.src = f.src;
});

function renderSidebar(){
  const sb = $('sidebar');
  sb.innerHTML = `
    <div class="sidebar-header">
      <span>Sections</span>
      <div style="display:flex;gap:4px">
        <button id="addSectionBtn" title="Add custom section">+</button>
        <button id="closeDrawerBtn" title="Close" style="display:none">✕</button>
      </div>
    </div>
    ${Object.entries(SCHEMA).map(([key,s],i)=>{
      const data = state[key]||{};
      const count = data.items?.length ?? (data.paragraphs?.length ?? (data.columns?.length ?? 0));
      const badge = count? `<span class="count">${count}</span>`:'';
      return `<a data-panel="${key}"><span class="idx">${String(i+1).padStart(2,'0')}</span><span style="flex:1">${esc(s.label)}</span>${badge}</a>`;
    }).join('')}
    <div class="divider"></div>
    <div class="sidebar-header" style="padding-top:6px">Tools</div>
    <a data-action="export"><span class="idx">↧</span><span style="flex:1">Export JSON</span></a>
    <a data-action="import"><span class="idx">↥</span><span style="flex:1">Import JSON</span></a>
    <a data-action="reset"><span class="idx">↺</span><span style="flex:1">Reset to defaults</span></a>
  `;
  sb.querySelectorAll('a[data-panel]').forEach(a=>a.addEventListener('click',()=>{
    renderPanel(a.dataset.panel);
    if(isMobile()) setTimeout(closeDrawer, 120);
  }));
  sb.querySelectorAll('a[data-action]').forEach(a=>a.addEventListener('click',()=>handleAction(a.dataset.action)));
  $('addSectionBtn').addEventListener('click', openAddSectionModal);
  const cdb = $('closeDrawerBtn');
  if(isMobile()){
    cdb.style.display = 'grid';
    cdb.addEventListener('click', closeDrawer);
  }
}

function handleAction(action){
  if(action==='export'){
    openModal('Export JSON', `
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Copy this JSON — this is the exact data your site receives.</p>
      <textarea id="exportArea" readonly>${esc(JSON.stringify(state,null,2))}</textarea>
    `, [
      {label:'Copy', cls:'primary', onClick:()=>{ $('exportArea').select(); document.execCommand('copy'); toast('Copied to clipboard'); }}
    ]);
  }
  if(action==='import'){
    openModal('Import JSON', `
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Paste JSON. This will replace your current content.</p>
      <textarea id="importArea" placeholder='{"meta":{"title":"..."}, ...}'></textarea>
    `, [
      {label:'Cancel', cls:'', onClick:closeModal},
      {label:'Import', cls:'primary', onClick:()=>{
        try{
          const parsed = JSON.parse($('importArea').value);
          state = deepMerge(structuredClone(DEFAULTS), parsed);
          pushHistory(); setDirty(true); renderPanel(currentPanel); renderSidebar(); syncPreview();
          toast('Imported');
          closeModal();
        }catch(e){ toast('Invalid JSON','err'); }
      }}
    ]);
  }
  if(action==='reset'){
    if(!confirm('Reset ALL content to defaults? This cannot be undone.')) return;
    state = structuredClone(DEFAULTS);
    pushHistory(); setDirty(true); renderPanel(currentPanel); renderSidebar(); syncPreview();
    toast('Reset to defaults','info');
  }
}

  currentPanel = key;
  if(!SCHEMA[key]) key = 'meta';
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.toggle('active',a.dataset.panel===key));
  const schema = SCHEMA[key];
  const data = state[key]||{};
  const ed = $('editor');
  ed.innerHTML = `
    <div class="editor-head">
      <div class="h-left">
        <h2><span style="opacity:.6">${schema.icon||'📄'}</span> ${esc(schema.label)}</h2>
        <p>Changes reflect in the live preview instantly. Press ⌘S to save.</p>
      </div>
      <div class="h-actions">
        <button class="btn mini" id="duplicateSectionBtn" title="Duplicate array items">Duplicate</button>
        <button class="btn mini" id="clearSectionBtn" title="Clear this section">Clear</button>
      </div>
    </div>
    <div id="panelFields"></div>
  `;
  const container = $('panelFields');
  for(const [fk,fs] of Object.entries(schema.fields)){
    container.appendChild(renderField(fs, data[fk], `${key}.${fk}`, key));
  }
  $('duplicateSectionBtn').addEventListener('click',()=>{
    const data = state[key]||{};
    Object.entries(data).forEach(([k,v])=>{
      if(Array.isArray(v)) data[k] = v.concat(JSON.parse(JSON.stringify(v)));
    });
    pushHistory(); setDirty(true); renderPanel(key); syncPreview();
    toast('Section duplicated');
  });
  $('clearSectionBtn').addEventListener('click',()=>{
    if(!confirm('Clear all fields in this section?')) return;
    const data = state[key]||{};
    Object.keys(data).forEach(k=>{
      if(Array.isArray(data[k])) data[k] = [];
      else data[k] = '';
    });
    pushHistory(); setDirty(true); renderPanel(key); syncPreview();
    toast('Section cleared','info');
  });
}

/* ==================================================================
   FIELD RENDER
   ================================================================== */
function renderField(fs, value, path, sectionKey){
  const wrap = document.createElement('div');
  wrap.className = 'field';
  wrap.dataset.path = path;

  if(fs.type==='array'){
    wrap.classList.add('array-block');
    const arr = Array.isArray(value)?value:[];
    const lbl = document.createElement('label');
    lbl.innerHTML = `${esc(fs.label)} <span class="arr-meta">${arr.length} item${arr.length===1?'':'s'}</span>`;
    wrap.appendChild(lbl);
    const list = document.createElement('div');
    list.dataset.arrPath = path;
    arr.forEach((item,i)=>list.appendChild(renderArrayItem(fs,item,i,path,sectionKey)));
    wrap.appendChild(list);
    const add = document.createElement('button');
    add.className='add-btn'; add.type='button';
    add.innerHTML = `+ Add ${esc(fs.itemLabel)}`;
    add.addEventListener('click',()=>{
      const newItem = fs.simple
        ? {value:''}
        : Object.fromEntries(Object.entries(fs.itemFields).map(([k,f])=>[k, f.type==='csv'?[]: (f.type==='array'?[]:'')]));
      const a = getPath(state,path)||[];
      a.push(newItem);
      setPath(state,path,a);
      pushHistory(); setDirty(true);
      renderPanel(sectionKey); syncPreview();
      setTimeout(()=>{ const ed=$('editor'); ed.scrollTop = ed.scrollHeight; },30);
    });
    wrap.appendChild(add);
    if(fs.help){
      const h = document.createElement('div');
      h.className='hint'; h.textContent=fs.help;
      wrap.appendChild(h);
    }
    return wrap;
  }

  const label = document.createElement('label');
  label.textContent = fs.label;
  wrap.appendChild(label);

  if(fs.type==='textarea'){
    const t = document.createElement('textarea');
    t.value = value||'';
    t.placeholder = fs.ph||'';
    t.addEventListener('input',()=>{
      setPath(state,path,t.value);
      setDirty(true);
      syncPreview();
    });
    t.addEventListener('blur',()=>pushHistory());
    wrap.appendChild(t);
  }
  else if(fs.type==='csv'){
    const t = document.createElement('input');
    t.type='text';
    t.value = (Array.isArray(value)?value:[]).join(', ');
    t.placeholder = fs.ph||'comma, separated, values';
    t.addEventListener('input',()=>{
      setPath(state,path, t.value.split(',').map(s=>s.trim()).filter(Boolean));
      setDirty(true); syncPreview();
    });
    t.addEventListener('blur',()=>pushHistory());
    wrap.appendChild(t);
  }
  else if(fs.type==='image'){
    wrap.appendChild(renderImageField(value, v=>{
      setPath(state,path,v);
      setDirty(true); syncPreview();
    }));
  }
  else{
    const t = document.createElement('input');
    t.type='text';
    t.value = value||'';
    t.placeholder = fs.ph||'';
    t.addEventListener('input',()=>{
      setPath(state,path,t.value);
      setDirty(true); syncPreview();
    });
    t.addEventListener('blur',()=>pushHistory());
    wrap.appendChild(t);
  }

  if(fs.help){
    const h = document.createElement('div');
    h.className='hint'; h.textContent=fs.help;
    wrap.appendChild(h);
  }
  return wrap;
}

/* ==================================================================
   ARRAY ITEM
   ================================================================== */
function renderArrayItem(fs, item, i, basePath, sectionKey){
  const box = document.createElement('div');
  box.className='array-item';
  box.draggable = true;
  box.dataset.index = i;

  const head = document.createElement('div');
  head.className='item-head';

  let titleText = `${fs.itemLabel} ${String(i+1).padStart(2,'0')}`;
  const itemFields = fs.simple ? {value:fs.simpleField} : fs.itemFields;
  const firstKey = Object.keys(itemFields)[0];
  const firstVal = item[firstKey];
  if(firstVal && typeof firstVal==='string'){
    titleText = firstVal.length>50 ? firstVal.slice(0,50)+'…' : firstVal;
  } else if(item.title || item.name || item.label){
    titleText = item.title || item.name || item.label;
  }

  head.innerHTML = `
    <div class="item-title">
      <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
      <span>${esc(titleText)}</span>
      <span class="pill">#${i+1}</span>
    </div>
  `;
  const actions = document.createElement('div');
  actions.className='item-actions';

  const toggle = document.createElement('button');
  toggle.className='icon-btn'; toggle.textContent='▾'; toggle.title='Collapse/Expand';
  toggle.addEventListener('click',e=>{ e.stopPropagation(); box.classList.toggle('collapsed'); });

  const up = document.createElement('button');
  up.className='icon-btn'; up.textContent='↑'; up.title='Move up';
  up.addEventListener('click',e=>{
    e.stopPropagation();
    const a = getPath(state,basePath);
    if(i>0){ [a[i-1],a[i]]=[a[i],a[i-1]]; pushHistory(); setDirty(true); renderPanel(sectionKey); syncPreview(); }
  });

  const down = document.createElement('button');
  down.className='icon-btn'; down.textContent='↓'; down.title='Move down';
  down.addEventListener('click',e=>{
    e.stopPropagation();
    const a = getPath(state,basePath);
    if(i<a.length-1){ [a[i+1],a[i]]=[a[i],a[i+1]]; pushHistory(); setDirty(true); renderPanel(sectionKey); syncPreview(); }
  });

  const dup = document.createElement('button');
  dup.className='icon-btn'; dup.textContent='⧉'; dup.title='Duplicate';
  dup.addEventListener('click',e=>{
    e.stopPropagation();
    const a = getPath(state,basePath);
    a.splice(i+1,0,JSON.parse(JSON.stringify(item)));
    pushHistory(); setDirty(true); renderPanel(sectionKey); syncPreview();
  });

  const del = document.createElement('button');
  del.className='icon-btn del'; del.textContent='✕'; del.title='Delete';
  del.addEventListener('click',e=>{
    e.stopPropagation();
    if(!confirm('Delete this item?')) return;
    const a = getPath(state,basePath);
    a.splice(i,1);
    pushHistory(); setDirty(true); renderPanel(sectionKey); syncPreview();
  });

  actions.append(toggle,up,down,dup,del);
  head.appendChild(actions);
  head.addEventListener('click',()=>box.classList.toggle('collapsed'));
  box.appendChild(head);

  const body = document.createElement('div');
  body.className='item-body';
  const keys = Object.keys(itemFields);
  const cols = keys.length>=3?2:1;
  body.style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`;

  for(const [fk,f] of Object.entries(itemFields)){
    const cell = document.createElement('div');
    if(f.type==='textarea' || f.type==='array') cell.style.gridColumn='1 / -1';
    const sub = renderField(f, item[fk], `${basePath}.${i}.${fk}`, sectionKey);
    sub.style.marginBottom='0';
    cell.appendChild(sub);
    body.appendChild(cell);
  }
  box.appendChild(body);

  box.addEventListener('dragstart',e=>{
    box.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain', String(i));
  });
  box.addEventListener('dragend',()=>box.classList.remove('dragging'));
  box.addEventListener('dragover',e=>{ e.preventDefault(); box.classList.add('drag-over'); });
  box.addEventListener('dragleave',()=>box.classList.remove('drag-over'));
  box.addEventListener('drop',e=>{
    e.preventDefault();
    box.classList.remove('drag-over');
    const from = parseInt(e.dataTransfer.getData('text/plain'),10);
    const to = i;
    if(from===to||isNaN(from)) return;
    const a = getPath(state,basePath);
    const [moved] = a.splice(from,1);
    a.splice(to,0,moved);
    pushHistory(); setDirty(true); renderPanel(sectionKey); syncPreview();
  });

  return box;
}

/* ==================================================================
   IMAGE FIELD
   ================================================================== */
function renderImageField(value, onChange){
  const w = document.createElement('div');
  w.className='image-field';
  const preview = document.createElement('div');
  preview.className='image-preview';
  preview.innerHTML = value?`<img src="${esc(value)}" alt="">`:'<span>No image</span>';

  const right = document.createElement('div');
  right.className='image-inputs';

  const urlInput = document.createElement('input');
  urlInput.type='text';
  urlInput.placeholder='https://… or upload below';
  urlInput.value = value && !value.startsWith('data:') ? value : '';
  urlInput.addEventListener('input',()=>{
    onChange(urlInput.value);
    preview.innerHTML = urlInput.value?`<img src="${esc(urlInput.value)}" alt="">`:'<span>No image</span>';
  });

  const fileWrap = document.createElement('label');
  fileWrap.className='file-label';
  fileWrap.innerHTML='📁 Upload image';
  const fileInput = document.createElement('input');
  fileInput.type='file';
  fileInput.accept='image/*';
  fileInput.addEventListener('change',()=>{
    const file = fileInput.files[0]; if(!file) return;
    compressImage(file, dataUrl=>{
      urlInput.value='';
      onChange(dataUrl);
      preview.innerHTML = `<img src="${dataUrl}" alt="">`;
    });
  });
  fileWrap.appendChild(fileInput);

  const hint = document.createElement('div');
  hint.className='hint';
  hint.textContent='Auto-compressed to ~1200px · JPEG 0.85';

  right.append(urlInput, fileWrap, hint);
  w.append(preview, right);
  return w;
}

function compressImage(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 1200;
      let {width:w,height:h} = img;
      if(w>max||h>max){ const r = Math.min(max/w, max/h); w=Math.round(w*r); h=Math.round(h*r); }
      const c = document.createElement('canvas');
      c.width=w; c.height=h;
      const ctx = c.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.85));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ==================================================================
   COMMAND PALETTE
   ================================================================== */
const cmdOverlay = $('cmdOverlay');
const cmdInput = $('cmdInput');
const cmdResults = $('cmdResults');
let cmdSel = 0;
let cmdItems = [];

function openCmd(){
  cmdOverlay.classList.add('show');
  cmdInput.value='';
  cmdInput.focus();
  buildCmdItems('');
}
function closeCmd(){ cmdOverlay.classList.remove('show'); }

function buildCmdItems(query){
  cmdItems = [];
  const q = query.toLowerCase().trim();

  Object.entries(SCHEMA).forEach(([key,s])=>{
    const label = `Go to ${s.label}`;
    if(!q || label.toLowerCase().includes(q) || key.includes(q)){
      cmdItems.push({icon:s.icon||'📄', text:label, sub:`Section · ${key}`, action:()=>{ renderPanel(key); closeCmd(); }});
    }
  });

  if(q){
    Object.entries(SCHEMA).forEach(([sk,s])=>{
      Object.entries(s.fields).forEach(([fk,f])=>{
        const label = f.label.toLowerCase();
        if(label.includes(q) || fk.includes(q)){
          cmdItems.push({
            icon:'⌨', text:f.label, sub:`${s.label} · ${fk}`,
            action:()=>{ renderPanel(sk); closeCmd();
              setTimeout(()=>{
                const el = document.querySelector(`[data-path="${sk}.${fk}"]`);
                if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.querySelector('input,textarea')?.focus(); }
              },60);
            }
          });
        }
      });
    });
  }

  const actions = [
    {icon:'💾', text:'Save changes', sub:'Ctrl+S', action:()=>{ saveData(); closeCmd(); }},
    {icon:'↻', text:'Reload from server', sub:'Discard unsaved', action:()=>{ $('reloadBtn').click(); closeCmd(); }},
    {icon:'↗', text:'Open live site', sub:'New tab', action:()=>{ window.open('/','_blank'); closeCmd(); }},
    {icon:'↧', text:'Export JSON', sub:'Download / copy', action:()=>{ handleAction('export'); closeCmd(); }},
    {icon:'↥', text:'Import JSON', sub:'Paste data', action:()=>{ handleAction('import'); closeCmd(); }},
    {icon:'👁', text:'Toggle live preview', sub:'Show/hide pane', action:()=>{ $('previewToggle').click(); closeCmd(); }},
    {icon:'↺', text:'Undo', sub:'Ctrl+Z', action:()=>{ undo(); closeCmd(); }},
    {icon:'↻', text:'Redo', sub:'Ctrl+Shift+Z', action:()=>{ redo(); closeCmd(); }},
  ];
  actions.forEach(a=>{ if(!q || a.text.toLowerCase().includes(q)) cmdItems.push(a); });

  renderCmdResults();
}

function renderCmdResults(){
  if(cmdItems.length===0){
    cmdResults.innerHTML = `<div class="cmd-empty">No results</div>`;
    return;
  }
  if(cmdSel>=cmdItems.length) cmdSel = cmdItems.length-1;
  if(cmdSel<0) cmdSel=0;
  cmdResults.innerHTML = cmdItems.map((it,i)=>`
    <div class="cmd-item ${i===cmdSel?'selected':''}" data-i="${i}">
      <span class="ico">${it.icon||'▸'}</span>
      <span class="txt">${esc(it.text)}${it.sub?`<small>${esc(it.sub)}</small>`:''}</span>
    </div>
  `).join('');
  cmdResults.querySelectorAll('.cmd-item').forEach(el=>{
    el.addEventListener('click',()=>{ cmdItems[+el.dataset.i].action(); });
    el.addEventListener('mouseenter',()=>{ cmdSel=+el.dataset.i; renderCmdResults(); });
  });
}

cmdInput.addEventListener('input',()=>{ cmdSel=0; buildCmdItems(cmdInput.value); });
cmdInput.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); cmdSel=Math.min(cmdSel+1,cmdItems.length-1); renderCmdResults(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); cmdSel=Math.max(cmdSel-1,0); renderCmdResults(); }
  else if(e.key==='Enter'){ e.preventDefault(); cmdItems[cmdSel]?.action(); }
  else if(e.key==='Escape'){ closeCmd(); }
});
cmdOverlay.addEventListener('click',e=>{ if(e.target===cmdOverlay) closeCmd(); });
$('cmdBtn').addEventListener('click',openCmd);

/* ==================================================================
   MODAL
   ================================================================== */
function openModal(title, bodyHTML, buttons){
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = bodyHTML;
  $('modalFoot').innerHTML='';
  buttons.forEach(b=>{
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls||'');
    el.textContent = b.label;
    el.addEventListener('click',b.onClick);
    $('modalFoot').appendChild(el);
  });
  $('modalOverlay').classList.add('show');
}
function closeModal(){ $('modalOverlay').classList.remove('show'); }
$('modalClose').addEventListener('click',closeModal);
$('modalOverlay').addEventListener('click',e=>{ if(e.target===$('modalOverlay')) closeModal(); });

/* ==================================================================
   ADD CUSTOM SECTION
   ================================================================== */
function openAddSectionModal(){
  openModal('Add custom section', `
    <p style="color:var(--muted);font-size:12.5px;margin-bottom:16px">Custom sections render on the portfolio as a card grid.</p>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div><label>Section key (no spaces)</label><input id="newSecKey" placeholder="achievements"></div>
      <div><label>Display label</label><input id="newSecLabel" placeholder="Achievements"></div>
      <div><label>Icon (emoji)</label><input id="newSecIcon" placeholder="🏆" value="📄"></div>
    </div>
  `, [
    {label:'Cancel', onClick:closeModal},
    {label:'Add section', cls:'primary', onClick:()=>{
      const key = ($('newSecKey').value||'').trim().replace(/[^a-zA-Z0-9]/g,'');
      const label = ($('newSecLabel').value||'').trim();
      if(!key||!label){ toast('Key and label required','err'); return; }
      if(SCHEMA[key]){ toast('Section already exists','err'); return; }
      SCHEMA[key] = {
        label, icon: $('newSecIcon').value||'📄',
        fields:{
          tag:{label:'Section tag',type:'text',ph:'Section'},
          heading:{label:'Heading',type:'text',ph:'My'},
          headingEm:{label:'Heading (italic)',type:'text',ph:'items.'},
          items:{label:label,type:'array',itemLabel:'Item',itemFields:{
            icon:{label:'Icon (emoji)',type:'text',ph:'🏆'},
            title:{label:'Title',type:'text',ph:'Item name'},
            desc:{label:'Description',type:'textarea',ph:'What is it about…'}
          }}
        }
      };
      state[key] = {tag:label,heading:'My',headingEm:'items.',items:[]};
      pushHistory(); setDirty(true); renderSidebar(); renderPanel(key); syncPreview();
      toast('Section added');
      closeModal();
    }}
  ]);
}

/* ==================================================================
   KEYBOARD SHORTCUTS
   ================================================================== */
document.addEventListener('keydown',e=>{
  const mod = e.metaKey||e.ctrlKey;
  if(mod && e.key==='s'){ e.preventDefault(); saveData(); }
  else if(mod && e.key==='k'){ e.preventDefault(); openCmd(); }
  else if(mod && e.key==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if(mod && e.key==='z' && e.shiftKey){ e.preventDefault(); redo(); }
  else if(mod && e.key==='p'){ e.preventDefault(); $('previewToggle').click(); }
  else if(e.key==='Escape'){ closeCmd(); closeModal(); closeDrawer(); }
});

window.addEventListener('beforeunload',e=>{
  if(dirty){ e.preventDefault(); e.returnValue=''; }
});
