<style>

.ambient{position:fixed;inset:0;pointer-events:none;z-index:-3;background:var(--bg);overflow:hidden}.ambient-orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.16}.ambient-orb.a{width:650px;height:650px;top:-360px;left:-220px;background:var(--blue)}.ambient-orb.b{width:600px;height:600px;right:-300px;bottom:-300px;background:var(--blue)}
.grid-bg,.pinstripe{position:fixed;inset:0;pointer-events:none;z-index:-2}.grid-bg{background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,#000,transparent 72%);opacity:.5}.pinstripe{display:none}

.ticker::before,.ticker::after{content:"";position:absolute;top:0;bottom:0;width:64px;z-index:2;pointer-events:none}.ticker::before{left:0;background:linear-gradient(90deg,#fff,transparent)}.ticker::after{right:0;background:linear-gradient(270deg,#fff,transparent)}

h1{font-size:clamp(54px,8.5vw,112px);line-height:.90;letter-spacing:-.065em;font-weight:800;max-width:900px;text-wrap:balance}h1 .line{display:block;overflow:hidden}h1 .word{display:inline-block;transform:translateY(110%);animation:riseUp .9s var(--ease) forwards}h1 .line:nth-child(2) .word{animation-delay:.08s}@keyframes riseUp{to{transform:translateY(0)}}h1 .muted{color:var(--blue)}h1 .muted::after{display:none}

.actions{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap;animation:fadeUp .8s .55s var(--ease) both}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 20px;border-radius:999px;font-size:14px;font-weight:600;min-height:46px;white-space:nowrap;transition:.25s var(--ease);border:1px solid transparent}.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 10px 24px rgba(0,113,227,.20)}.btn-primary:hover{background:#0067d1;transform:translateY(-1px);box-shadow:0 14px 30px rgba(0,113,227,.24)}.btn-secondary{background:var(--white);color:var(--black);border-color:var(--line-2)}.btn-secondary:hover{background:var(--bg-2);transform:translateY(-1px)}.btn svg{width:14px;height:14px;transition:.25s}.btn:hover svg{transform:translateX(3px)}

.section{width:100%;max-width:1240px;margin:0 auto;padding:var(--section-y) var(--pad-x);position:relative}.section-tag{display:inline-flex;align-items:center;gap:8px;font-size:10px;color:var(--blue);letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin-bottom:18px;font-family:var(--font-mono)}.section-tag::before{content:"";width:22px;height:2px;background:var(--blue);border-radius:2px}.heading{font-size:clamp(34px,5vw,62px);line-height:1.02;letter-spacing:-.055em;font-weight:800;max-width:20ch}.heading em{font-style:normal;color:var(--blue);font-weight:800}

<body>

<div class="ambient"><div class="ambient-orb a"></div><div class="ambient-orb b"></div></div>
<div class="grid-bg"></div>
<div class="pinstripe"></div>

<!-- BOOT LOADER (shown until data arrives) -->
<div class="boot-state" id="bootState">
  <div class="boot-inner">
    <div class="boot-mark" id="bootMark">··</div>
    <div class="boot-text" id="bootText">Loading portfolio</div>
    <div class="boot-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- SITE (hidden until data arrives) -->
<div id="siteRoot" style="display:none">
  <div class="ticker" id="ticker" aria-hidden="true"><div class="ticker-track" id="tickerTrack"></div></div>

  <nav>
    <div class="nav-brand">
      <div class="brand-mark" id="brandMark">··</div>
      <div class="brand-text">
        <span class="name" id="brandName"></span>
        <span class="sub" id="brandSub"></span>
      </div>
    </div>
    <div class="nav-links" id="navLinks"></div>
    <div class="nav-actions">
      <a href="#" class="status-pill" id="navStatusLink"><span class="status-dot"></span><span id="navStatusText"></span></a>
      <button class="theme-btn" id="theme" aria-label="Toggle theme">◐</button>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
    </div>
  </nav>

  <div class="drawer" id="drawer">
    <div id="drawerLinks"></div>
    <div class="divider"></div>
    <a href="#" id="drawerStatusLink"><span id="drawerStatusText" style="color:var(--green);font-family:var(--font-mono);font-size:12px">●</span><span class="arrow">→</span></a>
  </div>

  <section class="hero">
    <div class="hero-content" id="heroContent"></div>
    <div class="visual" id="heroVisual"></div>
  </section>

  <div class="stats reveal" id="statsStrip"></div>
  <section class="section reveal" id="aboutSection"></section>
  <section class="section reveal" id="servicesSection"></section>
  <section class="section reveal" id="toolsSection"></section>
  <section class="section reveal" id="experienceSection"></section>
  <section class="section reveal" id="certificationsSection"></section>
  <div id="customSections"></div>
  <section class="cta reveal" id="ctaSection"></section>
  <footer class="footer" id="footerSection"></footer>
  <div class="f-bottom" id="footerBottom"></div>
</div>

<script>
/* =========================================================
   NO DEFAULT DATA — site is 100% driven by /api/data or admin
   ========================================================= */

const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function merge(def, src){
  if(Array.isArray(def)) return Array.isArray(src) ? src : def;
  if(def && typeof def === 'object'){
    const out = {...def};
    if(src && typeof src === 'object'){
      for(const k in def){ if(k in src) out[k] = merge(def[k], src[k]); }
      for(const k in src){ if(!(k in def)) out[k] = src[k]; }
    }
    return out;
  }
  return (src === undefined || src === null || src === '') ? def : src;
}

/* Minimal safe getter — never crashes if a field is missing */
function pick(obj, path, fallback=''){
  const parts = path.split('.');
  let cur = obj;
  for(const p of parts){
    if(cur == null) return fallback;
    cur = cur[p];
  }
  return cur ?? fallback;
}
function arr(v){ return Array.isArray(v) ? v : []; }

function initials(name){
  return String(name||'CA').split(/\s+/).filter(Boolean).slice(0,2)
    .map(w=>w[0]).join('').toUpperCase().slice(0,2) || 'CA';
}

/* =========================================================
   BOOT STATE
   ========================================================= */
const bootState = document.getElementById('bootState');
const bootMark = document.getElementById('bootMark');
const bootText = document.getElementById('bootText');
const siteRoot = document.getElementById('siteRoot');

function showEmpty(message){
  bootMark.textContent = '!!';
  bootMark.style.background = 'var(--red)';
  bootMark.style.boxShadow = '0 0 40px rgba(255,61,61,.5)';
  bootText.textContent = 'No content';
  const inner = bootState.querySelector('.boot-inner');
  inner.insertAdjacentHTML('beforeend', `
    <div class="empty-state">
      <h2>No content yet</h2>
      <p>${message}</p>
      <p>Open <code>/admin.html</code>, log in, edit, then click <strong>Save changes</strong>.</p>
    </div>
  `);
  const dots = bootState.querySelector('.boot-dots');
  if(dots) dots.remove();
}

function showSite(){
  bootState.classList.add('hide');
  setTimeout(()=>{ bootState.style.display='none'; }, 400);
  siteRoot.style.display = '';
}

/* =========================================================
   RENDER
   ========================================================= */
function renderAll(d){
  if(!d || typeof d !== 'object'){ showEmpty('Data was empty or invalid.'); return; }

  // Meta
  if(d.meta?.title) document.getElementById('pageTitle').textContent = d.meta.title;
  if(d.meta?.description) document.getElementById('pageDesc').setAttribute('content', d.meta.description);

  // Nav
  const brandName = pick(d, 'nav.brandName', '—');
  const brandSub = pick(d, 'nav.brandSub', '');
  document.getElementById('brandName').textContent = brandName;
  document.getElementById('brandSub').textContent = brandSub;
  document.getElementById('brandMark').textContent = initials(brandName);
  const statusText = pick(d, 'nav.statusText', '');
  const statusLink = pick(d, 'nav.statusLink', '#');
  document.getElementById('navStatusText').textContent = statusText;
  document.getElementById('navStatusLink').setAttribute('href', statusLink || '#');
  const drawerStatusText = document.getElementById('drawerStatusText');
  const drawerStatusLink = document.getElementById('drawerStatusLink');
  if(drawerStatusText) drawerStatusText.textContent = '● ' + statusText;
  if(drawerStatusLink) drawerStatusLink.setAttribute('href', statusLink || '#');

  // Nav links (fully editable from admin)
  const navItems = arr(pick(d, 'nav.links', []));
  document.getElementById('navLinks').innerHTML = navItems.map(l=>`
    <a href="${esc(l.href||'#')}" data-scroll>${esc(l.label||'')}</a>`).join('');
  document.getElementById('drawerLinks').innerHTML = navItems.map(l=>`
    <a href="${esc(l.href||'#')}" data-scroll>${esc(l.label||'')} <span class="arrow">→</span></a>`).join('');

  // Ticker
  renderTicker(d);

  // Hero
  const hero = d.hero || {};
  document.getElementById('heroContent').innerHTML = `
    <div class="terminal-line">
      <span class="prompt">›</span>
      <span class="path">${esc(hero.terminalPath || '~/portfolio')}</span>
      <span style="color:var(--text-3)">${esc(hero.eyebrow || '')}</span>
      <span class="caret"></span>
    </div>
    <h1>
      <span class="line"><span class="word">${esc(hero.firstName || '')}</span></span>
      <span class="line"><span class="word muted">${esc(hero.lastName || '')}</span></span>
    </h1>
    <div class="role">
      <span><span class="label">role</span> <span class="val">${esc(hero.role || '')}</span></span>
      <span class="sep">/</span>
      <span><span class="label">focus</span> <span class="val">${esc(hero.roleCompany || '')}</span></span>
    </div>
    <p class="description">${hero.description || ''}</p>
    <div class="actions">
      <a href="${esc(hero.primaryBtnLink || '#')}" class="btn btn-primary">
        <span>${esc(hero.primaryBtnText || 'Contact')}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      ${hero.secondaryBtnText ? `
      <a href="${esc(hero.secondaryBtnLink || '#')}" class="btn btn-secondary">
        <span>${esc(hero.secondaryBtnText)}</span>
      </a>` : ''}
    </div>
    <div class="trust">
      ${arr(hero.trust).map(t=>`
        <div class="trust-item">
          <div class="trust-label">${esc(t.label||'')}</div>
          <div class="trust-value">${esc(t.value||'')}</div>
        </div>`).join('')}
    </div>`;

  // Hero visual
  const photo = d.photo || {};
  const goldBadge = photo.badgeGoldLabel
    ? `<div class="badge gold"><small>${esc(photo.badgeGoldLabel)}</small><strong>${esc(photo.badgeGoldText||'')}</strong></div>`
    : '';
  document.getElementById('heroVisual').innerHTML = `
    <div class="photo-aura"></div>
    ${photo.url ? `<img src="${esc(photo.url)}" alt="${esc((hero.firstName||'')+' '+(hero.lastName||''))}" class="photo" loading="eager">` : ''}
    ${photo.badgeFounderText ? `<div class="badge founder"><small>${esc(photo.badgeFounderLabel||'')}</small><strong>${esc(photo.badgeFounderText)}</strong></div>` : ''}
    ${photo.badgeStatusText ? `<div class="badge status"><small>${esc(photo.badgeStatusLabel||'')}</small><strong><span class="badge-dot"></span>${esc(photo.badgeStatusText)}</strong></div>` : ''}
    ${goldBadge}`;

  // Stats
const statsArr = Array.isArray(d.stats) ? d.stats : (d.stats?.items || []);
document.getElementById('statsStrip').innerHTML = statsArr.map(s=>`
  <div class="stat-cell">
    <div class="stat-num">${esc(s.num||'')}<em>${esc(s.suffix||'')}</em></div>
    <div class="stat-label">${esc(s.label||'')}</div>
  </div>`).join('');

  // About
  const about = d.about || {};
  document.getElementById('aboutSection').innerHTML = `
    <div class="section-tag">${esc(about.tag||'About')}</div>
    <h2 class="heading">${esc(about.heading||'')} <em>${esc(about.headingEm||'')}</em></h2>
    <div class="about-grid">
      <div class="about-copy">${arr(about.paragraphs).map(p=>`<p>${typeof p==='string'?p:(p.value||'')}</p>`).join('')}</div>
      <div class="facts">
        ${arr(about.facts).map(f=>`
          <div class="fact">
            <span class="fact-label">${esc(f.label||'')}</span>
            <span class="fact-value">${esc(f.value||'')}</span>
          </div>`).join('')}
      </div>
    </div>`;

  // Services
  const services = d.services || {};
  document.getElementById('servicesSection').innerHTML = `
    <div class="section-tag">${esc(services.tag||'Services')}</div>
    <h2 class="heading">${esc(services.heading||'')} <em>${esc(services.headingEm||'')}</em></h2>
    <div class="cards">
      ${arr(services.items).map(s=>`
        <article class="card">
          ${s.icon ? `<div class="card-icon">${esc(s.icon)}</div>` : ''}
          ${s.title ? `<h3>${esc(s.title)}</h3>` : ''}
          ${s.desc ? `<p>${esc(s.desc)}</p>` : ''}
          ${arr(s.tags).length ? `<div class="card-tags">${arr(s.tags).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        </article>`).join('')}
    </div>`;

  // Tools
  const tools = d.tools || {};
  document.getElementById('toolsSection').innerHTML = `
    <div class="section-tag">${esc(tools.tag||'Tools')}</div>
    <h2 class="heading">${esc(tools.heading||'')} <em>${esc(tools.headingEm||'')}</em></h2>
    <div class="tools">
      ${arr(tools.items).map(t=>`
        <div class="tool">
          <div class="tool-icon">${esc(t.icon||'')}</div>
          <div class="tool-name">${esc(t.name||'')}</div>
        </div>`).join('')}
    </div>`;

  // Experience
  const exp = d.experience || {};
  document.getElementById('experienceSection').innerHTML = `
    <div class="section-tag">${esc(exp.tag||'Experience')}</div>
    <h2 class="heading">${esc(exp.heading||'')} <em>${esc(exp.headingEm||'')}</em></h2>
    <div class="timeline">
      ${arr(exp.items).map(e=>`
        <div class="t-item">
          <div class="t-dot"></div>
          <div class="t-date">${esc(e.date||'')}</div>
          <div class="t-title">${esc(e.title||'')}</div>
          <div class="t-desc">${esc(e.desc||'')}</div>
        </div>`).join('')}
    </div>`;

  // Certifications
  const certs = d.certifications || {};
  document.getElementById('certificationsSection').innerHTML = `
    <div class="section-tag">${esc(certs.tag||'Certifications')}</div>
    <h2 class="heading">${esc(certs.heading||'')} <em>${esc(certs.headingEm||'')}</em></h2>
    <div class="certs">
      ${arr(certs.items).map(c=>`
        <div class="cert">
          <div class="cert-badge">${esc(c.badge||'')}</div>
          <div class="cert-title">${esc(c.title||'')}</div>
          <div class="cert-sub">${esc(c.sub||'')}</div>
        </div>`).join('')}
    </div>`;

  // Custom sections
  renderCustomSections(d);

  // CTA
  const cta = d.cta || {};
  document.getElementById('ctaSection').innerHTML = `
    <div class="cta-glow"></div>
    <div class="section-tag" style="justify-content:center;margin:0 auto 20px;display:inline-flex;">${esc(cta.tag||'')}</div>
    <h2 class="cta-title">${esc(cta.title||'')}<br><em>${esc(cta.titleEm||'')}</em></h2>
    <p class="cta-sub">${esc(cta.sub||'')}</p>
    <div class="cta-actions">
      <a href="${esc(cta.primaryBtnLink||'#')}" class="btn btn-primary">
        <span>${esc(cta.primaryBtnText||'Contact')}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      ${cta.secondaryBtnText ? `
      <a href="${esc(cta.secondaryBtnLink||'#')}" class="btn btn-secondary">
        <span>${esc(cta.secondaryBtnText)}</span>
      </a>` : ''}
    </div>`;

  // Footer
  const footer = d.footer || {};
  document.getElementById('footerSection').innerHTML = `
    <div class="f-brand">
      <div class="brand-mark">${esc(initials(brandName))}</div>
      <div class="f-name">${esc(brandName)}</div>
      <div class="f-sub">${esc(brandSub)}</div>
      <p>${esc(footer.brandText||'')}</p>
    </div>
    ${arr(footer.columns).map(col=>`
      <div class="f-col">
        <h4>${esc(col.title||'')}</h4>
        ${arr(col.links).map(l=>`<a href="${esc(l.href||'#')}">${esc(l.label||'')}</a>`).join('')}
      </div>`).join('')}`;

  document.getElementById('footerBottom').innerHTML = `
    <span>${esc(footer.copyright||'')}</span>
    <span class="f-status"><span class="f-status-dot"></span>${esc(footer.statusText||'')}</span>`;

  attachInteractions();
  showSite();
}

/* =========================================================
   TICKER
   ========================================================= */
function renderTicker(d){
  // Read ticker items from data if present, else fall back to defaults
  const items = Array.isArray(d.ticker?.items)
    ? d.ticker.items
    : (Array.isArray(d.ticker) ? d.ticker : []);

  if(!items.length){
    document.getElementById('tickerTrack').innerHTML = '';
    return;
  }

  const html = items.map(c=>{
    const dir = (c.chg === 'down') ? 'down' : 'up';
    return `
      <span class="tick">
        <span class="sym">${esc(c.sym || '')}</span>
        <span class="val">${esc(c.val || '')}</span>
        <span class="chg ${dir}">${esc(c.chgText || '')}</span>
      </span>
      <span class="sep">·</span>
    `;
  }).join('');
  document.getElementById('tickerTrack').innerHTML = html + html;
}

/* =========================================================
   CUSTOM SECTIONS
   ========================================================= */
function renderCustomSections(d){
  const CORE = new Set(['meta','nav','hero','photo','stats','about','services','tools','experience','certifications','cta','footer','ticker']);
  const host = document.getElementById('customSections');
  host.innerHTML = '';
  for(const key of Object.keys(d)){
    if(CORE.has(key)) continue;
    const s = d[key];
    if(!s || typeof s !== 'object' || !Array.isArray(s.items)) continue;

    const section = document.createElement('section');
    section.className = 'section reveal';
    section.id = `custom-${key}`;
    section.innerHTML = `
      <div class="section-tag">${esc(s.tag || key)}</div>
      <h2 class="heading">${esc(s.heading || '')} <em>${esc(s.headingEm || '')}</em></h2>
      <div class="cards">
        ${s.items.map(it=>`
          <article class="card">
            ${it.icon ? `<div class="card-icon">${esc(it.icon)}</div>` : ''}
            ${it.title ? `<h3>${esc(it.title)}</h3>` : ''}
            ${it.desc ? `<p>${esc(it.desc)}</p>` : ''}
            ${Array.isArray(it.tags) && it.tags.length ? `<div class="card-tags">${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
          </article>`).join('')}
      </div>`;
    host.appendChild(section);
  }
}

/* =========================================================
   INTERACTIONS
   ========================================================= */
function attachInteractions(){
  const io = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); }
  }),{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>{
    el.classList.remove('visible');
    io.observe(el);
  });

  const visual = document.querySelector('.visual');
  const photoEl = document.querySelector('.photo');
  if(visual && photoEl && window.matchMedia('(hover:hover)').matches){
    visual.onpointermove = e=>{
      const r = visual.getBoundingClientRect();
      const px = (e.clientX - r.left)/r.width - .5;
      const py = (e.clientY - r.top)/r.height - .5;
      photoEl.style.transform = `translate(${px*-8}px,${py*-8}px) scale(1.01)`;
    };
    visual.onpointerleave = ()=>{ photoEl.style.transform='translate(0,0) scale(1)'; };
  }

  // Nav links need fresh listeners since they are re-rendered
  document.querySelectorAll('a[href^="#"]').forEach(a=>{
    a.addEventListener('click', e=>{
      const id = a.getAttribute('href');
      if(id === '#' || id.length < 2) return;
      const target = document.querySelector(id);
      if(!target) return;
      e.preventDefault();
      const top = target.getBoundingClientRect().top + window.pageYOffset - 96;
      window.scrollTo({ top, behavior: 'smooth' });
      toggleDrawer(false);
    });
  });
}

/* =========================================================
   THEME
   ========================================================= */
const themeBtn = document.getElementById('theme');
if(localStorage.getItem('theme')==='light') document.body.classList.add('light');
themeBtn.addEventListener('click',()=>{
  document.body.classList.toggle('light');
  localStorage.setItem('theme', document.body.classList.contains('light')?'light':'dark');
});

/* =========================================================
   MOBILE DRAWER
   ========================================================= */
const drawer = document.getElementById('drawer');
const menuBtn = document.getElementById('menuBtn');

function toggleDrawer(force){
  if(!drawer || !menuBtn) return;
  const open = force !== undefined ? force : !drawer.classList.contains('open');
  drawer.classList.toggle('open', open);
  menuBtn.textContent = open ? '✕' : '☰';
  menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
}
menuBtn.addEventListener('click', ()=>toggleDrawer());
document.addEventListener('click', e=>{
  if(!drawer.classList.contains('open')) return;
  if(drawer.contains(e.target) || menuBtn.contains(e.target)) return;
  toggleDrawer(false);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') toggleDrawer(false); });
window.addEventListener('resize', ()=>{ if(window.innerWidth > 900) toggleDrawer(false); });

/* =========================================================
   AMBIENT PARALLAX
   ========================================================= */
const orbs = document.querySelectorAll('.ambient-orb');
let raf = null;
window.addEventListener('mousemove', e=>{
  if(raf) return;
  raf = requestAnimationFrame(()=>{
    raf = null;
    const x = (e.clientX/window.innerWidth - .5)*30;
    const y = (e.clientY/window.innerHeight - .5)*30;
    orbs.forEach((o,i)=>{ const m=i+1; o.style.transform=`translate(${x*m}px,${y*m}px)`; });
  });
},{passive:true});

/* =========================================================
   ADMIN PREVIEW BRIDGE
   Receives {type:'PORTFOLIO_UPDATE', data} and renders it directly.
   Falls back to /api/data on boot.
   ========================================================= */
let receivedFromAdmin = false;

window.addEventListener('message', (e)=>{
  if(e.data && e.data.type === 'PORTFOLIO_UPDATE' && e.data.data){
    receivedFromAdmin = true;
    try{
      renderAll(e.data.data);
    }catch(err){
      console.warn('[preview] render failed', err);
    }
  }
});

/* Tell parent we're ready for state */
try{
  if(window.parent !== window){
    window.parent.postMessage({type:'PORTFOLIO_READY'}, '*');
  }
}catch(e){}

/* =========================================================
   BOOT — fetch /api/data (always the database; never local defaults)
   ========================================================= */
(async function boot(){
  // If admin is going to send us data, give it a moment before showing "empty"
  const waitForAdmin = window.parent !== window;

  let remote = null;
  try{
    const r = await fetch('/api/data',{cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(j && typeof j === 'object' && Object.keys(j).length > 0){
        remote = j;
      }
    }
  }catch(e){}

  if(remote){
    renderAll(remote);
    return;
  }

  if(waitForAdmin){
    // Wait up to 1.2s for the admin to push state
    setTimeout(()=>{
      if(!receivedFromAdmin) showEmpty('The site has no saved content yet.');
    }, 1200);
  } else {
    showEmpty('The site has no saved content yet.');
  }
})();
</script>
