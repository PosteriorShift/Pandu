<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f0" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title id="pageTitle">Eshwar Goud — Chartered Accountant (Intern) · Audit & Taxation</title>
<meta name="description" id="pageDesc" content="Eshwar Goud — CA intern specialising in audit, taxation, and forensic accounting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   WALL STREET CA PORTFOLIO — DESIGN SYSTEM
   Terminal aesthetic + Apple glass + Gold accents
   ========================================================= */
:root{
  /* Dark by default — Bloomberg/Terminal feel */
  --bg:#08080a;
  --bg-2:#0e0e12;
  --bg-3:#15151a;
  --bg-elev:#1a1a20;
  --text:#f4f4f6;
  --text-2:#a8a8b3;
  --text-3:#6e6e7a;
  --text-4:#3a3a44;
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.16);
  --gold:#c9a227;
  --gold-hover:#e5bc3a;
  --gold-soft:rgba(201,162,39,.12);
  --gold-glow:rgba(201,162,39,.35);
  --green:#00c853;
  --green-soft:rgba(0,200,83,.12);
  --red:#ff3d3d;
  --red-soft:rgba(255,61,61,.12);
  --blue:#3b82f6;
  --accent:var(--gold);

  --glass-bg:rgba(18,18,22,.72);
  --glass-bg-strong:rgba(18,18,22,.9);
  --glass-specular:rgba(255,255,255,.08);
  --glass-border:rgba(255,255,255,.1);
  --glass-shadow:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);

  --pad-x:clamp(20px,4vw,56px);
  --section-y:clamp(72px,10vw,140px);
  --safe-top:env(safe-area-inset-top);
  --safe-bottom:env(safe-area-inset-bottom);

  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-serif:"Instrument Serif","New York",Georgia,serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --ease-out:cubic-bezier(.22,1,.36,1);
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:16px;
  --radius-pill:999px;
}

body.light{
  --bg:#f5f5f0;
  --bg-2:#ebebe6;
  --bg-3:#e0e0da;
  --bg-elev:#ffffff;
  --text:#0a0a0a;
  --text-2:#3a3a3a;
  --text-3:#6e6e6e;
  --text-4:#b8b8b8;
  --line:rgba(0,0,0,.10);
  --line-2:rgba(0,0,0,.20);
  --glass-bg:rgba(255,255,255,.72);
  --glass-bg-strong:rgba(255,255,255,.92);
  --glass-specular:rgba(255,255,255,.9);
  --glass-border:rgba(0,0,0,.08);
  --glass-shadow:0 12px 40px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
}

*{margin:0;padding:0;box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:var(--font-sans);background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:clip;line-height:1.5;
  letter-spacing:-.01em;font-size:15px;font-weight:400;
  transition:background .4s,color .4s;
  font-feature-settings:"kern" 1,"liga" 1,"calt" 1,"tnum" 1,"zero" 1;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%;height:auto}
::selection{background:var(--gold);color:#000}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-4)}

/* ========== GRID BACKGROUND (subtle) ========== */
.grid-bg{
  position:fixed;inset:0;pointer-events:none;z-index:-2;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 40%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 40%,transparent 100%);
  opacity:.5;
}
.ambient{
  position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-3;background:var(--bg);
}
.ambient-orb{position:absolute;border-radius:50%;filter:blur(140px);opacity:.45;will-change:transform}
.ambient-orb.a{width:min(720px,110vw);height:min(720px,110vw);top:-25vh;left:-15vw;
  background:radial-gradient(circle,var(--gold-soft),transparent 70%)}
.ambient-orb.b{width:min(620px,90vw);height:min(620px,90vw);bottom:-20vh;right:-15vw;
  background:radial-gradient(circle,rgba(59,130,246,.10),transparent 70%)}

/* ========== GLASS PRIMITIVE ========== */
.glass{
  position:relative;background:var(--glass-bg);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-specular);
}

/* ========== TOP TICKER BAR ========== */
.ticker{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:32px;padding-top:var(--safe-top);
  background:rgba(8,8,10,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;overflow:hidden;
  font-family:var(--font-mono);font-size:11px;color:var(--text-3);
}
body.light .ticker{background:rgba(245,245,240,.92)}
.ticker::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:60px;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,var(--bg) 0%,transparent 100%);
}
.ticker::after{
  content:"";position:absolute;right:0;top:0;bottom:0;width:60px;z-index:2;pointer-events:none;
  background:linear-gradient(270deg,var(--bg) 0%,transparent 100%);
}
.ticker-track{
  display:flex;gap:32px;animation:ticker 40s linear infinite;
  padding-left:100%;white-space:nowrap;will-change:transform;
}
@keyframes ticker{to{transform:translateX(-100%)}}
.tick{display:inline-flex;align-items:center;gap:8px}
.tick .sym{color:var(--text-2);font-weight:600;letter-spacing:.04em}
.tick .val{color:var(--text);font-weight:500}
.tick .chg{font-weight:600;font-family:var(--font-mono)}
.tick .chg.up{color:var(--green)}
.tick .chg.down{color:var(--red)}
.tick .chg::before{content:"";display:inline-block;width:0;height:0;margin-right:3px;
  border-left:3px solid transparent;border-right:3px solid transparent}
.tick .chg.up::before{border-bottom:4px solid var(--green)}
.tick .chg.down::before{border-top:4px solid var(--red)}
.tick .sep{color:var(--text-4);margin-left:16px}

/* ========== NAV ========== */
nav{
  position:fixed;top:calc(32px + var(--safe-top));left:0;right:0;z-index:100;
  height:64px;padding:0 var(--pad-x);
  background:rgba(8,8,10,.78);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
body.light nav{background:rgba(245,245,240,.8)}
.nav-brand{display:flex;align-items:center;gap:12px;min-width:0;flex-shrink:1}
.brand-mark{
  width:32px;height:32px;border-radius:6px;background:var(--gold);color:#000;
  display:grid;place-items:center;font-family:var(--font-mono);font-weight:800;font-size:13px;
  letter-spacing:-.02em;flex-shrink:0;box-shadow:0 0 20px var(--gold-glow);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text .name{font-size:14px;font-weight:700;letter-spacing:-.02em;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-text .sub{font-size:10.5px;color:var(--text-3);font-family:var(--font-mono);
  letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.nav-links{display:flex;align-items:center;gap:2px}
.nav-links a{
  padding:9px 14px;border-radius:6px;font-size:13px;font-weight:500;
  color:var(--text-2);letter-spacing:-.01em;transition:.15s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.nav-links a:hover{color:var(--text);background:var(--bg-3)}
.nav-links a.active{color:var(--gold);background:var(--gold-soft)}

.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.status-pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 12px;border-radius:var(--radius-pill);
  background:var(--green-soft);border:1px solid rgba(0,200,83,.2);
  color:var(--green);font-size:11.5px;font-weight:500;font-family:var(--font-mono);
  letter-spacing:.02em;white-space:nowrap;
}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 3px rgba(0,200,83,.15);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.theme-btn,.menu-btn{
  width:38px;height:38px;border-radius:var(--radius);
  display:grid;place-items:center;color:var(--text-2);
  border:1px solid var(--line);background:var(--bg-2);
  transition:.15s;font-size:14px;
}
.theme-btn:hover,.menu-btn:hover{color:var(--text);background:var(--bg-3);border-color:var(--line-2)}
.menu-btn{display:none}

/* ========== MOBILE DRAWER ========== */
.drawer{
  position:fixed;top:calc(32px + var(--safe-top) + 64px);right:var(--pad-x);
  z-index:99;width:min(280px,calc(100vw - 40px));
  background:var(--glass-bg-strong);
  backdrop-filter:blur(40px) saturate(200%);
  -webkit-backdrop-filter:blur(40px) saturate(200%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  box-shadow:var(--glass-shadow);
  padding:8px;
  transform:translateY(-8px) scale(.98);opacity:0;pointer-events:none;
  transition:.25s var(--ease-out);
  max-height:calc(100dvh - 130px);overflow-y:auto;
}
.drawer.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
.drawer a{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 14px;border-radius:8px;font-size:14px;font-weight:500;
  color:var(--text-2);transition:.15s;
}
.drawer a:hover,.drawer a:active{background:var(--bg-3);color:var(--text)}
.drawer a .arrow{color:var(--text-4);font-family:var(--font-mono);font-size:12px}
.drawer .divider{height:1px;background:var(--line);margin:6px 10px}

/* ========== HERO ========== */
.hero{
  width:100%;max-width:1280px;margin:0 auto;
  min-height:100svh;
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  align-items:center;gap:clamp(40px,6vw,80px);
  padding:calc(180px + var(--safe-top)) var(--pad-x) 80px;
}
@supports(height:100dvh){.hero{min-height:100dvh}}
.hero-content{position:relative;z-index:2;min-width:0}

.terminal-line{
  display:inline-flex;align-items:center;gap:10px;
  padding:6px 12px;border-radius:var(--radius-sm);
  background:var(--bg-2);border:1px solid var(--line);
  font-family:var(--font-mono);font-size:11px;color:var(--text-3);
  margin-bottom:28px;letter-spacing:.04em;
  opacity:0;animation:fadeUp .8s .1s var(--ease-out) forwards;
}
.terminal-line .prompt{color:var(--green);font-weight:700}
.terminal-line .path{color:var(--gold)}
.terminal-line .caret{
  display:inline-block;width:7px;height:12px;background:var(--text-2);
  animation:blink 1.1s steps(1) infinite;margin-left:2px;
}
@keyframes blink{50%{opacity:0}}

h1{
  font-size:clamp(48px,8.5vw,110px);
  line-height:.92;letter-spacing:-.05em;font-weight:900;
  overflow:hidden;color:var(--text);text-wrap:balance;
}
h1 .line{display:block;overflow:hidden}
h1 .word{display:inline-block;transform:translateY(110%);
  animation:riseUp 1s var(--ease-out) forwards}
h1 .line:nth-child(2) .word{animation-delay:.08s}
@keyframes riseUp{to{transform:translateY(0)}}
h1 .muted{color:var(--gold);position:relative}
h1 .muted::after{
  content:"";position:absolute;bottom:8px;left:0;right:0;height:3px;
  background:var(--gold);opacity:.25;border-radius:2px;
}

.role{
  margin-top:26px;font-family:var(--font-mono);font-size:clamp(13px,1.3vw,15px);
  color:var(--text-2);letter-spacing:.02em;
  display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;
  opacity:0;animation:fadeUp .8s .4s var(--ease-out) forwards;
}
.role .label{color:var(--text-3);text-transform:uppercase;letter-spacing:.08em}
.role .val{color:var(--text);font-weight:600}
.role .sep{color:var(--text-4)}

.description{
  max-width:600px;margin-top:24px;color:var(--text-2);
  font-size:clamp(15px,1.4vw,16.5px);line-height:1.6;letter-spacing:-.005em;
  opacity:0;animation:fadeUp .8s .5s var(--ease-out) forwards;
}
.description strong{color:var(--text);font-weight:600}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.actions{
  display:flex;gap:10px;margin-top:36px;flex-wrap:wrap;
  opacity:0;animation:fadeUp .8s .65s var(--ease-out) forwards;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 22px;border-radius:var(--radius);
  font-size:13.5px;font-weight:600;letter-spacing:-.01em;
  transition:transform .2s var(--ease-out),background .2s,box-shadow .2s,border-color .2s;
  min-height:48px;white-space:nowrap;position:relative;
  font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;
}
.btn-primary{
  background:var(--gold);color:#000;border:1px solid var(--gold);
  box-shadow:0 4px 20px var(--gold-glow);
}
.btn-primary:hover{background:var(--gold-hover);border-color:var(--gold-hover);
  box-shadow:0 8px 28px var(--gold-glow);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0) scale(.98)}
.btn-secondary{
  background:transparent;color:var(--text);
  border:1px solid var(--line-2);
}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.btn svg{width:13px;height:13px;flex-shrink:0;transition:transform .3s var(--ease-out)}
.btn:hover svg{transform:translateX(3px)}

/* Trust strip — terminal style data row */
.trust{
  margin-top:44px;padding-top:28px;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:600px;
  opacity:0;animation:fadeUp .8s .8s var(--ease-out) forwards;
}
.trust-item{min-width:0;position:relative;padding-left:14px}
.trust-item::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;
  background:var(--gold);opacity:.4;border-radius:2px}
.trust-label{font-size:10px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;
  font-weight:600;margin-bottom:6px;font-family:var(--font-mono)}
.trust-value{font-size:14px;color:var(--text);font-weight:600;letter-spacing:-.01em;
  line-height:1.35;word-break:break-word}

/* ========== PORTRAIT ========== */
.visual{
  position:relative;height:clamp(440px,68vh,680px);
  display:flex;align-items:center;justify-content:center;min-width:0;
  opacity:0;animation:fadeIn 1.2s .2s var(--ease-out) forwards;
}
@keyframes fadeIn{to{opacity:1}}
.photo-aura{
  position:absolute;top:50%;left:50%;width:min(520px,80%);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--gold-soft),transparent 65%);
  filter:blur(60px);transform:translate(-50%,-50%);z-index:0;pointer-events:none;
}
.photo{
  position:relative;width:min(460px,100%);height:100%;object-fit:cover;z-index:2;
  filter:contrast(1.05) saturate(.9);
  mask-image:radial-gradient(ellipse 76% 84% at center 45%,
    #000 60%,rgba(0,0,0,.85) 76%,rgba(0,0,0,.3) 90%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 76% 84% at center 45%,
    #000 60%,rgba(0,0,0,.85) 76%,rgba(0,0,0,.3) 90%,transparent 100%);
}
.visual::after{
  content:"";position:absolute;inset:auto 0 0 0;height:26%;pointer-events:none;
  background:linear-gradient(to bottom,transparent,var(--bg) 92%);z-index:3;
}

/* Data badges floating over portrait */
.badge{
  position:absolute;padding:11px 14px;border-radius:var(--radius);
  background:var(--glass-bg-strong);
  backdrop-filter:blur(30px) saturate(200%);
  -webkit-backdrop-filter:blur(30px) saturate(200%);
  border:1px solid var(--glass-border);
  box-shadow:0 8px 32px rgba(0,0,0,.3),inset 0 1px 0 var(--glass-specular);
  z-index:5;max-width:calc(100% - 24px);
  transition:.3s var(--ease-out);
  font-family:var(--font-mono);
}
.badge:hover{transform:translateY(-2px);border-color:var(--gold)}
.badge small{
  display:block;font-size:9.5px;color:var(--text-3);
  letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:4px;
}
.badge strong{
  font-size:12px;font-weight:600;letter-spacing:.01em;
  color:var(--text);display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.badge-dot{
  width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;
  box-shadow:0 0 0 3px rgba(0,200,83,.15);
}
.badge.founder{left:0;bottom:14%;border-left:2px solid var(--gold)}
.badge.status{right:0;top:14%;border-left:2px solid var(--green)}
.badge.gold{left:4%;top:8%;border-left:2px solid var(--gold)}

/* ========== STATS STRIP ========== */
.stats{
  width:100%;max-width:1280px;margin:0 auto;
  padding:clamp(36px,5vw,64px) var(--pad-x);
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:1px;background:var(--line);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.stat-cell{
  background:var(--bg);padding:24px 20px;
  display:flex;flex-direction:column;gap:10px;
  position:relative;overflow:hidden;
}
.stat-cell::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--gold),transparent);
  opacity:0;transition:opacity .3s;
}
.stat-cell:hover::before{opacity:1}
.stat-cell:hover{background:var(--bg-2)}
.stat-num{
  font-size:clamp(28px,3.6vw,44px);line-height:1;letter-spacing:-.045em;font-weight:800;
  color:var(--text);font-variant-numeric:tabular-nums;font-family:var(--font-sans);
  display:flex;align-items:baseline;gap:2px;
}
.stat-num em{
  font-family:var(--font-mono);font-style:normal;font-weight:600;
  color:var(--gold);font-size:.7em;letter-spacing:0;
}
.stat-label{
  margin-top:auto;font-size:11px;color:var(--text-3);
  letter-spacing:.06em;line-height:1.4;font-weight:600;
  text-transform:uppercase;font-family:var(--font-mono);
}

/* ========== SECTIONS ========== */
.section{
  width:100%;max-width:1200px;margin:0 auto;
  padding:var(--section-y) var(--pad-x);position:relative;
}
.section-tag{
  display:inline-flex;align-items:center;gap:10px;
  font-size:11px;color:var(--gold);
  letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  margin-bottom:20px;font-family:var(--font-mono);
}
.section-tag::before{
  content:"//";color:var(--text-4);font-weight:700;
}
.heading{
  font-size:clamp(30px,4.5vw,54px);line-height:1.06;letter-spacing:-.04em;font-weight:800;
  color:var(--text);max-width:22ch;text-wrap:balance;
}
.heading em{
  font-family:var(--font-serif);font-style:italic;font-weight:400;
  color:var(--gold);letter-spacing:-.02em;
}

/* ========== ABOUT ========== */
.about-grid{
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  gap:clamp(40px,5vw,72px);align-items:start;
  margin-top:clamp(40px,5vw,60px);
}
.about-copy p{
  font-size:15px;line-height:1.7;letter-spacing:-.005em;
  color:var(--text-2);margin-bottom:22px;
}
.about-copy p:last-child{margin-bottom:0}
.about-copy p strong{color:var(--text);font-weight:600}

.facts{
  display:flex;flex-direction:column;
  border:1px solid var(--line);border-radius:var(--radius-lg);
  overflow:hidden;background:var(--bg-2);
  font-family:var(--font-mono);
}
.fact{
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:14px 18px;border-bottom:1px solid var(--line);
  transition:background .2s;position:relative;
}
.fact:last-child{border-bottom:0}
.fact:hover{background:var(--bg-3)}
.fact:hover::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);
}
.fact-label{
  font-size:11px;color:var(--text-3);letter-spacing:.06em;
  font-weight:600;flex-shrink:0;text-transform:uppercase;
}
.fact-value{
  font-size:13px;color:var(--text);font-weight:500;
  text-align:right;word-break:break-word;
}

/* ========== CARDS ========== */
.cards{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;margin-top:clamp(40px,5vw,56px);
}
.card{
  background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:28px;
  display:flex;flex-direction:column;
  min-height:240px;position:relative;overflow:hidden;
  transition:.3s var(--ease-out);
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0;transition:opacity .3s;
}
.card:hover{background:var(--bg-3);transform:translateY(-3px);
  border-color:var(--line-2);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.card:hover::before{opacity:.6}
.card:hover .card-icon{border-color:var(--gold);color:var(--gold)}
.card-icon{
  width:48px;height:48px;border-radius:var(--radius);
  background:var(--bg-3);border:1px solid var(--line-2);
  display:grid;place-items:center;font-size:22px;
  margin-bottom:24px;flex-shrink:0;transition:.3s;
  font-family:var(--font-mono);
}
.card h3{
  font-size:17px;line-height:1.25;letter-spacing:-.02em;font-weight:700;
  margin-bottom:10px;color:var(--text);
}
.card p{
  color:var(--text-2);font-size:13.5px;line-height:1.6;
  letter-spacing:-.005em;
}
.card-tags{
  margin-top:auto;padding-top:20px;
  display:flex;flex-wrap:wrap;gap:6px;
}
.tag{
  font-size:10px;font-weight:600;
  padding:4px 9px;border-radius:var(--radius-sm);
  background:var(--bg-3);border:1px solid var(--line);
  color:var(--text-3);letter-spacing:.06em;
  text-transform:uppercase;font-family:var(--font-mono);
}

/* ========== TOOLS ========== */
.tools{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;
  margin-top:clamp(40px,5vw,56px);
}
.tool{
  background:var(--bg-2);padding:24px 12px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:background .2s;text-align:center;
}
.tool:hover{background:var(--bg-3)}
.tool:hover .tool-icon{border-color:var(--gold)}
.tool-icon{
  width:42px;height:42px;border-radius:var(--radius);
  background:var(--bg-3);border:1px solid var(--line-2);
  display:grid;place-items:center;font-size:18px;
  transition:.2s;
}
.tool-name{
  font-size:11px;color:var(--text-2);font-weight:600;
  letter-spacing:.02em;line-height:1.3;
  font-family:var(--font-mono);text-transform:uppercase;
}

/* ========== TIMELINE ========== */
.timeline{
  margin-top:clamp(40px,5vw,56px);
  position:relative;padding-left:36px;
}
.timeline::before{
  content:"";position:absolute;left:8px;top:12px;bottom:12px;width:1px;
  background:linear-gradient(180deg,var(--gold),transparent);
  opacity:.4;
}
.t-item{position:relative;padding-bottom:clamp(32px,4vw,44px)}
.t-item:last-child{padding-bottom:0}
.t-dot{
  position:absolute;left:-36px;top:6px;
  width:17px;height:17px;border-radius:50%;
  background:var(--bg);border:2px solid var(--text-4);
  display:grid;place-items:center;
}
.t-dot::after{
  content:"";width:5px;height:5px;border-radius:50%;background:var(--text-4);
}
.t-item:first-child .t-dot{
  border-color:var(--gold);background:var(--gold);
  box-shadow:0 0 0 6px var(--gold-soft);
}
.t-item:first-child .t-dot::after{background:#000}
.t-date{
  font-size:10.5px;color:var(--gold);
  letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  margin-bottom:8px;font-family:var(--font-mono);
}
.t-title{
  font-size:17px;font-weight:700;
  letter-spacing:-.02em;margin-bottom:6px;color:var(--text);
}
.t-desc{
  font-size:14px;color:var(--text-2);line-height:1.65;
  letter-spacing:-.005em;max-width:62ch;
}

/* ========== CERTS ========== */
.certs{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;margin-top:clamp(40px,5vw,56px);
}
.cert{
  background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:24px;
  display:flex;flex-direction:column;gap:14px;
  transition:.25s var(--ease-out);position:relative;overflow:hidden;
}
.cert::after{
  content:"";position:absolute;top:0;right:0;
  width:0;height:0;border-style:solid;
  border-width:0 24px 24px 0;
  border-color:transparent var(--gold-soft) transparent transparent;
  transition:.3s;
}
.cert:hover{background:var(--bg-3);transform:translateY(-2px);border-color:var(--line-2)}
.cert:hover::after{border-color:transparent var(--gold) transparent transparent}
.cert-badge{
  width:46px;height:46px;border-radius:var(--radius);
  background:var(--bg-3);border:1px solid var(--line-2);
  display:grid;place-items:center;font-size:20px;
  transition:.2s;
}
.cert:hover .cert-badge{border-color:var(--gold)}
.cert-title{
  font-size:14.5px;font-weight:700;letter-spacing:-.01em;
  color:var(--text);
}
.cert-sub{
  font-size:12.5px;color:var(--text-2);line-height:1.55;
  letter-spacing:-.005em;
}

/* ========== CTA ========== */
.cta{
  width:100%;max-width:1200px;margin:0 auto;
  padding:var(--section-y) var(--pad-x);
  text-align:center;position:relative;
}
.cta-glow{
  position:absolute;width:min(800px,140vw);aspect-ratio:1;
  left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,var(--gold-soft),transparent 60%);
  filter:blur(90px);pointer-events:none;z-index:-1;
}
.cta-title{
  font-size:clamp(34px,5.5vw,74px);
  line-height:1.02;letter-spacing:-.045em;font-weight:900;
  max-width:16ch;margin:20px auto 0;text-wrap:balance;
}
.cta-title em{
  font-family:var(--font-serif);font-style:italic;font-weight:400;
  color:var(--gold);
}
.cta-sub{
  margin:22px auto 0;max-width:540px;color:var(--text-2);
  font-size:15px;line-height:1.65;letter-spacing:-.005em;
}
.cta-actions{
  margin-top:36px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;
}

/* ========== FOOTER ========== */
.footer{
  width:100%;max-width:1200px;margin:0 auto;
  padding:clamp(40px,5vw,64px) var(--pad-x) clamp(20px,3vw,28px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);
  gap:clamp(30px,4vw,60px);
}
.f-brand .brand-mark{margin-bottom:16px}
.f-brand .f-name{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.f-brand .f-sub{
  font-size:11px;color:var(--text-3);font-family:var(--font-mono);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px;
}
.f-brand p{
  color:var(--text-2);font-size:13px;line-height:1.65;max-width:38ch;
}
.f-col h4{
  font-size:10.5px;color:var(--text-3);
  letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  margin-bottom:16px;font-family:var(--font-mono);
}
.f-col a{
  display:block;padding:7px 0;color:var(--text-2);
  font-size:13px;letter-spacing:-.005em;
  transition:.15s;width:fit-content;min-height:32px;
}
.f-col a:hover{color:var(--gold);padding-left:4px}
.f-bottom{
  width:100%;max-width:1200px;margin:0 auto;
  padding:22px var(--pad-x) calc(32px + var(--safe-bottom));
  display:flex;justify-content:space-between;align-items:center;
  gap:16px;flex-wrap:wrap;
  font-size:11.5px;color:var(--text-3);
  letter-spacing:.02em;border-top:1px solid var(--line);
  font-family:var(--font-mono);
}
.f-status{display:inline-flex;align-items:center;gap:8px}
.f-status-dot{
  width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;
  box-shadow:0 0 0 3px rgba(0,200,83,.15);
}

/* ========== REVEAL ========== */
.reveal{
  opacity:0;transform:translateY(20px);
  transition:opacity .9s var(--ease-out),transform .9s var(--ease-out);
}
.reveal.visible{opacity:1;transform:translateY(0)}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media(max-width:1024px){
  .about-grid{grid-template-columns:minmax(0,1fr);gap:36px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tools{grid-template-columns:repeat(4,minmax(0,1fr))}
  .certs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .footer{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .f-brand{grid-column:1 / -1}
}

@media(max-width:900px){
  .nav-links{display:none}
  .menu-btn{display:grid}
  .status-pill{display:none}
}

@media(max-width:720px){
  :root{--pad-x:20px}
  body{font-size:14.5px}

  .ticker{height:28px;font-size:10px}
  .ticker-track{gap:24px}

  nav{top:calc(28px + var(--safe-top));height:56px;padding:0 16px}

  .hero{
    grid-template-columns:minmax(0,1fr);
    gap:32px;
    padding:calc(120px + var(--safe-top)) var(--pad-x) 48px;
    min-height:auto;
  }
  @supports(height:100dvh){.hero{min-height:100dvh;padding-top:calc(120px + var(--safe-top))}}

  h1{font-size:clamp(40px,12vw,68px);letter-spacing:-.04em}
  .role{font-size:12px;margin-top:20px;gap:6px 10px}
  .description{font-size:15px;margin-top:20px}

  .actions{gap:10px;margin-top:28px}
  .actions .btn{flex:1 1 auto;padding:13px 18px;font-size:12.5px;min-height:46px}

  .trust{
    grid-template-columns:minmax(0,1fr);gap:0;
    margin-top:32px;padding-top:24px;
  }
  .trust-item{
    padding:12px 0 12px 14px;
    border-bottom:1px solid var(--line);
  }
  .trust-item:last-child{border-bottom:0}
  .trust-item:first-child{padding-top:12px}

  .visual{order:-1;height:clamp(340px,48vh,440px);margin-bottom:4px}
  .photo{width:min(300px,84%)}
  .badge{padding:9px 12px;border-radius:10px}
  .badge strong{font-size:11px}
  .badge small{font-size:8.5px;margin-bottom:3px}
  .badge.founder{left:0;bottom:8%}
  .badge.status{right:0;top:8%}
  .badge.gold{display:none}

  .cards{grid-template-columns:minmax(0,1fr);gap:12px}
  .card{min-height:auto;padding:22px}
  .card-icon{width:44px;height:44px;font-size:20px;margin-bottom:18px}

  .tools{
    grid-template-columns:repeat(3,minmax(0,1fr));
    border-radius:var(--radius);
  }
  .tool{padding:18px 8px}
  .tool-icon{width:36px;height:36px;font-size:16px}
  .tool-name{font-size:10px}

  .certs{grid-template-columns:minmax(0,1fr)}

  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:1px;padding:0 var(--pad-x);
  }
  .stat-cell{padding:20px 16px}
  .stat-num{font-size:26px}
  .stat-label{font-size:10px}

  .fact{padding:12px 16px;flex-direction:column;align-items:flex-start;gap:4px}
  .fact-value{text-align:left}

  .timeline{padding-left:28px}
  .t-dot{left:-28px;width:15px;height:15px}
  .t-title{font-size:15.5px}
  .t-desc{font-size:13.5px}

  .cta-actions{flex-direction:column;align-items:stretch}
  .cta-actions .btn{width:100%}

  .footer{
    grid-template-columns:minmax(0,1fr);
    gap:32px;padding:40px var(--pad-x);
  }
  .f-brand p{max-width:100%}
  .f-bottom{
    flex-direction:column;align-items:flex-start;gap:10px;
    padding:20px var(--pad-x) calc(24px + var(--safe-bottom));
    font-size:10.5px;
  }

  .section{padding:clamp(56px,10vw,80px) var(--pad-x)}
  .heading{font-size:clamp(26px,8vw,40px)}
}

@media(max-width:380px){
  h1{font-size:clamp(34px,11vw,50px)}
  .visual{height:clamp(300px,42vh,380px)}
  .photo{width:min(260px,86%)}
  .badge.status{display:none}
  .tools{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat-num{font-size:22px}
}

/* Landscape phone */
@media(max-height:500px) and (orientation:landscape){
  .hero{min-height:auto;padding-top:calc(90px + var(--safe-top));padding-bottom:32px}
  .visual{height:280px}
  .photo{width:min(200px,58%)}
}

/* Touch devices — disable hover lift */
@media(hover:none){
  .card:hover,.cert:hover,.btn:hover,.badge:hover{transform:none}
  .card:hover{background:var(--bg-2)}
  .cert:hover{background:var(--bg-2)}
}

/* Reduced motion */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;
  }
  h1 .word{transform:none!important}
  .ticker-track{animation:none;padding-left:0}
  .terminal-line .caret{animation:none}
}

/* Prevent iOS input zoom */
@supports(-webkit-touch-callout:none){
  input,textarea,select{font-size:16px}
}

/* =========================================================
   HELPERS
   ========================================================= */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function merge(def, src){
  if(Array.isArray(def)) return Array.isArray(src) ? src : def;
  if(def && typeof def === 'object'){
    const out = {...def};
    if(src && typeof src === 'object'){
      for(const k in def){
        if(k in src) out[k] = merge(def[k], src[k]);
      }
      for(const k in src){
        if(!(k in def)) out[k] = src[k];
      }
    }
    return out;
  }
  return (src === undefined || src === null || src === '') ? def : src;
}

/* Derive initials from brand name for the nav mark */
function initials(name){
  return (name||'CA').split(/\s+/).filter(Boolean).slice(0,2)
    .map(w=>w[0]).join('').toUpperCase().slice(0,2) || 'CA';
}

/* =========================================================

   ========================================================= */
function renderCustomSections(d){
  const CORE = new Set(['meta','nav','hero','photo','stats','about','services','tools','experience','certifications','cta','footer']);
  const host = document.getElementById('customSections');
  host.innerHTML = '';
  for(const key of Object.keys(d)){
    if(CORE.has(key)) continue;
    const s = d[key];
    if(!s || typeof s !== 'object' || !Array.isArray(s.items)) continue;

    const section = document.createElement('section');
    section.className = 'section reveal';
    section.id = `custom-${key}`;
    section.innerHTML = `
      <div class="section-tag">${esc(s.tag || key)}</div>
      <h2 class="heading">${esc(s.heading || '')} <em>${esc(s.headingEm || '')}</em></h2>
      <div class="cards">
        ${s.items.map(it=>`
          <article class="card">
            ${it.icon ? `<div class="card-icon">${esc(it.icon)}</div>` : ''}
            ${it.title ? `<h3>${esc(it.title)}</h3>` : ''}
            ${it.desc ? `<p>${esc(it.desc)}</p>` : ''}
            ${Array.isArray(it.tags) && it.tags.length ? `<div class="card-tags">${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
          </article>`).join('')}
      </div>`;
    host.appendChild(section);
  }
}

/* =========================================================
   INTERACTIONS
   ========================================================= */
function attachInteractions(){
  // Reveal on scroll
  const io = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); }
  }),{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>{
    el.classList.remove('visible');
    io.observe(el);
  });

  // Portrait parallax (desktop only)
  const visual = document.querySelector('.visual');
  const photo = document.querySelector('.photo');
  if(visual && photo && window.matchMedia('(hover:hover)').matches){
    visual.onpointermove = e=>{
      const r = visual.getBoundingClientRect();
      const px = (e.clientX - r.left)/r.width - .5;
      const py = (e.clientY - r.top)/r.height - .5;
      photo.style.transform = `translate(${px*-8}px,${py*-8}px) scale(1.01)`;
    };
    visual.onpointerleave = ()=>{ photo.style.transform='translate(0,0) scale(1)'; };
  }
}

const themeBtn = document.getElementById('theme');
// Dark by default; light only if explicitly saved

/* =========================================================
   MOBILE DRAWER
   ========================================================= */
const drawer = document.getElementById('drawer');
const menuBtn = document.getElementById('menuBtn');

function toggleDrawer(force){
  if(!drawer || !menuBtn) return;
  const open = force !== undefined ? force : !drawer.classList.contains('open');
  drawer.classList.toggle('open', open);
  menuBtn.textContent = open ? '✕' : '☰';
  menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
}

menuBtn.addEventListener('click', ()=>toggleDrawer());

document.querySelectorAll('#drawer a[data-scroll]').forEach(a=>{
  a.addEventListener('click', ()=>toggleDrawer(false));
});

document.addEventListener('click', e=>{
  if(!drawer.classList.contains('open')) return;
  if(drawer.contains(e.target) || menuBtn.contains(e.target)) return;
  toggleDrawer(false);
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape') toggleDrawer(false);
});

window.addEventListener('resize', ()=>{
  if(window.innerWidth > 900) toggleDrawer(false);
});

/* =========================================================
   SMOOTH SCROLL FOR ANCHORS
   ========================================================= */
document.querySelectorAll('a[href^="#"]').forEach(a=>{
  a.addEventListener('click', e=>{
    const id = a.getAttribute('href');
    if(id === '#' || id.length < 2) return;
    const target = document.querySelector(id);
    if(!target) return;
    e.preventDefault();
    const top = target.getBoundingClientRect().top + window.pageYOffset - 96;
    window.scrollTo({ top, behavior: 'smooth' });
    toggleDrawer(false);
  });
});

/* =========================================================
   AMBIENT PARALLAX
   ========================================================= */
const orbs = document.querySelectorAll('.ambient-orb');
let raf = null;
window.addEventListener('mousemove', e=>{
  if(raf) return;
  raf = requestAnimationFrame(()=>{
    raf = null;
    const x = (e.clientX/window.innerWidth - .5)*30;
    const y = (e.clientY/window.innerHeight - .5)*30;
    orbs.forEach((o,i)=>{ const m=i+1; o.style.transform=`translate(${x*m}px,${y*m}px)`; });
  });
},{passive:true});
