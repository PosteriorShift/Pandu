<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title id="pageTitle">Portfolio</title>
<meta name="description" id="pageDesc" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,500;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   APPLE-LEVEL VISUAL REFINEMENT — CLEAN, QUIET, PRECISE
   Presentation only — no API/data/rendering logic changes.
   ========================================================= */
:root{
  --blue:#0071e3;
  --blue-2:#0077ed;
  --white:#fff;
  --black:#000;
  --bg:#fff;
  --bg-2:#f5f5f7;
  --bg-3:#e8e8ed;
  --text:#1d1d1f;
  --text-2:#6e6e73;
  --text-3:#86868b;
  --text-4:#a1a1a6;
  --line:rgba(0,0,0,.08);
  --line-2:rgba(0,0,0,.14);
  --blue-soft:rgba(0,113,227,.08);
  --blue-line:rgba(0,113,227,.18);
  --shadow:0 24px 70px rgba(0,0,0,.08),0 4px 18px rgba(0,0,0,.04);
  --shadow-soft:0 12px 36px rgba(0,0,0,.06);
  --pad-x:clamp(20px,5vw,72px);
  --section-y:clamp(88px,11vw,156px);
  --radius:28px;
  --radius-sm:18px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --safe-top:env(safe-area-inset-top);
  --safe-bottom:env(safe-area-inset-bottom);
}

*{margin:0;padding:0;box-sizing:border-box;min-width:0}
html{
  scroll-behavior:smooth;
  background:#fff;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  scroll-padding-top:110px;
}
body{
  font-family:var(--font-sans);
  background:#fff;
  color:var(--text);
  min-height:100dvh;
  overflow-x:hidden;
  line-height:1.47;
  font-size:17px;
  letter-spacing:-.018em;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%;height:auto}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#c7c7cc;border:3px solid var(--bg);border-radius:10px}

/* Quiet background: premium pages should feel spacious, not decorated. */
.ambient,.grid-bg,.pinstripe{display:none!important}

/* Utility strip */
.ticker{
  position:fixed;
  top:0;left:0;right:0;
  z-index:200;
  height:28px;
  padding-top:var(--safe-top);
  background:rgba(255,255,255,.90);
  backdrop-filter:saturate(180%) blur(22px);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:1px solid rgba(0,0,0,.06);
  display:flex;
  align-items:center;
  overflow:hidden;
  font-family:var(--font-mono);
  font-size:9px;
  color:var(--text-3);
  letter-spacing:.015em;
}
.ticker::before,.ticker::after{
  content:"";
  position:absolute;top:0;bottom:0;width:54px;z-index:2;pointer-events:none;
}
.ticker::before{left:0;background:linear-gradient(90deg,#fff,transparent)}
.ticker::after{right:0;background:linear-gradient(270deg,#fff,transparent)}
.ticker-track{
  display:flex;
  gap:26px;
  animation:ticker-scroll 72s linear infinite;
  white-space:nowrap;
  flex-shrink:0;
}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes ticker-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick{display:inline-flex;align-items:center;gap:7px}
.tick .sym{color:#6e6e73;font-weight:700}
.tick .val{color:#1d1d1f;font-weight:500}
.tick .chg,.tick .chg.up,.tick .chg.down{font-weight:700;color:var(--blue)}
.tick .chg::before{display:none}
.tick .sep{color:#d2d2d7;margin-left:11px}

/* Navigation */
nav{
  position:fixed;
  top:calc(28px + var(--safe-top));
  left:0;right:0;
  z-index:100;
  height:64px;
  padding:0 max(var(--pad-x),24px);
  background:rgba(255,255,255,.82);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid rgba(0,0,0,.07);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
.nav-brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:32px;height:32px;
  border-radius:9px;
  background:#000;
  color:#fff;
  display:grid;place-items:center;
  font-weight:700;
  font-size:11px;
  letter-spacing:-.04em;
  flex-shrink:0;
}
.brand-text{display:flex;flex-direction:column;line-height:1.12;min-width:0}
.brand-text .name{
  font-size:14px;font-weight:600;color:#1d1d1f;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.brand-text .sub{
  font-size:8px;color:#86868b;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.nav-links{display:flex;align-items:center;gap:0}
.nav-links a{
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:500;
  color:#6e6e73;
  transition:.2s var(--ease);
  white-space:nowrap;
}
.nav-links a:hover{background:#f5f5f7;color:#1d1d1f}
.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.status-pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 11px;
  border-radius:999px;
  background:rgba(0,113,227,.07);
  border:1px solid rgba(0,113,227,.13);
  color:var(--blue);
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.status-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--blue);
  display:inline-block;
  box-shadow:0 0 0 3px var(--blue-soft);
}
.theme-btn,.menu-btn{
  width:36px;height:36px;
  border-radius:50%;
  display:grid;place-items:center;
  color:#6e6e73;
  border:1px solid rgba(0,0,0,.08);
  background:rgba(245,245,247,.75);
  transition:.2s;
}
.theme-btn:hover,.menu-btn:hover{background:#e8e8ed;border-color:rgba(0,0,0,.12);color:#1d1d1f}
.menu-btn{display:none}

/* Drawer */
.drawer{
  position:fixed;
  top:calc(28px + var(--safe-top) + 64px);
  right:max(var(--pad-x),16px);
  z-index:99;
  width:min(350px,calc(100vw - 32px));
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  border:1px solid rgba(0,0,0,.08);
  border-radius:22px;
  box-shadow:0 24px 70px rgba(0,0,0,.13);
  padding:7px;
  transform:translateY(-8px) scale(.98);
  opacity:0;
  pointer-events:none;
  transition:.25s var(--ease);
  max-height:calc(100dvh - 125px);
  overflow:auto;
}
.drawer.open{transform:none;opacity:1;pointer-events:auto}
.drawer a{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 15px;
  border-radius:15px;
  font-size:15px;
  color:#6e6e73;
}
.drawer a:hover,.drawer a:active{background:#f5f5f7;color:#1d1d1f}
.drawer .divider{height:1px;background:rgba(0,0,0,.07);margin:6px 10px}

/* Hero */
.hero{
  width:100%;
  max-width:1440px;
  margin:0 auto;
  min-height:100svh;
  display:grid;
  grid-template-columns:minmax(0,1.04fr) minmax(340px,.96fr);
  align-items:center;
  gap:clamp(36px,7vw,110px);
  padding:calc(150px + var(--safe-top)) max(var(--pad-x),28px) 90px;
}
.hero-content{position:relative;z-index:2;max-width:760px}
.terminal-line{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 10px;
  border-radius:999px;
  background:#f5f5f7;
  border:1px solid rgba(0,0,0,.07);
  font-family:var(--font-mono);
  font-size:9px;
  color:#86868b;
  margin-bottom:30px;
  letter-spacing:.02em;
}
.terminal-line .prompt{color:var(--blue);font-weight:800}
.terminal-line .path{color:#1d1d1f}
.terminal-line .caret{
  width:4px;height:11px;background:var(--blue);
  animation:blink 1.1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}
h1{
  font-size:clamp(58px,8.2vw,108px);
  line-height:.92;
  letter-spacing:-.075em;
  font-weight:700;
  max-width:760px;
  text-wrap:balance;
}
h1 .line{display:block;overflow:hidden}
h1 .word{display:inline-block;transform:translateY(110%);animation:riseUp .9s var(--ease) forwards}
h1 .line:nth-child(2) .word{animation-delay:.08s}
@keyframes riseUp{to{transform:translateY(0)}}
h1 .muted{color:var(--blue)}
h1 .muted::after{display:none}
.role{
  margin-top:28px;
  font-family:var(--font-mono);
  font-size:11px;
  color:#6e6e73;
  display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;
  animation:fadeUp .8s .3s var(--ease) both;
}
.role .label{color:#86868b;text-transform:uppercase;letter-spacing:.08em;font-size:9px}
.role .val{color:#1d1d1f;font-weight:600}
.role .sep{color:#b5b5ba}
.description{
  max-width:620px;
  margin-top:23px;
  color:#6e6e73;
  font-size:clamp(17px,1.55vw,20px);
  line-height:1.55;
  letter-spacing:-.015em;
  animation:fadeUp .8s .4s var(--ease) both;
}
.description strong{color:#1d1d1f}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.actions{
  display:flex;gap:12px;
  margin-top:34px;
  flex-wrap:wrap;
  animation:fadeUp .8s .55s var(--ease) both;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 21px;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  letter-spacing:-.01em;
  min-height:48px;
  white-space:nowrap;
  transition:.25s var(--ease);
  border:1px solid transparent;
}
.btn-primary{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
  box-shadow:0 7px 20px rgba(0,113,227,.16);
}
.btn-primary:hover{background:#0077ed;transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,113,227,.20)}
.btn-secondary{background:#fff;color:#1d1d1f;border-color:rgba(0,0,0,.14)}
.btn-secondary:hover{background:#f5f5f7;border-color:rgba(0,0,0,.18);transform:translateY(-1px)}
.btn svg{width:14px;height:14px;transition:.25s}
.btn:hover svg{transform:translateX(3px)}
.trust{
  margin-top:48px;
  padding-top:24px;
  border-top:1px solid rgba(0,0,0,.08);
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:0;
  max-width:680px;
}
.trust-item{
  padding:0 28px 0 0;
  margin-right:28px;
  border-left:0;
  border-right:1px solid rgba(0,0,0,.08);
}
.trust-item:last-child{border-right:0}
.trust-label{
  font-size:8px;color:#86868b;
  letter-spacing:.11em;text-transform:uppercase;
  font-weight:700;margin-bottom:5px;
  font-family:var(--font-mono);
}
.trust-value{font-size:13px;color:#1d1d1f;font-weight:600;line-height:1.3}

/* Hero visual */
.visual{
  position:relative;
  height:min(74vh,720px);
  min-height:460px;
  display:flex;align-items:center;justify-content:center;
  min-width:0;
  animation:fadeIn 1s .15s var(--ease) both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.photo-aura{
  position:absolute;
  width:82%;
  aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(circle,rgba(0,113,227,.08),transparent 68%);
  filter:blur(50px);
}
.photo{
  position:relative;
  width:min(500px,92%);
  height:100%;
  object-fit:cover;
  object-position:center;
  border-radius:36px;
  box-shadow:0 35px 90px rgba(0,0,0,.14),0 3px 14px rgba(0,0,0,.06);
  border:1px solid rgba(0,0,0,.07);
  z-index:2;
  transition:transform .35s var(--ease);
}
.visual::after{display:none}
.badge{
  position:absolute;
  padding:12px 15px;
  border-radius:16px;
  background:rgba(255,255,255,.90);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(0,0,0,.08);
  box-shadow:0 16px 40px rgba(0,0,0,.10);
  z-index:5;
  max-width:calc(100% - 24px);
  font-family:var(--font-sans);
  transition:.3s var(--ease);
}
.badge:hover{transform:translateY(-2px);border-color:var(--blue-line)}
.badge small{
  display:block;font-size:9px;color:#86868b;
  letter-spacing:.10em;text-transform:uppercase;
  font-weight:700;margin-bottom:4px;
}
.badge strong{
  font-size:12px;font-weight:700;color:#1d1d1f;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0;box-shadow:0 0 0 3px rgba(0,113,227,.10)}
.badge.founder{left:2%;bottom:8%;border-left:3px solid var(--blue)}
.badge.status{right:2%;top:9%;border-left:3px solid var(--blue)}
.badge.gold{right:4%;bottom:8%;border-left:3px solid #000}

/* Stats */
.stats{
  width:min(1240px,calc(100% - 2 * max(var(--pad-x),28px)));
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  border-top:1px solid rgba(0,0,0,.08);
  border-bottom:1px solid rgba(0,0,0,.08);
}
.stat-cell{
  min-height:150px;
  padding:28px 30px;
  border-right:1px solid rgba(0,0,0,.08);
  background:#fff;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.stat-cell:last-child{border-right:0}
.stat-num{
  font-size:clamp(34px,4vw,52px);
  font-weight:700;
  letter-spacing:-.06em;
  color:#1d1d1f;
  line-height:1;
  display:flex;align-items:baseline;
}
.stat-num em{font-style:normal;color:var(--blue);font-size:.68em}
.stat-label{
  margin-top:auto;
  color:#86868b;
  font-size:10px;
  letter-spacing:.03em;
  font-family:var(--font-mono);
  font-weight:700;
  text-transform:uppercase;
}

/* Sections */
.section{
  width:100%;
  max-width:1240px;
  margin:0 auto;
  padding:var(--section-y) max(var(--pad-x),28px);
  position:relative;
}
.section-tag{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--blue);
  font-size:10px;
  font-weight:600;
  letter-spacing:.02em;
  font-family:var(--font-sans);
  margin-bottom:18px;
}
.section-tag::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--blue);
}
.heading{
  max-width:900px;
  margin-top:16px;
  font-size:clamp(42px,6vw,72px);
  line-height:.98;
  letter-spacing:-.065em;
  font-weight:700;
}
.heading em{font-style:normal;color:var(--blue);font-weight:700}

/* About grid */
.about-grid{
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  gap:clamp(50px,9vw,130px);
  align-items:start;
  margin-top:54px;
}
.about-copy p{
  font-size:clamp(18px,2vw,23px);
  line-height:1.5;
  color:#6e6e73;
  letter-spacing:-.025em;
  margin-bottom:24px;
  max-width:65ch;
}
.about-copy p:last-child{margin-bottom:0}
.about-copy p strong{color:#1d1d1f}
.facts{
  display:flex;flex-direction:column;
  border-top:1px solid rgba(0,0,0,.08);
}
.fact{
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:17px 0;
  border-bottom:1px solid rgba(0,0,0,.08);
  transition:.2s;
}
.fact:last-child{border-bottom:0}
.fact:hover{background:transparent}
.fact-label{
  font-size:11px;color:#86868b;letter-spacing:.08em;
  font-weight:700;text-transform:uppercase;
}
.fact-value{
  font-size:13px;color:#1d1d1f;font-weight:600;text-align:right;
  word-break:break-word;
}

/* Cards */
.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:52px;
}
.card{
  background:#f5f5f7;
  border:1px solid rgba(0,0,0,.06);
  border-radius:24px;
  padding:30px;
  display:flex;flex-direction:column;
  min-height:300px;
  position:relative;
  overflow:hidden;
  transition:transform .35s var(--ease),background .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease);
}
.card:hover{
  background:#fff;
  border-color:rgba(0,0,0,.10);
  box-shadow:0 22px 55px rgba(0,0,0,.08);
  transform:translateY(-4px);
}
.card-icon{
  width:46px;height:46px;
  border-radius:14px;
  background:#fff;
  border:1px solid rgba(0,0,0,.07);
  display:grid;place-items:center;
  font-size:21px;
  margin-bottom:28px;
  transition:.2s;
}
.card:hover .card-icon{border-color:rgba(0,113,227,.16);color:var(--blue)}
.card h3{
  font-size:21px;line-height:1.15;
  letter-spacing:-.035em;font-weight:650;
  margin-bottom:10px;
}
.card p{
  margin-top:12px;
  color:#6e6e73;
  font-size:14px;
  line-height:1.65;
}
.card-tags{
  margin-top:auto;
  padding-top:24px;
  display:flex;flex-wrap:wrap;gap:6px;
}
.tag{
  font-size:8px;font-weight:700;
  padding:5px 9px;
  border-radius:999px;
  background:#fff;
  border:1px solid rgba(0,0,0,.08);
  color:#6e6e73;
  letter-spacing:.06em;
  text-transform:uppercase;
  font-family:var(--font-mono);
}

/* Tools */
.tools{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:1px;
  background:rgba(0,0,0,.07);
  border:1px solid rgba(0,0,0,.07);
  border-radius:24px;
  overflow:hidden;
  margin-top:52px;
}
.tool{
  background:#f5f5f7;
  padding:25px 12px;
  display:flex;flex-direction:column;align-items:center;gap:11px;
  text-align:center;
  transition:.3s var(--ease);
  min-height:130px;
}
.tool:hover{background:#fff}
.tool-icon{
  width:44px;height:44px;
  border-radius:13px;
  background:#fff;
  border:1px solid rgba(0,0,0,.07);
  display:grid;place-items:center;
  font-size:18px;
  transition:.2s;
}
.tool:hover .tool-icon{color:var(--blue);border-color:rgba(0,113,227,.16)}
.tool-name{
  font-size:9px;color:#6e6e73;
  font-weight:700;letter-spacing:.04em;
  font-family:var(--font-mono);
  text-transform:uppercase;
}

/* Timeline */
.timeline{
  margin-top:54px;
  position:relative;
  padding-left:42px;
}
.timeline::before{
  content:"";
  position:absolute;left:9px;top:12px;bottom:12px;
  width:1px;
  background:linear-gradient(180deg,var(--blue),rgba(0,113,227,.08));
}
.t-item{position:relative;padding-bottom:52px}
.t-item:last-child{padding-bottom:0}
.t-dot{
  position:absolute;left:-42px;top:4px;
  width:19px;height:19px;
  border-radius:50%;
  background:#fff;
  border:2px solid #d2d2d7;
  display:grid;place-items:center;
}
.t-dot::after{
  content:"";width:5px;height:5px;border-radius:50%;
  background:#d2d2d7;
}
.t-item:first-child .t-dot{
  border-color:var(--blue);
  background:#fff;
  box-shadow:0 0 0 6px rgba(0,113,227,.08);
}
.t-item:first-child .t-dot::after{background:var(--blue)}
.t-date{
  font-size:9px;color:var(--blue);
  letter-spacing:.09em;text-transform:uppercase;
  font-weight:800;margin-bottom:8px;
  font-family:var(--font-mono);
}
.t-title{
  font-size:22px;font-weight:650;
  letter-spacing:-.03em;margin-bottom:7px;
}
.t-desc{
  font-size:15px;color:#6e6e73;
  line-height:1.65;max-width:70ch;
}

/* Certifications */
.certs{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:52px;
}
.cert{
  background:#f5f5f7;
  border:1px solid rgba(0,0,0,.06);
  border-radius:24px;
  padding:28px;
  display:flex;flex-direction:column;gap:14px;
  transition:.25s var(--ease);
  min-height:210px;
}
.cert:hover{
  background:#fff;
  transform:translateY(-4px);
  border-color:rgba(0,0,0,.10);
  box-shadow:0 22px 55px rgba(0,0,0,.08);
}
.cert-badge{
  width:46px;height:46px;
  border-radius:14px;
  background:#fff;
  border:1px solid rgba(0,0,0,.07);
  display:grid;place-items:center;
  font-size:19px;
}
.cert:hover .cert-badge{color:var(--blue);border-color:rgba(0,113,227,.16)}
.cert-title{font-size:15px;font-weight:650}
.cert-sub{font-size:13px;color:#6e6e73;line-height:1.55}

/* CTA */
.cta{
  width:100%;
  max-width:1240px;
  margin:0 auto;
  padding:clamp(120px,14vw,190px) max(var(--pad-x),28px);
  text-align:center;
  position:relative;
  border-top:1px solid rgba(0,0,0,.08);
}
.cta-glow{
  position:absolute;
  width:700px;max-width:110vw;
  aspect-ratio:1;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(0,113,227,.07),transparent 64%);
  filter:blur(60px);
  pointer-events:none;
  z-index:-1;
}
.cta-title{
  font-size:clamp(48px,7vw,88px);
  line-height:.98;
  letter-spacing:-.07em;
  font-weight:700;
  max-width:14ch;
  margin:18px auto 0;
}
.cta-title em{font-style:normal;color:var(--blue)}
.cta-sub{
  margin:22px auto 0;
  max-width:600px;
  color:#6e6e73;
  font-size:17px;
  line-height:1.6;
}
.cta-actions{
  margin-top:34px;
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
}

/* Footer */
.footer{
  width:100%;
  max-width:1240px;
  margin:0 auto;
  padding:70px max(var(--pad-x),28px) 32px;
  border-top:1px solid rgba(0,0,0,.08);
  display:grid;
  grid-template-columns:minmax(0,2.2fr) repeat(2,minmax(0,1fr));
  gap:clamp(30px,6vw,80px);
}
.f-brand .brand-mark{margin-bottom:18px}
.f-brand .f-name{font-size:17px;font-weight:600;margin-bottom:5px}
.f-brand .f-sub{
  font-size:9px;color:#86868b;
  font-family:var(--font-mono);
  letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:16px;
}
.f-brand p{color:#6e6e73;font-size:13px;line-height:1.65;max-width:42ch}
.f-col h4{
  font-family:var(--font-sans);
  font-size:10px;color:#86868b;
  letter-spacing:.04em;text-transform:none;
  font-weight:800;margin-bottom:13px;
}
.f-col a{
  display:block;padding:6px 0;
  color:#6e6e73;font-size:13px;
  transition:.2s;min-height:30px;
}
.f-col a:hover{color:var(--blue);padding-left:0}
.f-bottom{
  width:100%;
  max-width:1240px;
  margin:0 auto;
  padding:20px max(var(--pad-x),28px) calc(28px + var(--safe-bottom));
  display:flex;justify-content:space-between;align-items:center;
  gap:14px;flex-wrap:wrap;
  font-size:10px;color:#86868b;
  border-top:1px solid rgba(0,0,0,.08);
  font-family:var(--font-mono);
}
.f-status{display:inline-flex;align-items:center;gap:8px}
.f-status-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--blue)!important;
  display:inline-block;
  box-shadow:none;
}

/* Reveal */
.reveal{
  opacity:0;
  transform:translateY(22px);
  transition:opacity .8s var(--ease),transform .8s var(--ease);
}
.reveal.visible{opacity:1;transform:none}

/* Boot loader */
.boot-state{
  position:fixed;inset:0;
  display:grid;place-items:center;
  background:#fff;
  z-index:1000;
  transition:opacity .4s;
}
.boot-state.hide{opacity:0;pointer-events:none}
.boot-inner{
  display:flex;flex-direction:column;align-items:center;
  gap:18px;text-align:center;padding:24px;
}
.boot-mark{
  width:54px;height:54px;
  border-radius:17px;
  background:#000;color:#fff;
  display:grid;place-items:center;
  font-weight:800;font-size:18px;
  animation:bootPulse 1.6s ease-in-out infinite;
}
.boot-text{
  font-family:var(--font-mono);
  font-size:10px;color:#86868b;
  letter-spacing:.1em;text-transform:uppercase;
}
.boot-dots span{
  display:inline-block;width:5px;height:5px;
  border-radius:50%;background:var(--blue);
  margin:0 3px;
  animation:dotJump 1.2s ease-in-out infinite;
}
.boot-dots span:nth-child(2){animation-delay:.15s}
.boot-dots span:nth-child(3){animation-delay:.3s}
@keyframes bootPulse{0%,100%{transform:scale(1)}50%{transform:scale(.95);opacity:.72}}
@keyframes dotJump{0%,80%,100%{transform:translateY(0);opacity:.25}40%{transform:translateY(-5px);opacity:1}}

/* Empty state */
.empty-state{max-width:520px;text-align:center;padding:32px}
.empty-state h2{font-size:30px;font-weight:650;letter-spacing:-.04em;margin-bottom:10px}
.empty-state p{font-size:14px;color:#6e6e73;line-height:1.65;margin-bottom:8px}
.empty-state code{
  font-family:var(--font-mono);font-size:12px;
  background:#f5f5f7;padding:3px 7px;
  border-radius:6px;color:var(--blue);
}

/* Responsive */
@media(max-width:1100px){
  .hero{grid-template-columns:minmax(0,1fr) minmax(300px,.8fr);gap:50px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .certs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  nav{height:60px}
  .nav-links{display:none}
  .menu-btn{display:grid}
  .status-pill{display:none}
  .hero{
    grid-template-columns:1fr;
    gap:20px;
    padding-top:calc(125px + var(--safe-top));
    text-align:center;
  }
  .hero-content{max-width:760px;margin:0 auto}
  .visual{order:-1;height:min(58vh,500px);min-height:360px}
  .photo{width:min(390px,82%);border-radius:30px}
  .terminal-line,.role,.actions,.trust{margin-left:auto;margin-right:auto}
  .description{margin-left:auto;margin-right:auto}
  .trust{text-align:left}
  .about-grid{grid-template-columns:1fr;gap:38px}
  .tools{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:720px){
  :root{--pad-x:18px;--section-y:78px}
  body{font-size:16px}
  .ticker{height:25px;font-size:8px}
  .ticker-track{gap:22px;animation-duration:48s}
  nav{top:calc(25px + var(--safe-top));height:56px;padding:0 16px}
  .drawer{top:calc(25px + var(--safe-top) + 56px)}
  .hero{padding:calc(108px + var(--safe-top)) var(--pad-x) 58px;min-height:auto}
  .visual{height:360px;min-height:0}
  .photo{width:min(305px,82%);border-radius:27px}
  .badge.founder{left:0;bottom:4%}
  .badge.status{right:0;top:5%}
  .badge.gold{right:0;bottom:4%}
  h1{font-size:clamp(46px,14vw,72px);line-height:.94}
  .description{font-size:17px;line-height:1.55}
  .actions{margin-top:28px}
  .actions .btn{flex:1 1 150px}
  .trust{grid-template-columns:1fr;gap:0;margin-top:34px;padding-top:18px}
  .trust-item{padding:13px 0;border-right:0;border-bottom:1px solid rgba(0,0,0,.08);margin:0}
  .trust-item:last-child{border-bottom:0}
  .stats{width:calc(100% - 36px);grid-template-columns:repeat(2,minmax(0,1fr));padding:0}
  .stat-cell{min-height:125px;padding:22px 18px}
  .stat-cell:nth-child(2){border-right:0}
  .stat-cell:nth-child(-n+2){border-bottom:1px solid rgba(0,0,0,.08)}
  .stat-num{font-size:31px}
  .section{padding-left:var(--pad-x);padding-right:var(--pad-x)}
  .heading{font-size:clamp(36px,10vw,52px)}
  .cards{grid-template-columns:1fr;gap:12px;margin-top:38px}
  .card{min-height:auto;padding:25px;border-radius:22px}
  .tools{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:38px;border-radius:20px}
  .tool{min-height:112px;padding:20px 7px}
  .tool-icon{width:38px;height:38px;border-radius:12px}
  .tool-name{font-size:8px}
  .timeline{margin-top:40px;padding-left:30px}
  .t-dot{left:-30px}
  .t-title{font-size:19px}
  .t-desc{font-size:14px}
  .certs{grid-template-columns:1fr;gap:12px;margin-top:38px}
  .cert{min-height:auto;padding:24px;border-radius:22px}
  .cta{padding-top:100px;padding-bottom:100px}
  .cta-title{font-size:clamp(44px,12vw,62px)}
  .cta-sub{font-size:16px}
  .cta-actions{flex-direction:column;align-items:stretch}
  .cta-actions .btn{width:100%}
  .footer{grid-template-columns:1fr;gap:34px;padding:50px var(--pad-x) 28px}
  .f-brand p{max-width:none}
  .f-bottom{flex-direction:column;align-items:flex-start;gap:8px;padding-left:var(--pad-x);padding-right:var(--pad-x)}
}
@media(max-width:390px){
  .visual{height:320px}
  .photo{width:min(270px,84%)}
  h1{font-size:clamp(41px,13.5vw,54px)}
  .tools{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{width:calc(100% - 36px)}
}
@media(max-height:520px) and (orientation:landscape){
  .hero{min-height:auto;padding-top:calc(96px + var(--safe-top));padding-bottom:40px}
  .visual{height:280px}
  .photo{width:min(220px,58%)}
}
@media(hover:none){
  .card:hover,.cert:hover,.btn:hover{transform:none}
  .card:hover{background:#f5f5f7}
  .cert:hover{background:#f5f5f7}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  h1 .word{transform:none!important}
  .ticker-track{animation:none;padding-left:16px}
  .terminal-line .caret{animation:none}
  .reveal{opacity:1!important;transform:none!important}
}
@supports(-webkit-touch-callout:none){
  input,textarea,select{font-size:16px}
}

<body>

<!-- BOOT LOADER (shown until data arrives) -->
<div class="boot-state" id="bootState">
  <div class="boot-inner">
    <div class="boot-mark" id="bootMark">··</div>
    <div class="boot-text" id="bootText">Loading portfolio</div>
    <div class="boot-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- SITE (hidden until data arrives) -->
<div id="siteRoot" style="display:none">
  <div class="ticker" id="ticker" aria-hidden="true"><div class="ticker-track" id="tickerTrack"></div></div>

  <nav>
    <div class="nav-brand">
      <div class="brand-mark" id="brandMark">··</div>
      <div class="brand-text">
        <span class="name" id="brandName"></span>
        <span class="sub" id="brandSub"></span>
      </div>
    </div>
    <div class="nav-links" id="navLinks"></div>
    <div class="nav-actions">
      <a href="#" class="status-pill" id="navStatusLink"><span class="status-dot"></span><span id="navStatusText"></span></a>
      <button class="theme-btn" id="theme" aria-label="Toggle theme">◐</button>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
    </div>
  </nav>

  <div class="drawer" id="drawer">
    <div id="drawerLinks"></div>
    <div class="divider"></div>
    <a href="#" id="drawerStatusLink"><span id="drawerStatusText" style="color:var(--blue);font-family:var(--font-mono);font-size:12px">●</span><span class="arrow">→</span></a>
  </div>

  <section class="hero">
    <div class="hero-content" id="heroContent"></div>
    <div class="visual" id="heroVisual"></div>
  </section>

  <div class="stats reveal" id="statsStrip"></div>
  <section class="section reveal" id="aboutSection"></section>
  <section class="section reveal" id="servicesSection"></section>
  <section class="section reveal" id="toolsSection"></section>
  <section class="section reveal" id="experienceSection"></section>
  <section class="section reveal" id="certificationsSection"></section>
  <div id="customSections"></div>
  <section class="cta reveal" id="ctaSection"></section>
  <footer class="footer" id="footerSection"></footer>
  <div class="f-bottom" id="footerBottom"></div>
</div>

<script>
/* =========================================================
   NO DEFAULT DATA — site is 100% driven by /api/data or admin
   ========================================================= */

const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function merge(def, src){
  if(Array.isArray(def)) return Array.isArray(src) ? src : def;
  if(def && typeof def === 'object'){
    const out = {...def};
    if(src && typeof src === 'object'){
      for(const k in def){ if(k in src) out[k] = merge(def[k], src[k]); }
      for(const k in src){ if(!(k in def)) out[k] = src[k]; }
    }
    return out;
  }
  return (src === undefined || src === null || src === '') ? def : src;
}

/* Minimal safe getter — never crashes if a field is missing */
function pick(obj, path, fallback=''){
  const parts = path.split('.');
  let cur = obj;
  for(const p of parts){
    if(cur == null) return fallback;
    cur = cur[p];
  }
  return cur ?? fallback;
}
function arr(v){ return Array.isArray(v) ? v : []; }

function initials(name){
  return String(name||'CA').split(/\s+/).filter(Boolean).slice(0,2)
    .map(w=>w[0]).join('').toUpperCase().slice(0,2) || 'CA';
}

/* =========================================================
   BOOT STATE
   ========================================================= */
const bootState = document.getElementById('bootState');
const bootMark = document.getElementById('bootMark');
const bootText = document.getElementById('bootText');
const siteRoot = document.getElementById('siteRoot');

function showEmpty(message){
  bootMark.textContent = '!!';
  bootMark.style.background = '#ff3b30';
  bootMark.style.boxShadow = '0 0 40px rgba(255,59,48,.2)';
  bootText.textContent = 'No content';
  const inner = bootState.querySelector('.boot-inner');
  inner.insertAdjacentHTML('beforeend', `
    <div class="empty-state">
      <h2>No content yet</h2>
      <p>${message}</p>
      <p>Open <code>/admin.html</code>, log in, edit, then click <strong>Save changes</strong>.</p>
    </div>
  `);
  const dots = bootState.querySelector('.boot-dots');
  if(dots) dots.remove();
}

function showSite(){
  bootState.classList.add('hide');
  setTimeout(()=>{ bootState.style.display='none'; }, 400);
  siteRoot.style.display = '';
}

/* =========================================================
   RENDER
   ========================================================= */
function renderAll(d){
  if(!d || typeof d !== 'object'){ showEmpty('Data was empty or invalid.'); return; }

  // Meta
  if(d.meta?.title) document.getElementById('pageTitle').textContent = d.meta.title;
  if(d.meta?.description) document.getElementById('pageDesc').setAttribute('content', d.meta.description);

  // Nav
  const brandName = pick(d, 'nav.brandName', '—');
  const brandSub = pick(d, 'nav.brandSub', '');
  document.getElementById('brandName').textContent = brandName;
  document.getElementById('brandSub').textContent = brandSub;
  document.getElementById('brandMark').textContent = initials(brandName);
  const statusText = pick(d, 'nav.statusText', '');
  const statusLink = pick(d, 'nav.statusLink', '#');
  document.getElementById('navStatusText').textContent = statusText;
  document.getElementById('navStatusLink').setAttribute('href', statusLink || '#');
  const drawerStatusText = document.getElementById('drawerStatusText');
  const drawerStatusLink = document.getElementById('drawerStatusLink');
  if(drawerStatusText) drawerStatusText.textContent = '● ' + statusText;
  if(drawerStatusLink) drawerStatusLink.setAttribute('href', statusLink || '#');

  // Nav links (fully editable from admin)
  const navItems = arr(pick(d, 'nav.links', []));
  document.getElementById('navLinks').innerHTML = navItems.map(l=>`
    <a href="${esc(l.href||'#')}" data-scroll>${esc(l.label||'')}</a>`).join('');
  document.getElementById('drawerLinks').innerHTML = navItems.map(l=>`
    <a href="${esc(l.href||'#')}" data-scroll>${esc(l.label||'')} <span class="arrow">→</span></a>`).join('');

  // Ticker
  renderTicker(d);

  // Hero
  const hero = d.hero || {};
  document.getElementById('heroContent').innerHTML = `
    <div class="terminal-line">
      <span class="prompt">›</span>
      <span class="path">${esc(hero.terminalPath || '~/portfolio')}</span>
      <span style="color:var(--text-3)">${esc(hero.eyebrow || '')}</span>
      <span class="caret"></span>
    </div>
    <h1>
      <span class="line"><span class="word">${esc(hero.firstName || '')}</span></span>
      <span class="line"><span class="word muted">${esc(hero.lastName || '')}</span></span>
    </h1>
    <div class="role">
      <span><span class="label">role</span> <span class="val">${esc(hero.role || '')}</span></span>
      <span class="sep">/</span>
      <span><span class="label">focus</span> <span class="val">${esc(hero.roleCompany || '')}</span></span>
    </div>
    <p class="description">${hero.description || ''}</p>
    <div class="actions">
      <a href="${esc(hero.primaryBtnLink || '#')}" class="btn btn-primary">
        <span>${esc(hero.primaryBtnText || 'Contact')}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      ${hero.secondaryBtnText ? `
      <a href="${esc(hero.secondaryBtnLink || '#')}" class="btn btn-secondary">
        <span>${esc(hero.secondaryBtnText)}</span>
      </a>` : ''}
    </div>
    <div class="trust">
      ${arr(hero.trust).map(t=>`
        <div class="trust-item">
          <div class="trust-label">${esc(t.label||'')}</div>
          <div class="trust-value">${esc(t.value||'')}</div>
        </div>`).join('')}
    </div>`;

  // Hero visual
  const photo = d.photo || {};
  const goldBadge = photo.badgeGoldLabel
    ? `<div class="badge gold"><small>${esc(photo.badgeGoldLabel)}</small><strong>${esc(photo.badgeGoldText||'')}</strong></div>`
    : '';
  document.getElementById('heroVisual').innerHTML = `
    <div class="photo-aura"></div>
    ${photo.url ? `<img src="${esc(photo.url)}" alt="${esc((hero.firstName||'')+' '+(hero.lastName||''))}" class="photo" loading="eager">` : ''}
    ${photo.badgeFounderText ? `<div class="badge founder"><small>${esc(photo.badgeFounderLabel||'')}</small><strong>${esc(photo.badgeFounderText)}</strong></div>` : ''}
    ${photo.badgeStatusText ? `<div class="badge status"><small>${esc(photo.badgeStatusLabel||'')}</small><strong><span class="badge-dot"></span>${esc(photo.badgeStatusText)}</strong></div>` : ''}
    ${goldBadge}`;

  // Stats
  const statsArr = Array.isArray(d.stats) ? d.stats : (d.stats?.items || []);
  document.getElementById('statsStrip').innerHTML = statsArr.map(s=>`
    <div class="stat-cell">
      <div class="stat-num">${esc(s.num||'')}<em>${esc(s.suffix||'')}</em></div>
      <div class="stat-label">${esc(s.label||'')}</div>
    </div>`).join('');

  // About
  const about = d.about || {};
  document.getElementById('aboutSection').innerHTML = `
    <div class="section-tag">${esc(about.tag||'About')}</div>
    <h2 class="heading">${esc(about.heading||'')} <em>${esc(about.headingEm||'')}</em></h2>
    <div class="about-grid">
      <div class="about-copy">${arr(about.paragraphs).map(p=>`<p>${typeof p==='string'?p:(p.value||'')}</p>`).join('')}</div>
      <div class="facts">
        ${arr(about.facts).map(f=>`
          <div class="fact">
            <span class="fact-label">${esc(f.label||'')}</span>
            <span class="fact-value">${esc(f.value||'')}</span>
          </div>`).join('')}
      </div>
    </div>`;

  // Services
  const services = d.services || {};
  document.getElementById('servicesSection').innerHTML = `
    <div class="section-tag">${esc(services.tag||'Services')}</div>
    <h2 class="heading">${esc(services.heading||'')} <em>${esc(services.headingEm||'')}</em></h2>
    <div class="cards">
      ${arr(services.items).map(s=>`
        <article class="card">
          ${s.icon ? `<div class="card-icon">${esc(s.icon)}</div>` : ''}
          ${s.title ? `<h3>${esc(s.title)}</h3>` : ''}
          ${s.desc ? `<p>${esc(s.desc)}</p>` : ''}
          ${arr(s.tags).length ? `<div class="card-tags">${arr(s.tags).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        </article>`).join('')}
    </div>`;

  // Tools
  const tools = d.tools || {};
  document.getElementById('toolsSection').innerHTML = `
    <div class="section-tag">${esc(tools.tag||'Tools')}</div>
    <h2 class="heading">${esc(tools.heading||'')} <em>${esc(tools.headingEm||'')}</em></h2>
    <div class="tools">
      ${arr(tools.items).map(t=>`
        <div class="tool">
          <div class="tool-icon">${esc(t.icon||'')}</div>
          <div class="tool-name">${esc(t.name||'')}</div>
        </div>`).join('')}
    </div>`;

  // Experience
  const exp = d.experience || {};
  document.getElementById('experienceSection').innerHTML = `
    <div class="section-tag">${esc(exp.tag||'Experience')}</div>
    <h2 class="heading">${esc(exp.heading||'')} <em>${esc(exp.headingEm||'')}</em></h2>
    <div class="timeline">
      ${arr(exp.items).map(e=>`
        <div class="t-item">
          <div class="t-dot"></div>
          <div class="t-date">${esc(e.date||'')}</div>
          <div class="t-title">${esc(e.title||'')}</div>
          <div class="t-desc">${esc(e.desc||'')}</div>
        </div>`).join('')}
    </div>`;

  // Certifications
  const certs = d.certifications || {};
  document.getElementById('certificationsSection').innerHTML = `
    <div class="section-tag">${esc(certs.tag||'Certifications')}</div>
    <h2 class="heading">${esc(certs.heading||'')} <em>${esc(certs.headingEm||'')}</em></h2>
    <div class="certs">
      ${arr(certs.items).map(c=>`
        <div class="cert">
          <div class="cert-badge">${esc(c.badge||'')}</div>
          <div class="cert-title">${esc(c.title||'')}</div>
          <div class="cert-sub">${esc(c.sub||'')}</div>
        </div>`).join('')}
    </div>`;

  // Custom sections
  renderCustomSections(d);

  // CTA
  const cta = d.cta || {};
  document.getElementById('ctaSection').innerHTML = `
    <div class="cta-glow"></div>
    <div class="section-tag" style="justify-content:center;margin:0 auto 20px;display:inline-flex;">${esc(cta.tag||'')}</div>
    <h2 class="cta-title">${esc(cta.title||'')}<br><em>${esc(cta.titleEm||'')}</em></h2>
    <p class="cta-sub">${esc(cta.sub||'')}</p>
    <div class="cta-actions">
      <a href="${esc(cta.primaryBtnLink||'#')}" class="btn btn-primary">
        <span>${esc(cta.primaryBtnText||'Contact')}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      ${cta.secondaryBtnText ? `
      <a href="${esc(cta.secondaryBtnLink||'#')}" class="btn btn-secondary">
        <span>${esc(cta.secondaryBtnText)}</span>
      </a>` : ''}
    </div>`;

  // Footer
  const footer = d.footer || {};
  document.getElementById('footerSection').innerHTML = `
    <div class="f-brand">
      <div class="brand-mark">${esc(initials(brandName))}</div>
      <div class="f-name">${esc(brandName)}</div>
      <div class="f-sub">${esc(brandSub)}</div>
      <p>${esc(footer.brandText||'')}</p>
    </div>
    ${arr(footer.columns).map(col=>`
      <div class="f-col">
        <h4>${esc(col.title||'')}</h4>
        ${arr(col.links).map(l=>`<a href="${esc(l.href||'#')}">${esc(l.label||'')}</a>`).join('')}
      </div>`).join('')}`;

  document.getElementById('footerBottom').innerHTML = `
    <span>${esc(footer.copyright||'')}</span>
    <span class="f-status"><span class="f-status-dot"></span>${esc(footer.statusText||'')}</span>`;

  attachInteractions();
  showSite();
}

/* =========================================================
   TICKER
   ========================================================= */
function renderTicker(d){
  const items = Array.isArray(d.ticker?.items)
    ? d.ticker.items
    : (Array.isArray(d.ticker) ? d.ticker : []);

  if(!items.length){
    document.getElementById('tickerTrack').innerHTML = '';
    return;
  }

  const html = items.map(c=>{
    const dir = (c.chg === 'down') ? 'down' : 'up';
    return `
      <span class="tick">
        <span class="sym">${esc(c.sym || '')}</span>
        <span class="val">${esc(c.val || '')}</span>
        <span class="chg ${dir}">${esc(c.chgText || '')}</span>
      </span>
      <span class="sep">·</span>
    `;
  }).join('');
  document.getElementById('tickerTrack').innerHTML = html + html;
}

/* =========================================================
   CUSTOM SECTIONS
   ========================================================= */
function renderCustomSections(d){
  const CORE = new Set(['meta','nav','hero','photo','stats','about','services','tools','experience','certifications','cta','footer','ticker']);
  const host = document.getElementById('customSections');
  host.innerHTML = '';
  for(const key of Object.keys(d)){
    if(CORE.has(key)) continue;
    const s = d[key];
    if(!s || typeof s !== 'object' || !Array.isArray(s.items)) continue;

    const section = document.createElement('section');
    section.className = 'section reveal';
    section.id = `custom-${key}`;
    section.innerHTML = `
      <div class="section-tag">${esc(s.tag || key)}</div>
      <h2 class="heading">${esc(s.heading || '')} <em>${esc(s.headingEm || '')}</em></h2>
      <div class="cards">
        ${s.items.map(it=>`
          <article class="card">
            ${it.icon ? `<div class="card-icon">${esc(it.icon)}</div>` : ''}
            ${it.title ? `<h3>${esc(it.title)}</h3>` : ''}
            ${it.desc ? `<p>${esc(it.desc)}</p>` : ''}
            ${Array.isArray(it.tags) && it.tags.length ? `<div class="card-tags">${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
          </article>`).join('')}
      </div>`;
    host.appendChild(section);
  }
}

/* =========================================================
   INTERACTIONS
   ========================================================= */
function attachInteractions(){
  const io = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); }
  }),{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>{
    el.classList.remove('visible');
    io.observe(el);
  });

  const visual = document.querySelector('.visual');
  const photoEl = document.querySelector('.photo');
  if(visual && photoEl && window.matchMedia('(hover:hover)').matches){
    visual.onpointermove = e=>{
      const r = visual.getBoundingClientRect();
      const px = (e.clientX - r.left)/r.width - .5;
      const py = (e.clientY - r.top)/r.height - .5;
      photoEl.style.transform = `translate(${px*-8}px,${py*-8}px) scale(1.01)`;
    };
    visual.onpointerleave = ()=>{ photoEl.style.transform='translate(0,0) scale(1)'; };
  }

  // Nav links need fresh listeners since they are re-rendered
  document.querySelectorAll('a[href^="#"]').forEach(a=>{
    a.addEventListener('click', e=>{
      const id = a.getAttribute('href');
      if(id === '#' || id.length < 2) return;
      const target = document.querySelector(id);
      if(!target) return;
      e.preventDefault();
      const top = target.getBoundingClientRect().top + window.pageYOffset - 96;
      window.scrollTo({ top, behavior: 'smooth' });
      toggleDrawer(false);
    });
  });
}

/* =========================================================
   THEME
   ========================================================= */
const themeBtn = document.getElementById('theme');
if(localStorage.getItem('theme')==='light') document.body.classList.add('light');
themeBtn.addEventListener('click',()=>{
  document.body.classList.toggle('light');
  localStorage.setItem('theme', document.body.classList.contains('light')?'light':'dark');
});

/* =========================================================
   MOBILE DRAWER
   ========================================================= */
const drawer = document.getElementById('drawer');
const menuBtn = document.getElementById('menuBtn');

function toggleDrawer(force){
  if(!drawer || !menuBtn) return;
  const open = force !== undefined ? force : !drawer.classList.contains('open');
  drawer.classList.toggle('open', open);
  menuBtn.textContent = open ? '✕' : '☰';
  menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
}
menuBtn.addEventListener('click', ()=>toggleDrawer());
document.addEventListener('click', e=>{
  if(!drawer.classList.contains('open')) return;
  if(drawer.contains(e.target) || menuBtn.contains(e.target)) return;
  toggleDrawer(false);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') toggleDrawer(false); });
window.addEventListener('resize', ()=>{ if(window.innerWidth > 900) toggleDrawer(false); });

/* =========================================================
   ADMIN PREVIEW BRIDGE
   Receives {type:'PORTFOLIO_UPDATE', data} and renders it directly.
   Falls back to /api/data on boot.
   ========================================================= */
let receivedFromAdmin = false;

window.addEventListener('message', (e)=>{
  if(e.data && e.data.type === 'PORTFOLIO_UPDATE' && e.data.data){
    receivedFromAdmin = true;
    try{
      renderAll(e.data.data);
    }catch(err){
      console.warn('[preview] render failed', err);
    }
  }
});

/* Tell parent we're ready for state */
try{
  if(window.parent !== window){
    window.parent.postMessage({type:'PORTFOLIO_READY'}, '*');
  }
}catch(e){}

/* =========================================================
   BOOT — fetch /api/data (always the database; never local defaults)
   ========================================================= */
(async function boot(){
  const waitForAdmin = window.parent !== window;

  let remote = null;
  try{
    const r = await fetch('/api/data',{cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(j && typeof j === 'object' && Object.keys(j).length > 0){
        remote = j;
      }
    }
  }catch(e){}

  if(remote){
    renderAll(remote);
    return;
  }

  if(waitForAdmin){
    setTimeout(()=>{
      if(!receivedFromAdmin) showEmpty('The site has no saved content yet.');
    }, 1200);
  } else {
    showEmpty('The site has no saved content yet.');
  }
})();
</script>
