<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title id="pageTitle">Eshwar Goud — Chartered Accountant (Intern)</title>
<meta name="description" id="pageDesc" content="Eshwar Goud — CA intern specialising in audit, taxation, and forensic accounting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* =========================================================
   APPLE DESIGN SYSTEM
   - Neutral palette (white / black / space grey)
   - Liquid Glass surfaces (iOS 26 / macOS Tahoe)
   - Generous negative space
   - SF Pro-metric Inter fallback
   ========================================================= */
:root{
  /* Neutral surfaces */
  --bg: #ffffff;
  --bg-secondary: #fbfbfd;
  --bg-elev: #f5f5f7;
  --text: #1d1d1f;
  --text-secondary: #424245;
  --text-tertiary: #86868b;
  --text-quaternary: #d2d2d7;
  --line: rgba(0,0,0,.08);
  --line-strong: rgba(0,0,0,.16);

  /* Accent (Apple system blue) — used sparingly */
  --accent: #0071e3;
  --accent-hover: #0077ed;

  /* Liquid Glass — layered translucency + edge lighting */
  --glass-bg: rgba(255,255,255,.72);
  --glass-bg-strong: rgba(255,255,255,.86);
  --glass-border-top: rgba(255,255,255,.9);
  --glass-border-bottom: rgba(0,0,0,.06);
  --glass-specular: rgba(255,255,255,.85);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
  --glass-inner: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.04);

  /* Spacing scale */
  --pad-x: clamp(20px, 5vw, 40px);
  --section-y: clamp(80px, 12vw, 180px);
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);

  /* Type */
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-serif: "Instrument Serif", "New York", Georgia, serif;

  /* Motion */
  --ease-out: cubic-bezier(.22,1,.36,1);
  --ease-ios: cubic-bezier(.32,.72,0,1);
}

body.dark{
  --bg: #000000;
  --bg-secondary: #0a0a0c;
  --bg-elev: #1c1c1e;
  --text: #f5f5f7;
  --text-secondary: #a1a1a6;
  --text-tertiary: #86868b;
  --text-quaternary: #3a3a3c;
  --line: rgba(255,255,255,.10);
  --line-strong: rgba(255,255,255,.18);

  --accent: #0a84ff;
  --accent-hover: #409cff;

  --glass-bg: rgba(28,28,30,.68);
  --glass-bg-strong: rgba(28,28,30,.84);
  --glass-border-top: rgba(255,255,255,.14);
  --glass-border-bottom: rgba(0,0,0,.4);
  --glass-specular: rgba(255,255,255,.18);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
  --glass-inner: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(0,0,0,.3);
}

*{margin:0;padding:0;box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  overflow-x:clip;
  line-height:1.47059;
  letter-spacing:-.022em;
  font-size:17px;
  font-weight:400;
  transition:background .5s ease,color .5s ease;
  text-rendering:optimizeLegibility;
  font-feature-settings:"kern" 1,"liga" 1,"calt" 1;
}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%;height:auto}
::selection{background:var(--accent);color:#fff}

/* =========================================================
   LIQUID GLASS PRIMITIVE
   Layered: base blur + specular top edge + inset highlights
   ========================================================= */
.glass{
  position:relative;
  background:var(--glass-bg);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--line);
  box-shadow:var(--glass-shadow), var(--glass-inner);
  isolation:isolate;
  overflow:hidden;
}
.glass::before{
  /* Specular highlight along the top edge — key to liquid glass */
  content:"";
  position:absolute;inset:0;pointer-events:none;z-index:1;
  border-radius:inherit;
  background:linear-gradient(180deg,
    var(--glass-specular) 0%,
    transparent 42%);
  opacity:.55;
  mix-blend-mode:screen;
}
body.dark .glass::before{opacity:.35}
.glass::after{
  /* Refraction edge glow */
  content:"";
  position:absolute;inset:-1px;pointer-events:none;z-index:-1;
  border-radius:inherit;
  background:radial-gradient(120% 100% at 50% 0%, var(--glass-specular) 0%, transparent 55%);
  opacity:.35;
}
body.dark .glass::after{opacity:.18}

/* =========================================================
   AMBIENT BACKGROUND — soft neutral, no colour
   ========================================================= */
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-2;background:var(--bg)}
.ambient-orb{
  position:absolute;border-radius:50%;filter:blur(120px);opacity:.5;
  will-change:transform;
}
.ambient-orb.a{width:min(720px,110vw);height:min(720px,110vw);top:-25vh;left:-15vw;
  background:radial-gradient(circle, rgba(0,113,227,.10), transparent 70%)}
.ambient-orb.b{width:min(620px,90vw);height:min(620px,90vw);bottom:-20vh;right:-15vw;
  background:radial-gradient(circle, rgba(120,120,140,.14), transparent 70%)}
body.dark .ambient-orb{opacity:.35}
body.dark .ambient-orb.a{background:radial-gradient(circle, rgba(10,132,255,.14), transparent 70%)}
body.dark .ambient-orb.b{background:radial-gradient(circle, rgba(120,120,140,.10), transparent 70%)}

/* =========================================================
   NAV — Liquid Glass pill (iOS style)
   ========================================================= */
nav{position:fixed;top:calc(14px + var(--safe-top));left:50%;transform:translateX(-50%);
  width:min(920px,calc(100% - 24px));z-index:100}
.nav-pill{
  display:flex;align-items:center;justify-content:space-between;
  height:52px;padding:0 6px 0 18px;
  border-radius:26px;
  background:var(--glass-bg-strong);
  backdrop-filter:blur(40px) saturate(200%);
  -webkit-backdrop-filter:blur(40px) saturate(200%);
  border:1px solid var(--line);
  box-shadow:0 4px 24px rgba(0,0,0,.06), inset 0 1px 0 var(--glass-specular), inset 0 -1px 0 var(--glass-border-bottom);
  position:relative;overflow:hidden;
}
.nav-pill::before{
  content:"";position:absolute;left:8%;right:8%;top:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--glass-specular),transparent);
  opacity:.9;pointer-events:none;
}
.brand{font-size:13px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.brand-glyph{width:16px;height:16px;border-radius:50%;background:var(--text);position:relative;flex-shrink:0}
.brand-glyph::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg)}
.brand span{color:var(--text-tertiary);font-weight:400}
.nav-right{display:flex;align-items:center;gap:2px;flex-shrink:0}
.nav-link{color:var(--text-secondary);font-size:12px;padding:8px 12px;border-radius:999px;
  transition:background .2s ease,color .2s ease;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nav-link:hover{color:var(--text);background:rgba(120,120,128,.12)}
.nav-dot{width:6px;height:6px;border-radius:50%;background:#34c759;flex-shrink:0;
  box-shadow:0 0 0 2px rgba(52,199,89,.2)}
.theme-btn{width:40px;height:40px;border-radius:50%;color:var(--text);font-size:14px;
  display:grid;place-items:center;transition:background .2s ease,transform .3s var(--ease-out)}
.theme-btn:hover{background:rgba(120,120,128,.12)}
.theme-btn:active{transform:scale(.94)}

/* =========================================================
   HERO
   ========================================================= */
.hero{
  width:100%;max-width:1180px;margin:0 auto;min-height:100svh;
  display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);
  align-items:center;gap:clamp(40px,6vw,80px);
  padding:calc(120px + var(--safe-top)) var(--pad-x) 60px;
}
.hero-content{position:relative;z-index:2}
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  padding:7px 14px 7px 12px;border-radius:999px;
  background:var(--glass-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);
  font-size:12px;color:var(--text-secondary);
  letter-spacing:-.01em;font-weight:500;
  margin-bottom:28px;
  box-shadow:inset 0 1px 0 var(--glass-specular);
  opacity:0;animation:fadeUp .9s .1s var(--ease-out) forwards;
}
.eyebrow-dot{width:6px;height:6px;background:#34c759;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 0 3px rgba(52,199,89,.18)}
h1{
  font-size:clamp(48px,9.5vw,112px);
  line-height:.94;letter-spacing:-.045em;font-weight:700;
  overflow:hidden;color:var(--text);
}
h1 .line{display:block;overflow:hidden}
h1 .word{display:inline-block;transform:translateY(110%);
  animation:riseUp 1.1s var(--ease-out) forwards}
h1 .line:nth-child(2) .word{animation-delay:.08s}
@keyframes riseUp{to{transform:translateY(0)}}
h1 .muted{color:var(--text-tertiary)}

.role{
  margin-top:24px;
  font-size:clamp(16px,1.7vw,20px);
  letter-spacing:-.02em;font-weight:500;color:var(--text-secondary);
  opacity:0;animation:fadeUp .9s .45s var(--ease-out) forwards;
  display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;
}
.role .sep{color:var(--text-quaternary);font-weight:400}
.role .accent{color:var(--text);font-weight:600}

.description{
  max-width:560px;margin-top:22px;
  color:var(--text-secondary);
  font-size:clamp(15px,1.6vw,17px);
  line-height:1.52941;letter-spacing:-.022em;
  opacity:0;animation:fadeUp .9s .55s var(--ease-out) forwards;
}
.description strong{color:var(--text);font-weight:500}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* Buttons — Apple pill style */
.actions{
  display:flex;gap:12px;margin-top:36px;flex-wrap:wrap;
  opacity:0;animation:fadeUp .9s .7s var(--ease-out) forwards;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 24px;border-radius:999px;
  font-size:15px;font-weight:500;letter-spacing:-.02em;
  transition:transform .25s var(--ease-out),background .25s ease,box-shadow .25s ease;
  min-height:48px;white-space:nowrap;
  position:relative;overflow:hidden;
}
.btn-primary{
  background:var(--accent);color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset, 0 4px 14px rgba(0,113,227,.28);
}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 8px 22px rgba(0,113,227,.36)}
.btn-primary:active{transform:scale(.97)}
.btn-secondary{
  background:var(--bg-elev);color:var(--text);
  border:1px solid var(--line);
}
.btn-secondary:hover{background:var(--glass-bg-strong);border-color:var(--line-strong)}
.btn-secondary:active{transform:scale(.97)}
.btn svg{width:14px;height:14px;flex-shrink:0;transition:transform .3s var(--ease-out)}
.btn:hover svg{transform:translateX(2px)}

/* Trust strip */
.trust{
  margin-top:44px;padding-top:28px;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;max-width:560px;
  opacity:0;animation:fadeUp .9s .85s var(--ease-out) forwards;
}
.trust-item{min-width:0}
.trust-label{font-size:11px;color:var(--text-tertiary);letter-spacing:.04em;
  text-transform:uppercase;font-weight:500;margin-bottom:6px}
.trust-value{font-size:14px;color:var(--text);font-weight:500;letter-spacing:-.015em;
  line-height:1.35;word-break:break-word}

/* =========================================================
   PORTRAIT
   ========================================================= */
.visual{
  position:relative;height:clamp(440px,68vh,680px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;animation:fadeIn 1.4s .2s var(--ease-out) forwards;
  min-width:0;
}
@keyframes fadeIn{to{opacity:1}}
.photo-aura{
  position:absolute;top:50%;left:50%;
  width:min(520px,80%);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle, rgba(120,120,140,.18), transparent 65%);
  filter:blur(50px);transform:translate(-50%,-50%);
  z-index:0;pointer-events:none;
}
body.dark .photo-aura{
  background:radial-gradient(circle, rgba(10,132,255,.16), transparent 65%);
}
.photo{
  position:relative;width:min(480px,100%);height:100%;
  object-fit:cover;z-index:2;
  mask-image:radial-gradient(ellipse 76% 84% at center 45%,
    #000 60%, rgba(0,0,0,.85) 76%, rgba(0,0,0,.3) 90%, transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 76% 84% at center 45%,
    #000 60%, rgba(0,0,0,.85) 76%, rgba(0,0,0,.3) 90%, transparent 100%);
}
.visual::after{
  content:"";position:absolute;inset:auto 0 0 0;height:26%;pointer-events:none;
  background:linear-gradient(to bottom,transparent,var(--bg) 92%);
  z-index:3;opacity:.9;
}

/* Floating glass badges */
.badge{
  position:absolute;padding:12px 15px;
  border-radius:16px;
  background:var(--glass-bg-strong);
  backdrop-filter:blur(40px) saturate(200%);
  -webkit-backdrop-filter:blur(40px) saturate(200%);
  border:1px solid var(--line);
  box-shadow:0 8px 32px rgba(0,0,0,.08), inset 0 1px 0 var(--glass-specular), inset 0 -1px 0 var(--glass-border-bottom);
  z-index:5;max-width:calc(100% - 24px);
  transition:transform .35s var(--ease-out),box-shadow .35s ease;
}
.badge::before{
  content:"";position:absolute;left:10%;right:10%;top:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--glass-specular),transparent);
  pointer-events:none;
}
.badge:hover{transform:translateY(-2px)}
.badge small{display:block;font-size:10px;color:var(--text-tertiary);
  letter-spacing:.05em;text-transform:uppercase;font-weight:500;margin-bottom:3px}
.badge strong{font-size:13px;font-weight:600;letter-spacing:-.015em;
  color:var(--text);display:flex;align-items:center;gap:6px;white-space:nowrap}
.badge-dot{width:6px;height:6px;border-radius:50%;background:#34c759;flex-shrink:0;
  box-shadow:0 0 0 3px rgba(52,199,89,.18)}
.badge.founder{left:0;bottom:14%}
.badge.status{right:0;top:14%}
.badge.gold{left:4%;top:8%}

/* =========================================================
   SECTIONS
   ========================================================= */
.section{
  width:100%;max-width:1080px;margin:0 auto;
  padding:var(--section-y) var(--pad-x);
  position:relative;
}
.section-tag{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;color:var(--text-tertiary);
  letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  margin-bottom:20px;
}
.section-tag::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent)}
.heading{
  font-size:clamp(32px,5.5vw,64px);
  line-height:1.05;letter-spacing:-.04em;font-weight:700;
  color:var(--text);max-width:22ch;text-wrap:balance;
}
.heading em{
  font-family:var(--font-serif);font-style:italic;font-weight:400;
  color:var(--text-tertiary);letter-spacing:-.02em;
}

/* =========================================================
   ABOUT
   ========================================================= */
.about-grid{
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  gap:clamp(40px,7vw,80px);align-items:start;
  margin-top:clamp(40px,6vw,64px);
}
.about-copy p{
  font-size:clamp(15px,1.6vw,17px);
  line-height:1.64706;letter-spacing:-.022em;
  color:var(--text-secondary);margin-bottom:22px;
}
.about-copy p:last-child{margin-bottom:0}
.about-copy p strong{color:var(--text);font-weight:500}

.facts{
  display:flex;flex-direction:column;gap:0;
  border-radius:20px;overflow:hidden;
  border:1px solid var(--line);
  background:var(--glass-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 4px 24px rgba(0,0,0,.04), inset 0 1px 0 var(--glass-specular);
}
.fact{
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  transition:background .2s ease;
}
.fact:last-child{border-bottom:0}
.fact:hover{background:rgba(120,120,128,.05)}
.fact-label{font-size:12px;color:var(--text-tertiary);letter-spacing:-.005em;font-weight:500;flex-shrink:0}
.fact-value{font-size:14px;color:var(--text);font-weight:500;letter-spacing:-.015em;text-align:right;word-break:break-word}

/* =========================================================
   STATS
   ========================================================= */
.stats{
  width:100%;max-width:1080px;margin:0 auto;
  padding:clamp(40px,7vw,72px) var(--pad-x);
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:clamp(16px,3vw,40px);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.stat-num{
  font-size:clamp(32px,4.5vw,52px);line-height:1;letter-spacing:-.045em;
  font-weight:700;color:var(--text);
  font-variant-numeric:tabular-nums;
}
.stat-num em{font-family:var(--font-serif);font-style:italic;font-weight:400;color:var(--accent)}
.stat-label{margin-top:10px;font-size:12px;color:var(--text-tertiary);
  letter-spacing:-.005em;line-height:1.4;font-weight:500}

/* =========================================================
   CARDS (services / tools / certs)
   ========================================================= */
.cards{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;margin-top:clamp(40px,6vw,60px);
}
.card{
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-radius:20px;
  padding:clamp(24px,3vw,32px);
  display:flex;flex-direction:column;
  min-height:clamp(220px,26vw,260px);
  transition:background .3s ease,transform .4s var(--ease-out),box-shadow .4s ease;
  position:relative;overflow:hidden;
}
.card:hover{
  background:var(--bg);
  transform:translateY(-2px);
  box-shadow:0 12px 40px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.03);
}
body.dark .card:hover{
  background:var(--bg-elev);
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.card-icon{
  width:44px;height:44px;border-radius:12px;
  background:var(--bg);
  border:1px solid var(--line);
  display:grid;place-items:center;font-size:20px;
  margin-bottom:24px;flex-shrink:0;
  box-shadow:inset 0 1px 0 var(--glass-specular);
}
body.dark .card-icon{background:#2c2c2e}
.card h3{
  font-size:clamp(17px,1.9vw,20px);
  line-height:1.2;letter-spacing:-.03em;font-weight:600;
  margin-bottom:10px;color:var(--text);
}
.card p{color:var(--text-secondary);font-size:14px;line-height:1.52941;letter-spacing:-.015em}
.card-tags{margin-top:auto;padding-top:20px;display:flex;flex-wrap:wrap;gap:6px}
.tag{
  font-size:10.5px;font-weight:500;
  padding:4px 10px;border-radius:999px;
  background:var(--bg);border:1px solid var(--line);
  color:var(--text-tertiary);letter-spacing:.02em;
  text-transform:uppercase;
}
body.dark .tag{background:#2c2c2e}

/* Tools — tighter grid */
.tools{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:20px;overflow:hidden;
  margin-top:clamp(40px,6vw,60px);
}
.tool{
  background:var(--bg-elev);
  padding:clamp(20px,3vw,28px) 12px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:background .25s ease;
  text-align:center;
}
.tool:hover{background:var(--bg)}
body.dark .tool:hover{background:#2c2c2e}
.tool-icon{
  width:40px;height:40px;border-radius:10px;
  background:var(--bg);border:1px solid var(--line);
  display:grid;place-items:center;font-size:18px;
}
body.dark .tool-icon{background:#2c2c2e}
.tool-name{font-size:12px;color:var(--text-secondary);font-weight:500;letter-spacing:-.005em;line-height:1.3}

/* =========================================================
   TIMELINE
   ========================================================= */
.timeline{
  margin-top:clamp(40px,6vw,60px);
  position:relative;padding-left:34px;
}
.timeline::before{
  content:"";position:absolute;left:8px;top:10px;bottom:10px;width:1px;
  background:var(--line-strong);
}
.t-item{position:relative;padding-bottom:clamp(36px,5vw,48px)}
.t-item:last-child{padding-bottom:0}
.t-dot{
  position:absolute;left:-34px;top:6px;
  width:17px;height:17px;border-radius:50%;
  background:var(--bg);
  border:1.5px solid var(--line-strong);
  display:grid;place-items:center;
}
.t-item:first-child .t-dot{
  background:var(--accent);border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(0,113,227,.15);
}
.t-date{
  font-size:11px;color:var(--text-tertiary);
  letter-spacing:.04em;text-transform:uppercase;font-weight:600;
  margin-bottom:8px;
}
.t-title{
  font-size:clamp(16px,1.9vw,18px);font-weight:600;
  letter-spacing:-.025em;margin-bottom:6px;color:var(--text);
}
.t-desc{font-size:14.5px;color:var(--text-secondary);line-height:1.52941;
  letter-spacing:-.015em;max-width:62ch}

/* =========================================================
   CERTIFICATIONS
   ========================================================= */
.certs{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;margin-top:clamp(40px,6vw,60px);
}
.cert{
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-radius:18px;
  padding:clamp(22px,2.6vw,28px);
  display:flex;flex-direction:column;gap:14px;
  transition:background .3s ease,transform .4s var(--ease-out);
}
.cert:hover{background:var(--bg);transform:translateY(-2px)}
body.dark .cert:hover{background:#2c2c2e}
.cert-badge{
  width:44px;height:44px;border-radius:12px;
  background:var(--bg);border:1px solid var(--line);
  display:grid;place-items:center;font-size:20px;
  box-shadow:inset 0 1px 0 var(--glass-specular);
}
body.dark .cert-badge{background:#2c2c2e}
.cert-title{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
.cert-sub{font-size:13px;color:var(--text-secondary);line-height:1.5;letter-spacing:-.01em}

/* =========================================================
   CTA
   ========================================================= */
.cta{
  width:100%;max-width:1080px;margin:0 auto;
  padding:var(--section-y) var(--pad-x);
  text-align:center;position:relative;
}
.cta-glow{
  position:absolute;width:min(720px,140vw);aspect-ratio:1;
  left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(0,113,227,.10), transparent 60%);
  filter:blur(80px);pointer-events:none;z-index:-1;
}
body.dark .cta-glow{background:radial-gradient(circle, rgba(10,132,255,.14), transparent 60%)}
.cta-title{
  font-size:clamp(36px,6.5vw,84px);
  line-height:1.02;letter-spacing:-.045em;font-weight:700;
  max-width:16ch;margin:20px auto 0;text-wrap:balance;
}
.cta-title em{font-family:var(--font-serif);font-style:italic;font-weight:400;color:var(--text-tertiary)}
.cta-sub{margin:22px auto 0;max-width:480px;color:var(--text-secondary);
  font-size:clamp(15px,1.6vw,17px);line-height:1.52941;letter-spacing:-.02em}
.cta-actions{margin-top:36px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

/* =========================================================
   FOOTER
   ========================================================= */
.footer{
  width:100%;max-width:1080px;margin:0 auto;
  padding:clamp(40px,5vw,60px) var(--pad-x) clamp(20px,3vw,30px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);
  gap:clamp(30px,5vw,60px);
}
.f-brand .brand{margin-bottom:16px}
.f-brand p{color:var(--text-secondary);font-size:13.5px;line-height:1.52941;max-width:38ch}
.f-col h4{
  font-size:11px;color:var(--text-tertiary);
  letter-spacing:.05em;text-transform:uppercase;font-weight:600;
  margin-bottom:14px;
}
.f-col a{

  font-size:13.5px;letter-spacing:-.015em;

}
.f-col a:hover{color:var(--text)}
.f-bottom{

  padding:22px var(--pad-x) calc(32px + var(--safe-bottom));
  display:flex;justify-content:space-between;align-items:center;
  gap:16px;flex-wrap:wrap;
  font-size:12px;color:var(--text-tertiary);
  letter-spacing:-.01em;

.f-status{display:inline-flex;align-items:center;gap:8px}
.f-status-dot{width:6px;height:6px;border-radius:50%;background:#34c759;flex-shrink:0;
  box-shadow:0 0 0 3px rgba(52,199,89,.18)}

/* =========================================================
   REVEAL
   ========================================================= */
.reveal{opacity:0;transform:translateY(24px);
  transition:opacity 1.1s var(--ease-out),transform 1.1s var(--ease-out)}
.reveal.visible{opacity:1;transform:translateY(0)}

const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const merge = (def, src) => {
  if (Array.isArray(def)) return Array.isArray(src) ? src : def;
  if (def && typeof def === 'object') {
    const out = {...def};
    if (src && typeof src === 'object') for (const k in def) if (k in src) out[k] = merge(def[k], src[k]);
    return out;
  }
  return (src === undefined || src === null || src === '') ? def : src;
};

    <h2 class="cta-title">${esc(d.cta.title)}<br><em>${esc(d.cta.titleEm)}</em></h2>
    <p class="cta-sub">${esc(d.cta.sub)}</p>
    <div class="cta-actions">
      <a href="${esc(d.cta.primaryBtnLink)}" class="btn btn-primary">
        <span>${esc(d.cta.primaryBtnText)}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a href="${esc(d.cta.secondaryBtnLink)}" class="btn btn-secondary"><span>${esc(d.cta.secondaryBtnText)}</span></a>
    </div>`;

  document.getElementById('footerSection').innerHTML = `
    <div class="f-brand">
      <div class="brand"><span class="brand-glyph"></span>${esc(d.nav.brandName)}<span>${esc(d.nav.brandSub)}</span></div>
      <p>${esc(d.footer.brandText)}</p>
    </div>
    ${d.footer.columns.map(col=>`
      <div class="f-col">
        <h4>${esc(col.title)}</h4>
        ${col.links.map(l=>`<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('')}
      </div>`).join('')}`;

  document.getElementById('footerBottom').innerHTML = `
    <span>${esc(d.footer.copyright)}</span>
    <span class="f-status"><span class="f-status-dot"></span>${esc(d.footer.statusText)}</span>`;

  attachInteractions();
}

/* ======================= INTERACTIONS ======================= */
function attachInteractions(){
  const io = new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}}),{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

  const visual=document.querySelector('.visual');
  const photo=document.querySelector('.photo');
  if(visual&&photo && window.matchMedia('(hover:hover)').matches){
    visual.addEventListener('pointermove',e=>{
      const r=visual.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
      photo.style.transform=`translate(${px*-8}px,${py*-8}px) scale(1.01)`;
    });
    visual.addEventListener('pointerleave',()=>{photo.style.transform='translate(0,0) scale(1)';});
  }
}

/* ======================= THEME ======================= */
const theme=document.getElementById('theme');
if(localStorage.getItem('theme')==='dark') document.body.classList.add('dark');
theme.addEventListener('click',()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');
});

/* ======================= AMBIENT PARALLAX ======================= */
const orbs=document.querySelectorAll('.ambient-orb');
let raf=null;
window.addEventListener('mousemove',e=>{
  if(raf)return;
  raf=requestAnimationFrame(()=>{
    raf=null;
    const x=(e.clientX/window.innerWidth-.5)*30, y=(e.clientY/window.innerHeight-.5)*30;
    orbs.forEach((o,i)=>{const m=i+1; o.style.transform=`translate(${x*m}px,${y*m}px)`;});
  });
},{passive:true});

/* ======================= BOOT ======================= */
(async function boot(){
  let remote = {};
  try{
    const r = await fetch('/api/data',{cache:'no-store'});
    if(r.ok) remote = await r.json();
  }catch(e){}
  const data = merge(DEFAULT_DATA, remote || {});
  renderAll(data);
})();
</script>
