<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="pageTitle">Eshwar Goud — Chartered Accountant (Intern)</title>
<meta name="description" id="pageDesc" content="Eshwar Goud — CA intern specialising in audit, taxation, and forensic accounting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7;--bg-elev:#fff;--text:#0a0a0c;--muted:#6e6e73;--muted-2:#8e8e93;
  --blue:#0071e3;--blue-bright:#1877F2;--line:rgba(0,0,0,.08);
  --glass:rgba(255,255,255,.68);--glass-border:rgba(255,255,255,.72);
  --grain-blend:multiply;--grain-opacity:.035;
  --shadow-deep:0 30px 90px rgba(0,0,0,.12);
  --accent-green:#22c55e;--accent-gold:#d4a017;
}
body.dark{
  --bg:#000;--bg-elev:#0a0a0c;--text:#f5f5f7;--muted:#98989f;--muted-2:#7c7c84;
  --blue:#1877F2;--blue-bright:#4A9BFF;--line:rgba(255,255,255,.10);
  --glass:rgba(20,20,20,.72);--glass-border:rgba(255,255,255,.12);
  --grain-blend:overlay;--grain-opacity:.045;
  --shadow-deep:0 30px 90px rgba(0,0,0,.6);--accent-gold:#e8b923;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg);-webkit-font-smoothing:antialiased}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.5;letter-spacing:-.011em;transition:background .45s ease,color .45s ease}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block;max-width:100%;height:auto}
::selection{background:var(--blue);color:#fff}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-2}
.blue-light{position:absolute;width:640px;height:640px;border-radius:50%;background:rgba(0,113,227,.10);filter:blur(140px);transition:opacity .45s ease,transform 1.2s cubic-bezier(.22,1,.36,1);will-change:transform}
.blue-light.one{top:-350px;left:-200px}.blue-light.two{right:-350px;bottom:-300px}
body.dark .blue-light{opacity:0}
.grid{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.16;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;mask-image:linear-gradient(to bottom,black,transparent 70%);-webkit-mask-image:linear-gradient(to bottom,black,transparent 70%)}
.grain{position:fixed;inset:-100%;pointer-events:none;z-index:9999;opacity:var(--grain-opacity);background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px 200px;animation:grain 8s steps(6) infinite;mix-blend-mode:var(--grain-blend)}
@keyframes grain{0%,100%{transform:translate(0,0)}10%{transform:translate(-5%,-8%)}20%{transform:translate(-12%,4%)}30%{transform:translate(6%,-12%)}40%{transform:translate(-4%,14%)}50%{transform:translate(-12%,8%)}60%{transform:translate(12%,0)}70%{transform:translate(0,12%)}80%{transform:translate(3%,14%)}90%{transform:translate(-8%,6%)}}
.cursor-light{position:fixed;width:640px;height:640px;border-radius:50%;pointer-events:none;z-index:-1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(0,113,227,.13),transparent 65%);filter:blur(60px);opacity:0;transition:opacity .9s ease;mix-blend-mode:var(--grain-blend);will-change:transform}
body:hover .cursor-light{opacity:.5}
body.dark .cursor-light{background:radial-gradient(circle,rgba(24,119,242,.18),transparent 65%)}
nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);width:min(960px,calc(100% - 30px));z-index:100}
.nav{height:54px;display:flex;align-items:center;justify-content:space-between;padding:7px 8px 7px 18px;border:1px solid var(--glass-border);border-radius:999px;background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:0 20px 60px rgba(0,0,0,.07),inset 0 1px rgba(255,255,255,.7)}
body.dark .nav{box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.05)}
.brand{font-size:13px;font-weight:600;letter-spacing:-.025em;display:flex;align-items:center;gap:8px}
.brand-glyph{width:18px;height:18px;border-radius:50%;background:linear-gradient(140deg,var(--text) 0%,color-mix(in srgb,var(--text) 70%,transparent) 100%);position:relative;box-shadow:0 0 12px rgba(0,113,227,.35)}
.brand-glyph::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg)}
.brand-glyph::after{content:"";position:absolute;width:5px;height:5px;right:2px;bottom:2px;border-radius:50%;background:var(--accent-gold);box-shadow:0 0 8px var(--accent-gold)}
.brand span{color:var(--muted);font-weight:400}
.nav-right{display:flex;align-items:center;gap:3px}
.nav-link{color:var(--muted);font-size:12px;padding:9px 14px;border-radius:999px;transition:.25s;display:inline-flex;align-items:center;gap:6px}
.nav-link:hover{color:var(--text);background:rgba(127,127,127,.1)}
.nav-link-status{width:6px;height:6px;border-radius:50%;background:var(--accent-green);box-shadow:0 0 8px rgba(34,197,94,.7);animation:pulseDot 2.4s ease-in-out infinite}
.theme{width:36px;height:36px;border-radius:50%;color:var(--text);font-size:15px;display:grid;place-items:center;transition:.3s}
.theme:hover{background:rgba(127,127,127,.12);transform:rotate(20deg)}
.hero{width:min(1250px,calc(100% - 40px));min-height:100vh;margin:auto;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:60px;padding-top:70px;position:relative}
.hero-content{position:relative;z-index:3}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:28px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:0;animation:fadeUp 1s .1s cubic-bezier(.22,1,.36,1) forwards}
.eyebrow-dot{width:6px;height:6px;background:var(--accent-gold);border-radius:50%;box-shadow:0 0 12px rgba(212,160,23,.65);animation:pulseDot 2.4s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}
h1{font-size:clamp(60px,8.6vw,122px);line-height:.86;letter-spacing:-.085em;font-weight:800;overflow:hidden}
h1 .line{display:block;overflow:hidden}
h1 .word{display:inline-block;transform:translateY(110%);animation:riseUp 1.2s cubic-bezier(.22,1,.36,1) forwards}
h1 .line:nth-child(2) .word{animation-delay:.1s}
@keyframes riseUp{to{transform:translateY(0)}}
h1 .gray{color:var(--muted)}
.role{margin-top:32px;font-size:clamp(17px,1.9vw,23px);letter-spacing:-.035em;font-weight:500;opacity:0;animation:fadeUp 1s .5s cubic-bezier(.22,1,.36,1) forwards;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.role .separator{color:var(--muted-2);margin:0 4px;font-weight:400}
.role .company{color:var(--accent-gold);font-weight:600}
.description{max-width:560px;margin-top:22px;color:var(--muted);font-size:15.5px;line-height:1.7;opacity:0;animation:fadeUp 1s .65s cubic-bezier(.22,1,.36,1) forwards}
.description strong{color:var(--text);font-weight:500}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.actions{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap;opacity:0;animation:fadeUp 1s .8s cubic-bezier(.22,1,.36,1) forwards}
.button{display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--text);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:12.5px;font-weight:600;letter-spacing:-.005em;transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s ease,background .3s ease;position:relative;overflow:hidden}
.button:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.1)}
.button.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 10px 30px rgba(0,113,227,.25)}
.button.primary::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-100%);transition:transform .9s cubic-bezier(.22,1,.36,1)}
.button.primary:hover::before{transform:translateX(100%)}
.button.primary:hover{background:var(--blue-bright);box-shadow:0 16px 40px rgba(0,113,227,.4)}
.button span{position:relative;z-index:1}
.button svg{width:13px;height:13px;position:relative;z-index:1;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.button:hover svg{transform:translateX(3px)}
.trust{margin-top:44px;padding-top:28px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:560px;opacity:0;animation:fadeUp 1s .95s cubic-bezier(.22,1,.36,1) forwards}
.trust-item{position:relative;padding-left:12px}
.trust-item::before{content:"";position:absolute;left:0;top:5px;width:1px;height:11px;background:var(--accent-gold);opacity:.7}
.trust-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.trust-value{margin-top:6px;font-size:13px;font-weight:500;letter-spacing:-.015em;color:var(--text)}
.visual{position:relative;height:660px;display:flex;align-items:center;justify-content:center;opacity:0;animation:fadeIn 1.6s .3s cubic-bezier(.22,1,.36,1) forwards}
@keyframes fadeIn{to{opacity:1}}
.photo-aura{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(212,160,23,.18),rgba(212,160,23,.04) 45%,transparent 70%);filter:blur(30px);transition:opacity .45s ease;animation:auraPulse 8s ease-in-out infinite;z-index:0;pointer-events:none}
@keyframes auraPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
body.dark .photo-aura{opacity:0;animation:none}
.photo{position:relative;width:min(500px,100%);height:640px;object-fit:cover;filter:saturate(1) contrast(1.02);z-index:2;mask-image:radial-gradient(ellipse 78% 82% at center 45%,#000 62%,rgba(0,0,0,.85) 78%,rgba(0,0,0,.35) 90%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 78% 82% at center 45%,#000 62%,rgba(0,0,0,.85) 78%,rgba(0,0,0,.35) 90%,transparent 100%)}
.visual::after{content:"";position:absolute;inset:auto 0 0 0;height:28%;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg) 92%);z-index:3;opacity:.85}
.badge{position:absolute;padding:14px 17px;border:1px solid var(--glass-border);border-radius:16px;background:var(--glass);backdrop-filter:blur(25px) saturate(160%);-webkit-backdrop-filter:blur(25px) saturate(160%);box-shadow:0 20px 50px rgba(0,0,0,.1),inset 0 1px rgba(255,255,255,.6);z-index:5;transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s ease}
body.dark .badge{box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.08)}
.badge:hover{transform:translateY(-3px);box-shadow:var(--shadow-deep)}
.badge small{display:block;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.badge strong{font-size:13px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:7px}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-green);box-shadow:0 0 8px rgba(34,197,94,.7);animation:pulseDot 2.4s ease-in-out infinite}
.badge.founder{left:0;bottom:110px;animation:floatOne 7s ease-in-out infinite}
.badge.status{right:-10px;top:110px;animation:floatTwo 8s ease-in-out infinite}
.badge.gold{left:20px;top:70px;animation:floatThree 9s ease-in-out infinite}
@keyframes floatOne{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes floatTwo{0%,100%{translate:0 0}50%{translate:0 10px}}
@keyframes floatThree{0%,100%{translate:0 0}50%{translate:0 -6px}}
.section{width:min(1100px,calc(100% - 40px));margin:auto;padding:120px 0;position:relative}
.section-tag{display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:28px}
.section-tag::before{content:"";width:20px;height:1px;background:var(--accent-gold)}
.section-heading{font-size:clamp(36px,4.6vw,64px);line-height:1;letter-spacing:-.05em;font-weight:600;max-width:20ch;color:var(--text)}
.section-heading em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;color:var(--accent-gold);letter-spacing:-.02em}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start;margin-top:60px}
.about-copy p{font-size:17px;line-height:1.75;color:var(--muted);margin-bottom:22px;letter-spacing:-.012em}
.about-copy p:last-child{margin-bottom:0}
.about-copy p strong{color:var(--text);font-weight:500}
.about-facts{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.fact{background:var(--bg);padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px;transition:background .4s ease}
.fact:hover{background:var(--bg-elev)}
.fact-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.fact-value{font-size:14px;font-weight:500;letter-spacing:-.015em;color:var(--text);text-align:right}
.stats-strip{width:min(1100px,calc(100% - 40px));margin:auto;padding:60px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
.stat-item .stat-num{font-size:clamp(32px,4vw,48px);line-height:1;letter-spacing:-.05em;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.stat-item .stat-num em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;color:var(--accent-gold)}
.stat-item .stat-label{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.focus-grid,.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:28px;overflow:hidden;margin-top:56px}
.focus-card,.service-card{background:var(--bg);padding:36px 30px 40px;min-height:260px;display:flex;flex-direction:column;transition:background .4s ease;position:relative;overflow:hidden}
.focus-card::before,.service-card::before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%),rgba(212,160,23,.08),transparent 45%);opacity:0;transition:opacity .5s ease;pointer-events:none}
.focus-card:hover,.service-card:hover{background:var(--bg-elev)}
.focus-card:hover::before,.service-card:hover::before{opacity:1}
.focus-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.1em}
.focus-content{margin-top:auto;position:relative;z-index:1}
.focus-card h3,.service-card h3{font-size:20px;line-height:1.15;letter-spacing:-.035em;font-weight:600;margin-bottom:12px;color:var(--text)}
.focus-card p,.service-card p{color:var(--muted);font-size:13.5px;line-height:1.65;letter-spacing:-.008em}
.service-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,rgba(212,160,23,.15),rgba(0,113,227,.1));border:1px solid var(--line);display:grid;place-items:center;font-size:20px;margin-bottom:24px}
.service-tags{margin-top:auto;padding-top:20px;display:flex;flex-wrap:wrap;gap:6px}
.service-tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;padding:4px 9px;border-radius:999px;background:rgba(127,127,127,.08);border:1px solid var(--line);color:var(--muted);letter-spacing:.05em}
.tools-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:24px;overflow:hidden;margin-top:56px}
.tool-cell{background:var(--bg);padding:28px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:background .4s ease;text-align:center}
.tool-cell:hover{background:var(--bg-elev)}
.tool-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,rgba(0,113,227,.1),rgba(212,160,23,.08));border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.tool-name{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:-.01em}
.timeline{margin-top:56px;position:relative;padding-left:36px}
.timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:var(--line-strong,var(--line))}
.timeline-item{position:relative;padding-bottom:44px}
.timeline-item:last-child{padding-bottom:0}
.timeline-dot{position:absolute;left:-36px;top:4px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--accent-gold);box-shadow:0 0 12px rgba(212,160,23,.4)}
.timeline-item:first-child .timeline-dot{background:var(--accent-gold);box-shadow:0 0 16px rgba(212,160,23,.7)}
.timeline-date{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--accent-gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.timeline-title{font-size:18px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px;color:var(--text)}
.timeline-desc{font-size:14px;color:var(--muted);line-height:1.65;letter-spacing:-.01em;max-width:60ch}
.cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:24px;overflow:hidden;margin-top:56px}
.cert-card{background:var(--bg);padding:32px 28px;display:flex;flex-direction:column;gap:14px;transition:background .4s ease}
.cert-card:hover{background:var(--bg-elev)}
.cert-badge{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,rgba(212,160,23,.2),rgba(212,160,23,.05));border:1px solid rgba(212,160,23,.3);display:grid;place-items:center;font-size:16px}
.cert-title{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
.cert-sub{font-size:12.5px;color:var(--muted);line-height:1.5;letter-spacing:-.008em}
.cta-section{width:min(1100px,calc(100% - 40px));margin:auto;padding:120px 0 100px;text-align:center;position:relative}
.cta-glow{position:absolute;width:700px;height:700px;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(212,160,23,.12),transparent 60%);filter:blur(80px);pointer-events:none;z-index:-1}
body.dark .cta-glow{background:radial-gradient(circle,rgba(232,185,35,.18),transparent 60%)}
.cta-title{margin-top:24px;font-size:clamp(44px,6vw,88px);line-height:.94;letter-spacing:-.055em;font-weight:600;max-width:16ch;margin-left:auto;margin-right:auto}
.cta-title em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;color:var(--accent-gold);letter-spacing:-.02em}
.cta-sub{margin:26px auto 0;max-width:480px;color:var(--muted);font-size:15.5px;line-height:1.65}
.cta-actions{margin-top:38px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
footer{width:min(1100px,calc(100% - 40px));margin:auto;padding:40px 0 50px;border-top:1px solid var(--line);display:grid;grid-template-columns:2fr 1fr 1fr;gap:60px}
.footer-brand .brand{margin-bottom:14px}
.footer-brand p{color:var(--muted);font-size:13px;line-height:1.6;max-width:36ch}
.footer-col h4{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:400;margin-bottom:16px}
.footer-col a{display:block;padding:6px 0;color:var(--muted);font-size:13px;letter-spacing:-.01em;transition:color .3s ease;width:fit-content}
.footer-col a:hover{color:var(--text)}
.footer-bottom{width:min(1100px,calc(100% - 40px));margin:auto;padding:26px 0 40px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.02em}
.footer-status{display:inline-flex;align-items:center;gap:8px}
.footer-status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-green);box-shadow:0 0 10px rgba(34,197,94,.6);animation:pulseDot 2.4s ease-in-out infinite}

/* ======================= HELPERS ======================= */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const merge = (def, src) => {
  if (Array.isArray(def)) return Array.isArray(src) ? src : def;
  if (def && typeof def === 'object') {
    const out = {...def};
    if (src && typeof src === 'object') for (const k in def) if (k in src) out[k] = merge(def[k], src[k]);
    return out;
  }
  return (src === undefined || src === null || src === '') ? def : src;
};

/* ======================= INTERACTIONS ======================= */
let attached = false;
function attachInteractions(){
  // reveal
  const io = new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}}),{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

  // card tracking
  document.querySelectorAll('.tilt,.tilt-coverage').forEach(card=>{
    card.addEventListener('pointermove',e=>{
      const r=card.getBoundingClientRect();
      card.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
      card.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
    });
  });

  // photo parallax
  const visual=document.querySelector('.visual');
  const photo=document.querySelector('.photo');
  if(visual&&photo){
    visual.addEventListener('pointermove',e=>{
      const r=visual.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
      photo.style.transform=`translate(${px*-10}px,${py*-10}px) scale(1.01)`;
    });
    visual.addEventListener('pointerleave',()=>{photo.style.transform='translate(0,0) scale(1)';});
  }
}

/* ======================= THEME + FX ======================= */
const theme=document.getElementById('theme');
if(localStorage.getItem('theme')==='dark') document.body.classList.add('dark');
theme.addEventListener('click',()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');
});

const lights=document.querySelectorAll('.blue-light');
window.addEventListener('mousemove',e=>{
  if(document.body.classList.contains('dark'))return;
  const x=(e.clientX/window.innerWidth-.5)*22, y=(e.clientY/window.innerHeight-.5)*22;
  lights.forEach((l,i)=>{const m=i+1; l.style.transform=`translate(${x*m}px,${y*m}px)`;});
});

const light=document.getElementById('cursorLight');
let mx=0,my=0,lx=0,ly=0,rafId;
window.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(!rafId)rafId=requestAnimationFrame(tick);});
function tick(){lx+=(mx-lx)*.09;ly+=(my-ly)*.09;light.style.left=lx+'px';light.style.top=ly+'px';
  if(Math.abs(mx-lx)>.1||Math.abs(my-ly)>.1)rafId=requestAnimationFrame(tick);else rafId=null;}

/* ======================= BOOT ======================= */
(async function boot(){
  let remote = {};
  try{
    const r = await fetch('/api/data',{cache:'no-store'});
    if(r.ok) remote = await r.json();
  }catch(e){ /* offline / not deployed — use defaults */ }
  const data = merge(DEFAULT_DATA, remote || {});
  renderAll(data);
})();
